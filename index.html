<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: ULTIMATE</title>
<style>
:root{--bg:#0a0a0a;--app:#161616;--card:#1f1f1f;--card2:#252525;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2e2e2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
#app{width:100%;max-width:420px;height:96vh;max-height:820px;background:var(--app);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:#1c1c1c;padding:6px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase}
.status>div b{display:block;color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.48em;font-weight:700;color:rgba(255,255,255,.7)}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.timeline{display:flex;gap:3px;padding:5px 8px;background:#1c1c1c;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl-age{padding:3px 6px;border-radius:6px;background:#2a2a2a;font-size:.6em;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .3s}
.tl-age.active{background:var(--green);color:white;font-weight:800;transform:scale(1.15);box-shadow:0 0 12px rgba(76,175,80,.6)}
.tl-age.done{background:#1a3a1a;color:#4caf50}
.content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--green-d)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}.btn-dark{background:#0a0a0a;border:1px solid #333}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.event-box.critical{background:linear-gradient(135deg,#3a0a0a,#4a1010);border-left-color:var(--red)}
.event-box.critical b{color:var(--red)}
.event-box.good{background:linear-gradient(135deg,#0a2a0a,#103a10);border-left-color:var(--green)}
.event-box.good b{color:var(--green)}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.dilemma-box .ttl{font-size:.75em;font-weight:800;color:#9c9cff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.dilemma-box .txt{font-size:.85em;line-height:1.5;color:#ddd;margin-bottom:12px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;border-color:#7a7aff;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:#1a1a1a;border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.fifa-match{background:linear-gradient(135deg,#1a2a3a,#0f1a25);border-radius:12px;padding:9px 11px;margin-bottom:6px;border:1px solid #2a4a6a}
.fifa-match.w{border-color:#2e7d32;background:linear-gradient(135deg,#1a2a1a,#0f250f)}
.fifa-match.l{border-color:#7d2e2e;background:linear-gradient(135deg,#2a1a1a,#250f0f)}
.fifa-match.d{border-color:#7d5a2e;background:linear-gradient(135deg,#2a241a,#25200f)}
.fifa-match.miss{opacity:.4;filter:grayscale(.8)}
.fifa-comp{font-size:.55em;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between}
.fifa-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fifa-team{display:flex;align-items:center;gap:6px;font-size:.72em;font-weight:600}
.fifa-team.home{justify-content:flex-end;text-align:right}
.fifa-team.away{justify-content:flex-start;text-align:left}
.fifa-team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:105px}
.fifa-score{background:#000;color:var(--yellow);font-weight:900;font-size:1em;padding:3px 9px;border-radius:6px;letter-spacing:2px;font-family:'Courier New',monospace;border:1px solid #333}
.fifa-foot{display:flex;justify-content:center;gap:10px;margin-top:5px;font-size:.65em;color:var(--muted);flex-wrap:wrap}
.fifa-goal{color:var(--green);font-weight:700}.fifa-assist{color:var(--blue);font-weight:700}
.fifa-card-y{color:#ffeb3b}.fifa-card-r{color:#f44336}
.fifa-badge{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:50%;padding:1px;flex-shrink:0}
.train-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.train-btn{background:#2a2a2a;border:1.5px solid #3a3a3a;color:var(--text);padding:8px 3px;border-radius:9px;font-size:.6em;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.train-btn:hover{background:var(--purple);border-color:#9c27b0}
.train-btn .val{display:block;font-size:1.5em;color:var(--yellow);margin-top:2px;font-weight:800}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.shop-btn{background:#1a1a1a;border:1px solid #333;color:var(--text);padding:8px;border-radius:9px;font-size:.62em;cursor:pointer;text-align:center;font-family:inherit}
.shop-btn:hover{background:#2a2a2a;border-color:var(--green)}
.shop-btn b{display:block;font-size:.95em;margin-bottom:2px}
.shop-btn small{color:var(--muted);font-size:.85em;display:block;line-height:1.2}
.shop-btn.bought{border-color:var(--green);background:#1a2a1a;opacity:.7}
.shop-btn:disabled{opacity:.4;cursor:not-allowed}
.club-card{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px;margin-bottom:6px;border-left:3px solid var(--green);cursor:pointer}
.club-card:hover{background:#2a2a2a}
.club-logo{width:34px;height:34px;object-fit:contain;background:white;border-radius:50%;padding:3px;flex-shrink:0}
.club-info{flex:1;min-width:0}
.club-info h3{font-size:.82em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-info p{font-size:.65em;color:var(--muted);margin-top:1px}
.summary-bar{display:flex;justify-content:space-around;background:#1a1a1a;border-radius:9px;padding:8px;margin-bottom:10px;font-size:.62em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.start-hero{text-align:center;padding:15px 10px;margin-bottom:8px}
.start-hero h1{font-size:1.3em;background:linear-gradient(135deg,#4caf50,#2196f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;letter-spacing:2px;margin-bottom:6px}
.start-hero p{font-size:.72em;color:var(--muted)}
.field-label{font-size:.68em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;font-weight:700}
.input-row{display:flex;gap:6px}
.input-box{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:9px;padding:10px 12px;color:var(--text);font-size:.85em;font-family:inherit;font-weight:600}
.input-box:focus{outline:none;border-color:var(--purple)}
.roll-btn{background:var(--purple);border:none;border-radius:9px;padding:0 14px;color:white;font-size:1.1em;cursor:pointer;font-weight:700}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pos-btn{background:#1a1a1a;border:2px solid #333;color:var(--muted);padding:8px 3px;border-radius:9px;font-size:.65em;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.pos-btn.sel{background:var(--green);color:#000;border-color:var(--green);transform:scale(1.03)}
.nt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:150px;overflow-y:auto;padding-right:4px}
.nt-btn{background:#1a1a1a;border:2px solid #333;color:var(--text);padding:5px 2px;border-radius:9px;font-size:.55em;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.nt-btn.sel{border-color:var(--green);background:#1a2a1a}
.nt-btn img{width:22px;height:15px;object-fit:cover;border-radius:2px;display:block;margin:0 auto 3px}
.nt-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.age-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.age-btn{background:#1a1a1a;border:2px solid #333;color:var(--text);padding:8px 3px;border-radius:9px;font-size:.7em;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.age-btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.age-btn small{display:block;font-size:.85em;color:var(--muted);font-weight:500;margin-top:2px}
.age-btn.sel small{color:rgba(255,255,255,.85)}
.group-table{background:#1a1a1a;border-radius:10px;padding:6px;font-size:.68em;margin-bottom:6px}
.gt-row{display:grid;grid-template-columns:18px 1fr 22px 22px 22px 28px;gap:4px;padding:4px;align-items:center;border-bottom:1px solid #252525}
.gt-row:last-child{border:none}
.gt-row.head{color:var(--muted);font-size:.85em;font-weight:700;text-transform:uppercase}
.gt-row.you{background:#1a2a1a;border-radius:5px;color:var(--yellow);font-weight:700}
.gt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.gt-name img{width:16px;height:11px;object-fit:cover;border-radius:2px}
.gt-pts{font-weight:800;color:var(--yellow);text-align:center}
.agent-card{background:linear-gradient(135deg,#2a1a3a,#1a0f25);border:1px solid #5a3a7a;border-radius:12px;padding:12px;margin-bottom:10px}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.3em}
.agent-name{font-size:.85em;font-weight:700}
.agent-name small{display:block;color:var(--muted);font-weight:400;font-size:.85em}
.agent-msg{font-size:.75em;line-height:1.4;color:#ddd;background:#1a1a1a;padding:8px 10px;border-radius:8px;margin-bottom:8px;border-left:2px solid var(--purple)}
.sponsor-card{background:linear-gradient(135deg,#1a3a1a,#0f250f);border:1px solid #2e7d32;border-radius:12px;padding:12px;margin-bottom:8px}
.sponsor-logo{width:80px;height:50px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9em;color:#000;margin-bottom:8px}
.sponsor-name{font-size:.9em;font-weight:700}
.sponsor-value{font-size:.75em;color:var(--green);font-weight:700;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:#1a1a1a;border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}
.detail-row .nm{color:var(--text)}.detail-row .val{font-weight:800;color:var(--yellow)}
.detail-row.sub{background:#151515;margin-left:12px;font-size:.68em}
.detail-head{font-size:.7em;font-weight:800;color:var(--orange);text-transform:uppercase;margin:8px 0 4px}
.stat-click{background:linear-gradient(135deg,#1a2a3a,#0f1a25);border:1px solid #2a4a6a;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.stat-click:hover{border-color:var(--blue)}
.stat-click .label{font-size:.65em;color:var(--muted);text-transform:uppercase}
.stat-click .value{font-size:1.5em;font-weight:800;color:var(--yellow);margin-top:2px}
.stat-click .hint{font-size:.6em;color:var(--muted);margin-top:2px}
.ach-card{background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid #7a7a2a;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:.7em}
.ach-card .ttl{font-weight:800;color:var(--yellow)}
.ach-card .desc{color:var(--muted);font-size:.9em;margin-top:2px}
.ach-card.locked{opacity:.35;filter:grayscale(.7)}
.ach-card.new{animation:glow 1.5s ease infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,235,59,0)}50%{box-shadow:0 0 12px rgba(255,235,59,.6)}}
.end-hero{text-align:center;padding:10px 0}
.end-hero h2{font-size:1.1em;color:var(--yellow);margin-bottom:6px}
.end-hero .legacy{font-size:.9em;font-weight:800;margin:8px 0;padding:8px;background:linear-gradient(135deg,#2a1a4a,#4a1a6a);border-radius:10px}
.end-hero .cause{font-size:.75em;color:var(--red);margin-top:6px;font-style:italic}
.history-item{background:#1a1a1a;border-radius:8px;padding:8px;margin-bottom:5px;font-size:.72em;cursor:pointer}
.history-head{display:flex;justify-content:space-between;align-items:center}
.history-details{display:none;margin-top:6px;padding-top:6px;border-top:1px solid #333;font-size:.9em}
.history-item.open .history-details{display:block}
.text-center{text-align:center}.mb-8{margin-bottom:8px}.mt-8{margin-top:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}.hl-g{color:var(--green);font-weight:700}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:14px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;border:1px solid var(--border)}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}
.modal-close{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:.8em;margin-top:10px;font-family:inherit}
.mentor-card{background:linear-gradient(135deg,#0a2a3a,#051a25);border:1px solid #2e6a7d;border-radius:12px;padding:12px;margin-bottom:10px}
.mentor-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mentor-card .nm{font-weight:800;color:var(--yellow);font-size:.9em}
.mentor-card .pos{font-size:.65em;color:var(--muted)}
.mentor-card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.55em;text-align:center;margin-top:6px}
.mentor-card .stats>div{background:#0a1a25;border-radius:6px;padding:4px 2px;color:var(--muted)}
.mentor-card .stats>div b{display:block;color:var(--yellow);font-size:1.4em;font-weight:800}
.coach-badge{background:linear-gradient(135deg,#4a148c,#7b1fa2);border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.coach-badge .ico{font-size:2.2em}
.coach-badge .ttl{font-weight:800;color:var(--yellow);font-size:.95em;margin-top:4px}
.coach-badge .sub{font-size:.7em;color:var(--muted);margin-top:2px}
.year-tag{display:inline-block;background:var(--purple);color:#fff;padding:1px 6px;border-radius:4px;font-size:.75em;font-weight:800;margin-right:4px}
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div class="hdr-title" id="hdrName">⚽ My Career<small>ULTIMATE</small></div><div class="hdr-tr" id="trophyBox"><span id="tClub">🏆 0</span><span id="tCL">⭐ 0</span><span id="tNT">🌍 0</span></div></div>
  <div class="status" id="statusBar" style="display:none">

    <div>PAC<b id="stPac">-</b></div><div>SHO<b id="stSho">-</b></div><div>PAS<b id="stPas">-</b></div><div>DRI<b id="stDri">-</b></div><div>DEF<b id="stDef">-</b></div><div>PHY<b id="stPhy">-</b></div><div>TRS<b id="stTrust">-</b></div>

  <div class="content" id="content"></div>

</div>
<script>

const CLUBS=[

{name:"Лестер",country:"Англия",flag:"gb-eng",str:74,tier:1},{name:"Брайтон",country:"Англия",flag:"gb-eng",str:78,tier:1},

  <button class="btn btn-red" onclick="endCareer('Решение игрока')">🏁 ЗАВЕРШИТЬ КАРЬЕРУ</button>`;

}
function renderShopItems(){const owned=p.shopOwned||[];return SHOP.map(item=>{const have=owned.includes(item.id);const canBuy=p.money>=item.p;return `<button class="shop-btn ${have?'bought':''}" ${have||!canBuy?'disabled':''} onclick="buyShop('${item.id}')"><b>${item.n}</b><small>€${fmt(item.p)}</small><small style="color:var(--green)">${item.e}</small></button>`}).join('')}
function buyShop(id){const item=SHOP.find(x=>x.id===id);if(!item)return;const owned=p.shopOwned||[];if(owned.includes(id)||p.money<item.p)return;p.money-=item.p;item.fn();if(id!=='crypto'&&id!=='transfer'&&id!=='extraTP')owned.push(id);p.shopOwned=owned;p.ovr=calcOvr();save();if(p.forceTransfer){p.forceTransfer=false;save();showForceTransfer();return}showTraining()}
function showForceTransfer(){content.innerHTML=`<div class="card"><div class="card-title">💼 ВЫБОР КЛУБА</div>${CLUBS.map(c=>`<div class="club-card" onclick="forceGo('${c.name}')"><div class="club-info"><h3>${c.name}</h3><p>${c.country} · Tier ${c.tier} · Сила ${c.str}</p></div></div>`).join('')}<button class="btn btn-gray" onclick="showTraining()">Отмена</button></div>`}
function forceGo(name){const c=CLUBS.find(x=>x.name===name);if(c){p.club=c;p.salary=calcSalary(p.ovr,c.tier)}save();showTraining()}
function doTrain(stat){if(p.tp<=0)return;const gain=ri(1,3);p[stat]=cl(p[stat]+gain);p.tp--;p.ovr=calcOvr();p.salary=calcSalary(p.ovr,p.club.tier);$('tr_'+stat).textContent=p[stat];$('sOvr').textContent=p.ovr;document.querySelector('.summary-bar div:nth-child(3) b').textContent=p.tp;if(p.tp<=0)$('btnNext').disabled=false}
function upgradeAgent(){const cost=p.agentLevel===1?5:30;if(p.money<cost)return;p.money-=cost;p.agentLevel++;p.agentName=p.agentLevel===2?'Сара Мендес':'Жорже Мендес';save();showTraining()}

/* ============ СИМУЛЯЦИЯ ============ */
function goalProb(){const base=Math.min(.92,p.ovr/110);const formMult=1+p.form*.13;const posMult=p.pos==='GK'?.03:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.12:p.pos==='CDM'?.22:p.pos==='CM'?.35:p.pos==='CAM'?.7:p.pos==='LW'||p.pos==='RW'||p.pos==='SS'?.75:1;const injMult=p.injury?.5:1;const fanMult=1+(p.fans-50)/400;return Math.min(.95,base*formMult*posMult*injMult*fanMult)}
function assistProb(){const base=Math.min(.75,p.ovr/130);const posMult=p.pos==='GK'?.05:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.25:p.pos==='CDM'?.5:p.pos==='CM'?.8:p.pos==='CAM'?.9:p.pos==='LW'||p.pos==='RW'?.85:1;const partMult=1+(p.partners-50)/300;return Math.min(.85,base*posMult*(1+p.form*.1)*partMult)}
function cardProb(){let base=.04;if(p.pos==='CB'||p.pos==='CDM')base=.09;if(p.def>85)base+=.02;return base}
function tryInjury(){if(p.injuryShield)return null;let chance=.045;if(p.form<=-2)chance+=.02;if(p.phy<60)chance+=.015;if(p.morale<40)chance+=.01;if(Math.random()>chance)return null;const roll=Math.random();const stat=pick(['pac','sho','dri','phy']);if(roll<.6)return{name:'Лёгкая',matchesLeft:ri(1,2),stat,penalty:ri(1,3),perm:false};if(roll<.9)return{name:'Средняя',matchesLeft:ri(3,5),stat,penalty:ri(3,6),perm:false};return{name:'Тяжёлая',matchesLeft:ri(5,9),stat,penalty:ri(3,8),perm:true}}
function applyInjury(inj){p[inj.stat]=cl(p[inj.stat]-inj.penalty);p.injury={...inj};p.morale=cm(p.morale-15);p.ovr=calcOvr()}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}

function simMatch(opp,comp){
  const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false,penGoal:0,fkGoal:0};
  if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}
  const teamStr=(p.club?p.club.str:70)+(p.ovr-75)*.4;
  const baseT=Math.max(0,Math.round((teamStr-opp.str)/22+1.4+ri(-1,1)));
  const prob=goalProb();let pg=0,penGoal=0,fkGoal=0;
  if(Math.random()<prob){pg++;if(Math.random()<.12)penGoal++;else if(Math.random()<.06)fkGoal++}
  if(Math.random()<prob*.35){pg++;if(Math.random()<.1)penGoal++}
  if(Math.random()<prob*.07)pg++;
  const ap=assistProb();let assist=0;if(Math.random()<ap)assist++;if(Math.random()<ap*.3)assist++;
  const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-teamStr)/22+1.4+ri(-1,1)));
  r.tg=tg;r.og=og;r.pg=pg;r.assist=assist;r.penGoal=penGoal;r.fkGoal=fkGoal;
  const cp=cardProb();if(Math.random()<cp){r.yellow=1;if(Math.random()<.08)r.red=1}
  if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}
  if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);
  return r;
}
function recordMatch(comp,res){p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;p.career[comp].yellow+=res.yellow;p.career[comp].red+=res.red;p.career[comp].pen+=res.penGoal;p.career[comp].fk+=res.fkGoal;p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;p.careerTotal.yellow+=res.yellow;p.careerTotal.red+=res.red;p.careerTotal.pen+=res.penGoal;p.careerTotal.fk+=res.fkGoal}

function simLeague(){const m=[];for(let i=0;i<10;i++){let o=pick(CLUBS);while(o.name===p.club.name)o=pick(CLUBS);const r=simMatch(o,'Чемпионат');r.compKey='league';m.push(r);recordMatch('league',r)}return m}
function simCup(){const m=[];const pool=CLUBS.filter(c=>c.tier>=p.club.tier-1);for(let i=0;i<4;i++){const o=pick(pool.length?pool:CLUBS);const r=simMatch(o,['1/16','1/8','1/4','Финал'][i]||'Кубок');r.compKey='cup';m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<3)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===4)p.trophies.push({name:'Кубок',season:p.season});return m}
function simCL(){const m=[];const top=CLUBS.filter(c=>c.str>=82&&c.name!==p.club.name);for(let i=0;i<3;i++){const r=simMatch(pick(top),'ЛЧ Группа');r.compKey='cl';m.push(r);recordMatch('cl',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2){for(const st of ['1/8','1/4','1/2','Финал']){const r=simMatch(pick(top),'ЛЧ '+st);r.compKey='cl';m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'ЛЧ',season:p.season});p.clWins=(p.clWins||0)+1;p.morale=cm(p.morale+20)}}}return m}
function simWCQualifiers(){const pool=NTS.filter(n=>n.name!==p.ntName);const group=[{name:p.ntName,flag:p.ntFlag,str:NTS.find(n=>n.name===p.ntName).str}];while(group.length<4){const t=pick(pool);if(!group.find(x=>x.name===t.name))group.push({name:t.name,flag:t.flag,str:t.str})}const table=group.map(t=>({...t,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0}));const m=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const A=group[i],B=group[j];let aG=Math.max(0,Math.round((A.str-B.str)/15+1.4+ri(-1,1)));let bG=Math.max(0,Math.round((B.str-A.str)/15+1.4+ri(-1,1)));if(A.name===p.ntName||B.name===p.ntName){const opp=A.name===p.ntName?B:A;const isHome=A.name===p.ntName;const r=simMatch(opp,'Отбор');r.compKey='nt_qual';if(isHome){r.tg=Math.max(0,Math.round((A.str-B.str)/15+1.4+ri(-1,1)))+r.pg;r.og=bG}else{r.tg=bG;r.og=Math.max(0,Math.round((A.str-B.str)/15+1.4+ri(-1,1)))+r.pg;r.opp=opp.name;r.oppFlag=opp.flag}aG=r.tg;bG=r.og;m.push(r);recordMatch('nt_qual',r)}const tA=table.find(t=>t.name===A.name),tB=table.find(t=>t.name===B.name);tA.p++;tB.p++;tA.gf+=aG;tA.ga+=bG;tB.gf+=bG;tB.ga+=aG;if(aG>bG){tA.w++;tA.pts+=3;tB.l++}else if(aG<bG){tB.w++;tB.pts+=3;tA.l++}else{tA.d++;tB.d++;tA.pts++;tB.pts++}}table.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));p.ntQualified=table.findIndex(t=>t.name===p.ntName)<2;p.caps=(p.caps||0)+m.length;return{m,table,qualified:p.ntQualified}}
function simTournament(name,key){const m=[];const pool=NTS.filter(n=>n.name!==p.ntName);for(let i=0;i<3;i++){const o=pick(pool);const r=simMatch(o,name+' Группа');r.compKey=key;m.push(r);recordMatch(key,r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=1){for(const st of ['1/8','1/4','1/2','Финал']){const o=pick(pool);const r=simMatch(o,name+' '+st);r.compKey=key;m.push(r);recordMatch(key,r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name,season:p.season});if(name==='ЧМ')p.wcWins=(p.wcWins||0)+1;if(name==='Евро')p.euroWins=(p.euroWins||0)+1;if(name==='Копа')p.copaWins=(p.copaWins||0)+1;p.morale=cm(p.morale+25)}}}p.caps=(p.caps||0)+m.length;return m}

/* ============ СЕЗОН ============ */
function simSeason(){
  const res={league:[],cup:[],cl:[],nt_qual:[],wc:[],euro:[],copa:[],wcData:null};
  res.league=simLeague();res.cup=simCup();
  if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();
  const y=getYear();
  // ЧМ — реальный год
  const isWC=isTournament('wc')&&y>=2026;
  // Евро / Копа — только для соответствующих регионов
  const isEuro=isTournament('euro')&&p.ntRegion==='eu';
  const isCopa=isTournament('copa')&&(p.ntRegion==='sa');
  const isQual=!isWC&&!isEuro&&!isCopa;
  if(p.ovr>=76){
    if(!p.nt)p.nt={name:p.ntName,flag:p.ntFlag,str:NTS.find(n=>n.name===p.ntName).str};
    if(isQual){const q=simWCQualifiers();res.nt_qual=q.m;res.wcData=q}
    else if(isWC)res.wc=simTournament('ЧМ','wc');
    else if(isEuro)res.euro=simTournament('Евро','euro');
    else if(isCopa)res.copa=simTournament('Копа','copa');
  }
  const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;
  if(lw>=7&&Math.random()>.4)p.trophies.push({name:'Чемпионат',season:p.season});
  const allM=[...res.league,...res.cup,...res.cl,...res.nt_qual,...res.wc,...res.euro,...res.copa];
  const seasonGoals=allM.reduce((s,m)=>s+m.pg,0);
  if(seasonGoals>=25&&p.ovr>82&&Math.random()>.5+p.bootBoost){p.goldenBoots=(p.goldenBoots||0)+1;p.awards.push({name:'Золотая бутса',season:p.season})}
  if(p.ovr>88&&seasonGoals>20&&p.trophies.length>0&&Math.random()>.65){p.ballonDors=(p.ballonDors||0)+1;p.awards.push({name:'Золотой мяч',season:p.season});p.morale=cm(p.morale+20)}
  return res;
}

/* ============ MENTEE РАЗВИТИЕ ============ */
function developMentee(){
  if(!p.mentee)return;
  const m=p.mentee;
  m.seasons++;
  m.age++;
  // Быстрый рост благодаря наставнику
  ['pac','sho','pas','dri','def','phy'].forEach(k=>{m[k]=cl(m[k]+ri(1,4))});
  m.ovr=Math.round((m.pac+m.sho+m.pas+m.dri+m.def+m.phy)/6);
  // Ты получаешь бонус
  p.morale=cm(p.morale+3);
  p.trust=cm(p.trust+2);
  // Если стал суперзвездой — бонус
  if(m.ovr>85&&m.seasons>=3)p.money+=ri(1,5);
}

/* ============ КРИТИЧЕСКИЕ ============ */
function checkCritical(){for(const c of CRITICAL){if(Math.random()<c.chance){p.endCause=c.cause;if(c.type==='death'){p.finished=true;p.endType='death'}else if(c.type==='prison'){p.finished=true;p.endType='prison'}else if(c.type==='ban'){p.finished=true;p.endType='ban'}else if(c.type==='careerEnd'){p.finished=true;p.endType='careerEnd'}return c}}return null}

/* ============ ДИЛЕММЫ ============ */
function rollDilemma(){const available=DILEMMAS.filter(d=>!(p.dilemmaSeen||[]).includes(d.id));if(!available.length)return null;if(Math.random()>0.6)return null;return pick(available)}
function showDilemma(d,onDone){content.innerHTML=`<div class="dilemma-box fade"><div class="ttl">${d.t}</div><div class="txt">${d.txt}</div>${d.choices.map((c,i)=>`<button class="choice-btn" onclick="pickChoice(${i},'${d.id}')">${c.n}</button>`).join('')}</div>`;window._dilemma=d;window._dilemmaDone=onDone}
function pickChoice(i,id){const d=window._dilemma;d.choices[i].fn();p.dilemmaSeen=p.dilemmaSeen||[];p.dilemmaSeen.push(id);save();window._dilemmaDone()}

/* ============ ДОСТИЖЕНИЯ ============ */
function checkAchievements(){const earned=[];ACHIEVEMENTS.forEach(a=>{if(!(p.achievements||[]).includes(a.id)&&a.check()){p.achievements=p.achievements||[];p.achievements.push(a.id);earned.push(a)}});return earned}

/* ============ СЛЕДУЮЩИЙ СЕЗОН ============ */
function nextSeason(){
  p.season++;p.age++;
  const crit=checkCritical();
  if(crit){save();render();showCriticalEvent(crit);return}
  const ev=pick(EVENTS);ev.fn();
  p.pac=cl(p.pac+ri(-2,3));p.sho=cl(p.sho+ri(-2,4));p.pas=cl(p.pas+ri(-2,3));
  p.dri=cl(p.dri+ri(-2,3));p.def=cl(p.def+ri(-1,2));p.phy=cl(p.phy+ri(-2,3));
  p.ovr=calcOvr();p.form*=.6;
  if(p.press<30)p.morale=cm(p.morale-5);
  if(p.fans>80)p.morale=cm(p.morale+3);
  if(p.trust<30)p.form=Math.max(-3,p.form-.5);
  p.money+=p.salary+p.sponsorValue+p.passive;
  p.tp=ri(0,20);
  p.salary=calcSalary(p.ovr,p.club.tier);
  p.injuryShield=false;
  const before=JSON.parse(JSON.stringify(p.career));
  const season=simSeason();
  const sStats={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0,byComp:{}};
  COMPS.forEach(c=>{const d=p.career[c].matches-before[c].matches;sStats.matches+=d;sStats.goals+=p.career[c].goals-before[c].goals;sStats.assists+=p.career[c].assists-before[c].assists;sStats.yellow+=p.career[c].yellow-before[c].yellow;sStats.red+=p.career[c].red-before[c].red;sStats.pen+=p.career[c].pen-before[c].pen;sStats.fk+=p.career[c].fk-before[c].fk;if(d>0)sStats.byComp[c]={matches:d,goals:p.career[c].goals-before[c].goals,assists:p.career[c].assists-before[c].assists,pen:p.career[c].pen-before[c].pen,fk:p.career[c].fk-before[c].fk}});
  p.history.push({age:p.age,year:getYear(),club:p.club.name,salary:p.salary,...sStats});
  developMentee();
  const newAch=checkAchievements();
  save();render();
  const dilemma=rollDilemma();
  if(dilemma){showDilemma(dilemma,()=>showSeasonRecap(season,ev,sStats,newAch))}
  else showSeasonRecap(season,ev,sStats,newAch);
}

function showCriticalEvent(crit){let icon='💀',title='ТРАГЕДИЯ';if(crit.type==='death'){icon='💀';title='СМЕРТЬ'}else if(crit.type==='prison'){icon='🚔';title='ТЮРЬМА'}else if(crit.type==='ban'){icon='⛔';title='ДИСКВАЛИФИКАЦИЯ'}else if(crit.type==='careerEnd'){icon='🚑';title='КАРЬЕРА ОКОНЧЕНА'}content.innerHTML=`<div class="event-box critical fade" style="padding:20px;text-align:center"><div style="font-size:3em">${icon}</div><div style="font-size:1.1em;font-weight:800;color:var(--red);margin-top:10px">${title}</div><div style="font-size:.85em;margin-top:10px;line-height:1.5">${crit.text}</div><div style="font-size:.7em;color:var(--muted);margin-top:12px">Возраст: ${p.age} · Год: ${getYear()} · OVR: ${p.ovr}</div></div><button class="btn" onclick="showEnd()">ПОСМОТРЕТЬ ИТОГИ</button>`}

/* ============ FIFA CARDS ============ */
function fifaCard(m,teamName,teamFlag){const cls=m.missed?'miss':(m.tg>m.og?'w':m.tg<m.og?'l':'d');const homeLogo=logoCache[teamName]||svgBadge(teamName);const awayLogo=logoCache[m.opp]||svgBadge(m.opp);const tags=[];if(m.pg>0)tags.push(`<span class="fifa-goal">⚽ ${m.pg}</span>`);if(m.assist>0)tags.push(`<span class="fifa-assist">🅰️ ${m.assist}</span>`);if(m.yellow)tags.push(`<span class="fifa-card-y">🟨</span>`);if(m.red)tags.push(`<span class="fifa-card-r">🟥</span>`);return `<div class="fifa-match ${cls}"><div class="fifa-comp"><span>${m.comp}</span><span>${m.missed?'🤕 ПРОПУСК':"90'"}</span></div><div class="fifa-row"><div class="fifa-team home"><span class="nm">${teamName}</span><img class="fifa-badge" src="${homeLogo}" onerror="this.src='${svgBadge(teamName)}'"></div><div class="fifa-score">${m.missed?'—':m.tg+' : '+m.og}</div><div class="fifa-team away"><img class="fifa-badge" src="${awayLogo}" onerror="this.src='${svgBadge(m.opp)}'"><span class="nm">${m.opp}</span></div></div>${tags.length?`<div class="fifa-foot">${tags.join(' ')}</div>`:''}</div>`}

  if(s.cl.length){html+=`<div class="card fade"><div class="card-title">⭐ ЛИГА ЧЕМПИОНОВ</div>`;s.cl.forEach(m=>html+=fifaCard(m,p.club.name,p.club.flag));html+=`</div>`}
  if(s.wcData){const t=s.wcData.table;html+=`<div class="card fade"><div class="card-title">🌍 ОТБОР К ЧМ <span class="hint">${year}</span></div><div class="group-table"><div class="gt-row head"><div>#</div><div>Команда</div><div>И</div><div>В</div><div>Н</div><div>О</div></div>${t.map((row,i)=>`<div class="gt-row${row.name===p.ntName?' you':''}${i<2?' qual':''}"><div>${i+1}</div><div class="gt-name"><img src="${flagUrl(row.flag)}" onerror="this.style.display='none'">${row.name}</div><div style="text-align:center">${row.p}</div><div style="text-align:center">${row.w}</div><div style="text-align:center">${row.d}</div><div class="gt-pts">${row.pts}</div></div>`).join('')}</div><div class="text-center" style="font-size:.75em;margin-top:6px">${s.wcData.qualified?'<b style="color:var(--green)">✅ ВЫШЛИ НА ЧМ!</b>':'<b style="color:var(--red)">❌ Не вышли</b>'}</div>${s.nt_qual.map(m=>fifaCard(m,p.ntName,p.ntFlag)).join('')}</div>`}
  if(s.wc.length){html+=`<div class="card fade"><div class="card-title">🏆 ЧЕМПИОНАТ МИРА <span class="year-tag">${year}</span></div>`;s.wc.forEach(m=>html+=fifaCard(m,p.ntName,p.ntFlag));html+=`</div>`}
  if(s.euro.length){html+=`<div class="card fade"><div class="card-title">🏆 ЕВРО <span class="year-tag">${year}</span></div>`;s.euro.forEach(m=>html+=fifaCard(m,p.ntName,p.ntFlag));html+=`</div>`}

/* ============ АГЕНТ - ТРАНСФЕРЫ ============ */
async function showAgentTransfers(){
  const seasonGoals=(p.lastSeasonStats?.goals||0)+(p.lastSeasonStats?.assists||0);
  const perfScore=p.ovr+seasonGoals*.5;
  let maxTier=1;if(perfScore>92)maxTier=5;else if(perfScore>85)maxTier=4;else if(perfScore>78)maxTier=3;else if(perfScore>70)maxTier=2;
  maxTier=Math.min(5,maxTier+(p.agentLevel-1));
  const available=CLUBS.filter(c=>c.tier<=maxTier&&c.name!==p.club.name);
  const num=Math.min(3,Math.max(2,Math.floor(p.ovr/30)+(p.agentLevel-1)));
  const shuffled=available.sort(()=>Math.random()-.5).slice(0,num);
  const logos=await Promise.all(shuffled.map(c=>getLogo(c.name)));
  let html=`<div class="agent-card fade"><div class="agent-head"><div class="agent-avatar">👔</div><div class="agent-name">${p.agentName}<small>Ур. ${p.agentLevel}</small></div></div><div class="agent-msg">Тебе ${p.age}, OVR ${p.ovr}. Макс. доступный tier: <b>${maxTier}</b>. Год: ${getYear()}.</div></div>`;
  shuffled.forEach((c,i)=>{const price=Math.round(p.ovr*ri(3,8)/10);const newSalary=calcSalary(p.ovr,c.tier);html+=`<div class="club-card"><img class="club-logo" src="${logos[i]}" onerror="this.src='${svgBadge(c.name)}'"><div class="club-info"><h3>${c.name}</h3><p>${c.country} · Tier ${c.tier} · Сила ${c.str}</p><div style="margin-top:4px;font-size:.7em"><span style="color:var(--green)">💰 €${fmt(newSalary)}/год</span></div></div></div><button class="btn" onclick="acceptOffer('${c.name}',${price})">✍️ Подписать с ${c.name}</button>`});
  html+=`<button class="btn btn-gray" onclick="stayClub()">🏠 Остаться в ${p.club.name} (€${fmt(p.salary)}/год)</button>`;
  content.innerHTML=html;content.scrollTop=0;
}
function acceptOffer(name,price){const c=CLUBS.find(x=>x.name===name);if(c){p.club=c;p.money+=price;p.trust=cm(p.trust+10);p.morale=cm(p.morale+10);p.salary=calcSalary(p.ovr,c.tier)}save();showTraining()}
function stayClub(){p.money+=ri(1,5);p.trust=cm(p.trust+5);p.morale=cm(p.morale+5);p.salary=calcSalary(p.ovr,p.club.tier);save();showTraining()}

/* ============ END / COACH MODE ============ */
function endCareer(cause){
  p.finished=true;
  if(cause&&!p.endCause)p.endCause=cause;
  if(!p.endType)p.endType='retire';
  save();
  // Предложение стать тренером
  showCoachOffer();
}

function showCoachOffer(){
  content.innerHTML=`
  <div class="end-hero fade"><h2>🏁 ИГРОВАЯ КАРЬЕРА ЗАВЕРШЕНА</h2>${p.endCause?`<div class="cause">Причина: ${p.endCause}</div>`:''}</div>
  <div class="coach-badge fade"><div class="ico">👔</div><div class="ttl">СТАТЬ ТРЕНЕРОМ?</div><div class="sub">Ты можешь продолжить карьеру в футболе как менеджер</div></div>
  <div class="card"><div class="card-title">💭 ЧТО ДЕЛАТЬ?</div>
  <div class="muted mb-8" style="font-size:.78em;line-height:1.5">У тебя есть опыт и знания. Хочешь попробовать себя в роли главного тренера клуба?</div>
  <button class="btn" onclick="startCoachMode()">👔 СТАТЬ ТРЕНЕРОМ</button>
  <button class="btn btn-gray" onclick="showEnd()">🚪 Уйти из футбола</button>
  </div>`;
}

function startCoachMode(){
  p.coachMode=true;p.wasCoach=true;
  const available=CLUBS.filter(c=>c.tier<=2);
  const shuffled=available.sort(()=>Math.random()-.5).slice(0,4);
  content.innerHTML=`<div class="coach-badge fade"><div class="ico">👔</div><div class="ttl">ВЫБЕРИ КЛУБ</div><div class="sub">Начни тренерскую карьеру</div></div>
  ${shuffled.map(c=>`<div class="club-card" onclick="beginCoach('${c.name}')"><div class="club-info"><h3>${c.name}</h3><p>${c.country} · Tier ${c.tier} · Сила ${c.str}</p></div></div>`).join('')}`;
}

function beginCoach(clubName){
  const c=CLUBS.find(x=>x.name===clubName);
  p.coachData={
    club:c,
    seasons:0,
    matches:0,wins:0,draws:0,losses:0,
    trophies:[],
    reputation:60,
    money:p.money,
    history:[]
  };
  save();
  showCoachScreen();
}

function showCoachScreen(){
  const cd=p.coachData;
  if(!cd){showEnd();return}
  content.innerHTML=`
  <div class="coach-badge fade"><div class="ico">👔</div><div class="ttl">ТРЕНЕР: ${cd.club.name}</div><div class="sub">Сезон ${cd.seasons+1} · Репутация: ${cd.reputation}</div></div>
  <div class="card fade">
    <div class="summary-bar"><div>🏟️ Матчи<b>${cd.matches}</b></div><div>✅ Победы<b>${cd.wins}</b></div><div>➖ Ничьи<b>${cd.draws}</b></div><div>❌ Поражения<b>${cd.losses}</b></div></div>
    <div class="summary-bar" style="margin-top:-5px"><div>🏆 Трофеи<b>${cd.trophies.length}</b></div><div>💰 Баланс<b>€${fmt(p.money)}</b></div><div>📅 Сезонов<b>${cd.seasons}</b></div><div>⭐ Репутация<b>${cd.reputation}</b></div></div>
    <div class="card-title">📋 ДЕЙСТВИЕ</div>
    <button class="btn" onclick="coachNextSeason()">▶ СЛЕДУЮЩИЙ СЕЗОН</button>
    ${cd.reputation>=70&&cd.club.tier<5?`<button class="btn btn-blue" onclick="coachMoveClub()">📈 Перейти в клуб выше</button>`:''}
    <button class="btn btn-gray" onclick="finishCoach()">🚪 Завершить тренерскую карьеру</button>
  </div>
  <div class="card fade"><div class="card-title">📜 ИСТОРИЯ ТРЕНЕРА</div>
  ${(cd.history||[]).length?cd.history.map((h,i)=>`<div class="detail-row"><span class="nm">Сезон ${i+1} · ${h.club}</span><span class="val">${h.w}П ${h.d}Н ${h.l}П ${h.trophy?'🏆':''}</span></div>`).join(''):'<div class="muted text-center">Пока нет сезонов</div>'}
  </div>`;
}

function coachNextSeason(){
  const cd=p.coachData;
  cd.seasons++;
  const wins=ri(5,12),draws=ri(1,8),losses=Math.max(0,20-wins-draws);
  cd.matches+=wins+draws+losses;cd.wins+=wins;cd.draws+=draws;cd.losses+=losses;
  const winRate=wins/(wins+draws+losses);
  let trophy=false;
  if(winRate>0.6&&Math.random()>0.4){trophy=true;cd.trophies.push({name:'Чемпионат',season:cd.seasons});p.money+=ri(5,20)}
  if(winRate>0.7&&Math.random()>0.5){cd.trophies.push({name:'Кубок',season:cd.seasons});p.money+=ri(3,10)}
  if(winRate>0.75&&Math.random()>0.6){cd.trophies.push({name:'ЛЧ',season:cd.seasons});p.money+=ri(15,40)}
  // Репутация
  cd.reputation=cm(cd.reputation+Math.round((winRate-0.4)*30));
  cd.history.push({club:cd.club.name,w:wins,d:draws,l:losses,trophy});
  // ЗП тренера
  p.money+=ri(2,15);
  if(cd.reputation<20){alert('Тебя уволили!');finishCoach();return}
  save();showCoachScreen();
}

function coachMoveClub(){
  const cd=p.coachData;
  const better=CLUBS.filter(c=>c.tier>cd.club.tier&&c.tier<=Math.min(5,cd.club.tier+2));
  if(!better.length)return;
  const c=pick(better);
  cd.club=c;cd.reputation=cm(cd.reputation-5);
  save();showCoachScreen();
}

function finishCoach(){
  p.coachMode=false;
  save();
  showEnd();
}

  content.innerHTML=`
  <div class="end-hero fade"><h2>🏁 КАРЬЕРА ЗАВЕРШЕНА</h2><div class="legacy">${legacy}</div>${causeLine}
  <div class="muted" style="font-size:.72em;margin-top:6px">${p.name} · ${p.pos} · ${p.ntName} <img src="${flagUrl(p.ntFlag)}" style="width:18px;vertical-align:middle"></div></div>

  <div class="stat-click" onclick="showCardsBreakdown()"><div class="label">🟨🟥 Карточки</div><div class="value">${c.yellow} / ${c.red}</div><div class="hint">Нажми →</div></div>
  <div class="stat-click" onclick="showTrophiesList()"><div class="label">🏆 Трофеи</div><div class="value">${(p.trophies||[]).length}</div><div class="hint">Нажми →</div></div>
  <div class="stat-click" onclick="showAwardsList()"><div class="label">🥇 Награды</div><div class="value">${(p.awards||[]).length}</div><div class="hint">ЗМ: ${p.ballonDors||0} · ЗБ: ${p.goldenBoots||0} →</div></div>

}
function toggleHist(el){el.classList.toggle('open')}
function showGoalBreakdown(){const c=p.career;const html=`<div class="modal-title">⚽ Голы по турнирам</div>${COMPS.map(k=>c[k].goals>0?`<div class="detail-row"><span class="nm">${COMP_NAMES[k]}</span><span class="val">${c[k].goals}</span></div>`:'').join('')}<div class="detail-head">Всего: ${p.careerTotal.goals}</div><div class="detail-row"><span class="nm">🥅 С пенальти</span><span class="val">${p.careerTotal.pen}</span></div><div class="detail-row"><span class="nm">🎯 Со штрафных</span><span class="val">${p.careerTotal.fk}</span></div><button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function showAssistBreakdown(){const c=p.career;const html=`<div class="modal-title">🅰️ Передачи по турнирам</div>${COMPS.map(k=>c[k].assists>0?`<div class="detail-row"><span class="nm">${COMP_NAMES[k]}</span><span class="val">${c[k].assists}</span></div>`:'').join('')}<div class="detail-head">Всего: ${p.careerTotal.assists}</div><button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function showCardsBreakdown(){const c=p.career;const html=`<div class="modal-title">🟨🟥 Карточки по турнирам</div>${COMPS.map(k=>(c[k].yellow+c[k].red)>0?`<div class="detail-row"><span class="nm">${COMP_NAMES[k]}</span><span class="val">${c[k].yellow}🟨 ${c[k].red}🟥</span></div>`:'').join('')}<div class="detail-head">Всего: ${p.careerTotal.yellow}🟨 · ${p.careerTotal.red}🟥</div><button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function showTrophiesList(){const groups={};(p.trophies||[]).forEach(t=>{groups[t.name]=(groups[t.name]||[]);groups[t.name].push(t.season)});const html=`<div class="modal-title">🏆 Все трофеи (${(p.trophies||[]).length})</div>${Object.keys(groups).length?Object.keys(groups).map(n=>`<div class="detail-row"><span class="nm">${n}</span><span class="val">×${groups[n].length}</span></div>`).join(''):'<div class="muted text-center">Пока нет</div>'}<button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function showAwardsList(){const groups={};(p.awards||[]).forEach(t=>{groups[t.name]=(groups[t.name]||0)+1});const html=`<div class="modal-title">🥇 Награды</div>${Object.keys(groups).length?Object.keys(groups).map(n=>`<div class="detail-row"><span class="nm">${n}</span><span class="val">×${groups[n]}</span></div>`).join(''):'<div class="muted text-center">Пока нет</div>'}<div class="detail-head">Всего: ${(p.awards||[]).length}</div><button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function showAchievementsList(){const earned=p.achievements||[];const html=`<div class="modal-title">🎖️ Достижения (${earned.length}/${ACHIEVEMENTS.length})</div>${ACHIEVEMENTS.map(a=>{const has=earned.includes(a.id);return `<div class="ach-card ${has?'':'locked'}"><div class="ttl">${has?'✅':'🔒'} ${a.n}</div><div class="desc">${a.d}</div></div>`}).join('')}<button class="modal-close" onclick="closeModal()">Закрыть</button>`;openModal(html)}
function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function resetGame(){localStorage.removeItem('mfc_ultimate');location.reload()}

/* ============ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.shopOwned)p.shopOwned=[];
  if(!p.trophies)p.trophies=[];
  if(!p.awards)p.awards=[];
  if(!p.history)p.history=[];
  if(!p.achievements)p.achievements=[];
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.startAge)p.startAge=16;
  if(p.partners===undefined)p.partners=60;
  if(p.press===undefined)p.press=60;
  if(p.fans===undefined)p.fans=60;
  if(!p.agentLevel)p.agentLevel=1;
  if(!p.agentName)p.agentName='Мистер Родригес';
  if(!p.dilemmaSeen)p.dilemmaSeen=[];
  if(!p.mentorOffered)p.mentorOffered=false;
  if(!p.coachMode)p.coachMode=false;
  if(!p.coachData)p.coachData=null;
  $('statusBar').style.display='grid';$('statsBar').style.display='grid';$('timeline').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos} · ${p.ntName}</small>`;
  render();
  Promise.all(CLUBS.slice(0,15).map(c=>getLogo(c.name)));
  if(p.coachMode&&p.coachData){showCoachScreen();}
  else if(p.finished||p.age>42){if(p.coachData)showEnd();else showCoachOffer();}
  else showTraining();
}else{
  showStart();
}
</script>
</body>
</html>
