let rhythmState = null;
function startRhythmGame(){
  rhythmState = { round: 0, maxRound: 10, score: 0, combo: 0, notes: [], startTime: 0, finished: false, hits: [] };
  for(let i = 0; i < 10; i++) rhythmState.notes.push({ time: 1000 + i * 800, hit: false, result: null });
  showRhythmScreen(); rhythmState.startTime = Date.now(); rhythmState.loopId = setInterval(updateRhythm, 30);
}
function showRhythmScreen(){
  content.innerHTML = `<div class="tab-title">💨 СПРИНТ · Ритм-игра</div><div class="mg-hud"><div class="mg-stat ok">Счёт<b id="rhScore">0</b></div><div class="mg-stat">Комбо<b id="rhCombo">0</b></div><div class="mg-stat"><span class="mg-timer" id="rhTimer">3.0</span></div></div><div class="mg-rhythm-track" id="rhTrack"><div id="rhNotes"></div></div><div class="muted text-center" style="font-size:.75em;margin-bottom:8px">👇 Тапай в такт, когда нота в центре</div><button class="btn btn-gold" id="rhTapBtn" style="padding:22px;font-size:1.1em" onclick="rhythmTap()">👟 БЕГ!</button>`;
  hideFAB();
}
function updateRhythm(){
  if(!rhythmState || rhythmState.finished) return;
  const elapsed = Date.now() - rhythmState.startTime;
  const track = document.getElementById('rhTrack'); if(!track) return;
  let html = '';
  rhythmState.notes.forEach((n) => {
    if(n.hit){ html += `<div class="mg-note ${n.result}" style="left:50%;top:50%;opacity:.3">${n.result==='hit-perfect'?'🔥':n.result==='hit-good'?'✅':'❌'}</div>`; return; }
    const timeToHit = n.time - elapsed;
    if(timeToHit > 900) return; if(timeToHit < -300) return;
    const xPos = 50 + (timeToHit / 900) * 55;
    html += `<div class="mg-note" style="left:${xPos}%;top:50%">👟</div>`;
  });
  track.innerHTML = html;
  const nextNote = rhythmState.notes.find(n => !n.hit && n.time > elapsed);
  const timer = nextNote ? Math.max(0, (nextNote.time - elapsed)/1000).toFixed(1) : '0.0';
  const timerEl = document.getElementById('rhTimer'); if(timerEl){ timerEl.textContent = timer; timerEl.classList.toggle('danger', parseFloat(timer) < 1); }
  const scoreEl = document.getElementById('rhScore'); if(scoreEl) scoreEl.textContent = rhythmState.score;
  const comboEl = document.getElementById('rhCombo'); if(comboEl) comboEl.textContent = rhythmState.combo;
  if(elapsed > rhythmState.notes[rhythmState.notes.length - 1].time + 500) finishRhythm();
}
function rhythmTap(){
  if(!rhythmState || rhythmState.finished) return;
  const elapsed = Date.now() - rhythmState.startTime;
  let closest = null, minDiff = Infinity;
  rhythmState.notes.forEach((n) => { if(n.hit) return; const diff = Math.abs(n.time - elapsed); if(diff < minDiff){minDiff = diff; closest = n;} });
  if(!closest || minDiff > 500){ rhythmState.combo = 0; if(navigator.vibrate) navigator.vibrate(20); return; }
  closest.hit = true;
  if(minDiff < 80){ closest.result = 'hit-perfect'; rhythmState.score += 10; rhythmState.combo++; playTone(1200, 60, 'sine', 0.1); if(navigator.vibrate) navigator.vibrate(15); }
  else if(minDiff < 200){ closest.result = 'hit-good'; rhythmState.score += 5; rhythmState.combo++; playTone(800, 60, 'sine', 0.08); if(navigator.vibrate) navigator.vibrate(10); }
  else{ closest.result = 'missed'; rhythmState.combo = 0; playTone(300, 100, 'sawtooth', 0.06); }
}
function finishRhythm(){ if(!rhythmState || rhythmState.finished) return; rhythmState.finished = true; clearInterval(rhythmState.loopId); const maxScore = rhythmState.notes.length * 10; finishMinigame('rhythm', rhythmState.score, maxScore); rhythmState = null; }

function aimTap(e){
  if(!aimState) return;
  const field = document.getElementById('aimField'); const rect = field.getBoundingClientRect();
  const x = e.clientX - rect.left; const y = e.clientY - rect.top;
  const cross = document.getElementById('aimCrosshair'); cross.style.left = x + 'px'; cross.style.top = y + 'px'; cross.style.opacity = '1';
  const target = document.getElementById('aimTarget'); const tr = target.getBoundingClientRect();
  const cx = tr.left + tr.width / 2; const cy = tr.top + tr.height / 2;
  const dx = Math.abs(e.clientX - cx); const dy = Math.abs(e.clientY - cy); const radius = tr.width / 2;
  const hit = Math.sqrt(dx*dx + dy*dy) <= radius;
  const pasBonus = (p.pas / 100) * 0.15; const finalHit = hit || (!hit && Math.random() < pasBonus);
  if(finalHit){ aimState.hits++; target.style.background = 'rgba(76,175,80,.5)'; target.style.borderColor = 'var(--green)'; playTone(900, 80, 'sine', 0.1); if(navigator.vibrate) navigator.vibrate(20); }
  else{ target.style.background = 'rgba(244,67,54,.4)'; target.style.borderColor = 'var(--red)'; playTone(250, 100, 'sawtooth', 0.06); if(navigator.vibrate) navigator.vibrate(60); }
  aimState.history.push(finalHit); aimState.round++; save();
  setTimeout(() => { cross.style.opacity = '0'; setTimeout(showAimRound, 400); }, 500);
}

  if(juggleState.ballY >= 80){ juggleState.ballY = 80; juggleState.ballDir = -1; }

    const el = document.getElementById('jgHits'); if(el) el.textContent = juggleState.hits;

function startDraft(){
  let myTeam = [], aiTeam = [], pool = [...DRAFT_LEGENDS].sort(() => Math.random() - .5);
  function draftTurn(){
    if(myTeam.length >= 11 || pool.length === 0){ finishDraft(myTeam, aiTeam); return; }
    let html = `<div class="tab-title">⚔️ ДРАФТ (${myTeam.length}/11)</div><div class="card"><div class="card-title">ТВОЯ КОМАНДА</div><div style="font-size:.7em">${myTeam.map(l => `${l.country} ${l.n}`).join(', ') || 'Пусто'}</div></div><div class="card-title">📋 ВЫБЕРИ ЛЕГЕНДУ</div>`;
    pool.slice(0, 4).forEach((l) => { html += `<div class="story-card" onclick="pickLegend(${DRAFT_LEGENDS.indexOf(l)})"><div class="ttl">${l.country} ${l.n}</div><div class="desc">${l.pos} · OVR ${l.ovr}</div></div>`; });
    content.innerHTML = html;
  }
  window.pickLegend = (idx) => { const l = DRAFT_LEGENDS[idx]; if(!l) return; myTeam.push(l); const poolIdx = pool.indexOf(l); if(poolIdx >= 0) pool.splice(poolIdx, 1); if(pool.length){ const aiPick = pool.splice(ri(0, pool.length - 1), 1)[0]; aiTeam.push(aiPick); } haptic(20); draftTurn(); };
  window.finishDraft = (my, ai) => {
    const mySum = my.reduce((s, l) => s + l.ovr, 0); const aiSum = ai.reduce((s, l) => s + l.ovr, 0); const win = mySum > aiSum;
    content.innerHTML = `<div class="tab-title">🏆 РЕЗУЛЬТАТ</div><div class="card" style="text-align:center;background:linear-gradient(135deg,${win ? '#2e7d32,#4caf50' : '#c62828,#f44336'},#0a0a0a)"><div style="font-size:3em">${win ? '🏆' : '😢'}</div><div style="font-size:1.5em;font-weight:900;color:#fff;margin-top:8px">${win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ'}</div><div style="font-size:.85em;color:#fff;margin-top:8px">Ты: ${mySum} · ИИ: ${aiSum}</div></div><button class="btn btn-gray" onclick="showMainMenu()">← В меню</button>`;
    if(win) playGoalSound(); haptic(50);
  };
  draftTurn();
}

function showEmpire(){

  const startupValue = p.startups.reduce((s, x) => s + (x.currentValue || 0), 0);
  const carValue = p.cars.reduce((s, id) => { const c = CARS.find(x => x.id === id); return s + (c?.price || 0) * 0.6; }, 0);

  const stockDiv = Object.entries(p.stocks).reduce((s, [name, qty]) => { const st = STOCK_CLUBS.find(x => x.name === name); return s + (st?.basePrice || 0) * 0.04 * qty * 1e6; }, 0);
  const rentalInc = p.rentals.reduce((s, id) => { const r = RENTAL_PROPERTIES.find(x => x.id === id); return s + (r?.income || 0); }, 0);

function switchEmpireTab(t){ p._empireTab = t; document.querySelectorAll('.empire-tab').forEach(b => b.classList.remove('active')); const btn = document.querySelectorAll('.empire-tab')[['stocks','rentals','startups','cars'].indexOf(t)]; if(btn) btn.classList.add('active'); renderEmpireTab(); save(); }
function renderEmpireTab(){ const el = document.getElementById('empireContent'); if(!el) return; const t = p._empireTab || 'stocks'; if(t === 'stocks') el.innerHTML = renderStocksTab(); else if(t === 'rentals') el.innerHTML = renderRentalsTab(); else if(t === 'startups') el.innerHTML = renderStartupsTab(); else if(t === 'cars') el.innerHTML = renderCarsTab(); setTimeout(() => loadClubLogos(), 30); }
function getStockPrice(name){ const st = STOCK_CLUBS.find(x => x.name === name); if(!st) return 100; const hist = p.stocksHistory[name]; if(!hist || !hist.length) return st.basePrice; return hist[hist.length - 1]; }
function updateStockPrices(){ STOCK_CLUBS.forEach(st => { const hist = p.stocksHistory[st.name] || [st.basePrice]; const last = hist[hist.length - 1]; let drift = ri(-8, 8) / 100; if(p.club?.name === st.name){ const seasonGoals = p.lastSeasonStats?.goals || 0; drift += (seasonGoals - 10) / 100; } const avg = st.basePrice; drift += (avg - last) / avg * 0.1; let next = last * (1 + drift); next = Math.max(st.basePrice * 0.4, Math.min(st.basePrice * 2.5, next)); hist.push(Math.round(next * 100) / 100); if(hist.length > 20) hist.shift(); p.stocksHistory[st.name] = hist; }); }
function updateStocksSeason(){ updateStockPrices(); const div = Object.entries(p.stocks).reduce((s, [name, qty]) => { const price = getStockPrice(name); return s + price * 0.04 * qty * 1e6; }, 0); if(div > 0){ p.money += div; p._lastStockDividend = div; } }

function runSeasonSimulation(){
