<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: ULTIMATE 6</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1fa2">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
:root{--bg:#0a0a0a;--app:#121212;--card:#1c1c1c;--card2:#242424;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2a2a2a;--nav-bg:rgba(30,30,42,.95);--nav-active:#2a2a3a}
[data-theme="light"]{--bg:#e8ecf0;--app:#f0f2f5;--card:#ffffff;--card2:#f5f7fa;--text:#1a1f2e;--muted:#5f6c7f;--border:#d8dfe6;--nav-bg:rgba(255,255,255,.98);--nav-active:#e8ecf5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
#app{width:100%;max-width:420px;height:96vh;max-height:860px;background:var(--app);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:8px}
.hdr-title iconify-icon{font-size:1.4em;color:#fff}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card2);padding:8px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.status>div iconify-icon{font-size:1.2em;color:var(--muted);margin-bottom:1px}
.status>div b{color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(9,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.44em;font-weight:700;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;gap:1px}
.stats>div iconify-icon{font-size:1.6em;color:rgba(255,255,255,.85);margin-bottom:2px}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes glowAch{0%,100%{box-shadow:0 10px 40px rgba(255,235,59,.4),0 0 0 1px rgba(255,235,59,.2) inset}50%{box-shadow:0 10px 50px rgba(255,235,59,.7),0 0 0 1px rgba(255,235,59,.4) inset}}
@keyframes ballFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes legendShine{0%{left:-100%}100%{left:100%}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.bottom-nav{position:absolute;bottom:12px;left:10px;right:10px;background:linear-gradient(180deg,rgba(30,30,42,.98),rgba(15,15,25,.98));backdrop-filter:blur(24px);border-radius:24px;padding:8px 4px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06) inset;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.52em;font-weight:700;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);padding:8px 12px;border-radius:16px;min-width:58px;position:relative;text-transform:uppercase;letter-spacing:.5px}
.nav-item iconify-icon{font-size:1.9em;margin-bottom:2px;transition:transform .3s cubic-bezier(.4,0,.2,1);color:var(--muted)}
.nav-item.active{background:linear-gradient(135deg,rgba(76,175,80,.15),rgba(33,150,243,.1));color:var(--yellow)}
.nav-item.active iconify-icon{color:var(--yellow);transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 0 8px rgba(255,235,59,.6))}
.nav-item.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--yellow);border-radius:2px;box-shadow:0 0 10px var(--yellow)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border);animation:slideUp .4s ease}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card-title iconify-icon{font-size:1.2em}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.btn-gold{background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000;font-weight:800}
.menu-btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:.9em;cursor:pointer;margin-bottom:8px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;animation:slideUp .5s ease}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu-btn .mb-icon{font-size:2em}.menu-btn .mb-info{flex:1}
.menu-btn .mb-title{font-size:1em;font-weight:800;margin-bottom:3px}
.menu-btn .mb-desc{font-size:.65em;opacity:.85;font-weight:500}
.mb-p1{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.mb-p2{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff}
.mb-p3{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff}
.mb-p4{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}
.mb-p5{background:linear-gradient(135deg,#ffeb3b,#fbc02d);color:#000}
.mb-p6{background:linear-gradient(135deg,#f44336,#b71c1c);color:#fff}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.summary-bar{display:flex;justify-content:space-around;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:10px;font-size:.62em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:var(--card2);border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}
.detail-row .nm{color:var(--text)}.detail-row .val{font-weight:800;color:var(--yellow)}
.ach-card{background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid #7a7a2a;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:.7em}
.ach-card .ttl{font-weight:800;color:var(--yellow)}.ach-card .desc{color:var(--muted);font-size:.9em;margin-top:2px}
.ach-card.locked{opacity:.35;filter:grayscale(.7)}
.text-center{text-align:center}.mb-8{margin-bottom:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:flex-end;padding:0}
.modal.show{display:flex;animation:fade .3s ease}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 16px 24px;border:1px solid var(--border);animation:slideUpSheet .3s ease}
.modal-box::before{content:'';display:block;width:40px;height:4px;background:#555;border-radius:2px;margin:0 auto 12px}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}
.modal-close{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:.8em;margin-top:10px;font-family:inherit}
.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}
.story-card{background:linear-gradient(135deg,#1a0a2a,#0f051a);border:2px solid #7b1fa2;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.story-card:hover{border-color:var(--yellow);transform:translateY(-2px)}
.story-card.sel{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.story-card .ttl{font-size:.95em;font-weight:800;color:var(--yellow);margin-bottom:4px}
.story-card .desc{font-size:.72em;color:var(--muted);line-height:1.4}
.manager-card{background:linear-gradient(135deg,#1a1a2a,#0f0f1a);border:2px solid #333;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.manager-card:hover{border-color:var(--blue)}
.manager-card.owned{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.manager-card.locked{opacity:.5}
.manager-card .mc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.manager-card .mc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0;color:#fff}
.manager-card .mc-info{flex:1}
.manager-card .mc-name{font-weight:800;font-size:.85em}
.manager-card .mc-tier{font-size:.65em;color:var(--muted);margin-top:2px}
.manager-card .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:.6em;text-align:center;margin-top:6px}
.manager-card .mc-stats>div{background:var(--card2);padding:4px;border-radius:6px;color:var(--muted)}
.manager-card .mc-stats>div b{display:block;color:var(--yellow);font-size:1.3em}
.god-panel{background:linear-gradient(135deg,#2a0a0a,#1a0505);border:2px solid #7d2e2e;border-radius:14px;padding:12px;margin-bottom:10px;animation:pulse 1.5s infinite}
.bounce{animation:bounce .6s ease infinite}
.chart-bar{display:flex;align-items:flex-end;gap:2px;height:80px;padding:6px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.chart-col{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px}
.obj-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border-left:3px solid var(--orange);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.72em}
.obj-card.done{background:linear-gradient(135deg,#0a2a0a,#051a05);border-left-color:var(--green)}
.obj-card .ttl{font-weight:800;margin-bottom:2px}
.obj-card .prog{color:var(--muted);font-size:.85em}
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}
.theme-btn{flex:1;padding:8px;border:2px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;font-size:.7em;font-weight:700;cursor:pointer;font-family:inherit}
.theme-btn.active{border-color:var(--green);background:var(--green);color:#fff}
.progress-bar{background:var(--card2);border-radius:10px;height:6px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:10px;transition:width .6s ease}
.progress-fill.green{background:linear-gradient(90deg,#4caf50,#8bc34a)}
.progress-fill.yellow{background:linear-gradient(90deg,#ffc107,#ffeb3b)}
.progress-fill.red{background:linear-gradient(90deg,#f44336,#e91e63)}
.progress-fill.blue{background:linear-gradient(90deg,#2196f3,#03a9f4)}
.accordion{background:var(--card);border-radius:14px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden}
.accordion-head{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.8em}
.accordion-arrow{transition:transform .3s;color:var(--muted)}
.accordion.open .accordion-arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .4s,padding .3s;padding:0 12px}
.accordion.open .accordion-body{max-height:3000px;padding:0 12px 12px}
.quick-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding:4px;background:var(--card2);border-radius:10px}
.quick-tabs::-webkit-scrollbar{display:none}
.quick-tab{padding:6px 12px;border-radius:8px;font-size:.7em;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:inherit;display:flex;align-items:center;gap:5px}
.quick-tab.active{background:var(--green);color:#fff}
.search-wrap{position:relative;margin-bottom:8px}
.search-input{width:100%;padding:10px 12px 10px 36px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.8em;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--green)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.fab{position:fixed;bottom:110px;right:18px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;border:none;font-size:1.5em;cursor:pointer;box-shadow:0 6px 20px rgba(76,175,80,.6);z-index:45;display:flex;align-items:center;justify-content:center}
.toast-upgraded{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;font-size:.85em;font-weight:700;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.7);max-width:340px;text-align:center;display:flex;align-items:center;gap:10px;animation:slideUp .4s}
.toast-upgraded.success{background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff}
.toast-upgraded.error{background:linear-gradient(135deg,#c62828,#f44336);color:#fff}
.toast-upgraded.warn{background:linear-gradient(135deg,#ef6c00,#ff9800);color:#fff}
.toast-upgraded.info{background:linear-gradient(135deg,#1565c0,#2196f3);color:#fff}
.weather-fx{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.rain-drop{position:absolute;width:2px;height:20px;background:linear-gradient(180deg,transparent,#4fc3f7);animation:rainFall linear infinite;opacity:.6}
@keyframes rainFall{from{transform:translateY(-100vh)}to{transform:translateY(100vh)}}
.snow-flake{position:absolute;color:#fff;font-size:1em;animation:snowFall linear infinite;opacity:.7}
@keyframes snowFall{from{transform:translateY(-100vh) rotate(0)}to{transform:translateY(100vh) rotate(360deg)}}
.sun-ray{position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(255,235,59,.15),transparent 70%);border-radius:50%;animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.3);opacity:.5}}

/* ICONIFY */
iconify-icon{display:inline-block;vertical-align:middle;line-height:1;flex-shrink:0}
.i-sm{font-size:1em}.i-md{font-size:1.4em}.i-lg{font-size:2em}.i-xl{font-size:2.6em}

/* HERO / ГЛАВНОЕ МЕНЮ */
.hero-block{text-align:center;padding:20px 12px 10px;position:relative;overflow:hidden}
.hero-ball{font-size:4em;animation:bounce 2s infinite;filter:drop-shadow(0 0 30px rgba(255,235,59,.6));display:inline-block}
.hero-title{font-size:1.5em;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#4caf50,#2196f3,#ffeb3b,#f44336);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 3s ease infinite;margin-top:8px}
.hero-sub{font-size:.7em;color:var(--muted);margin-top:4px;letter-spacing:2px}
.menu-grid{display:grid;gap:10px;margin-bottom:10px}
.menu-card{position:relative;overflow:hidden;padding:16px 18px;border-radius:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.08);animation:slideUp .5s ease backwards}
.menu-card:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.menu-card:active{transform:scale(.98)}
.menu-card::before{content:'';position:absolute;top:0;left:-50%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .6s;pointer-events:none}
.menu-card:hover::before{left:100%}
.menu-card .mc-ico{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2em;flex-shrink:0;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.3) inset;color:#fff}
.menu-card .mc-info{flex:1;min-width:0}
.menu-card .mc-title{font-size:.95em;font-weight:900;letter-spacing:.3px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.menu-card .mc-desc{font-size:.65em;opacity:.85;font-weight:500;line-height:1.3}
.menu-card .mc-badge{position:absolute;top:10px;right:12px;background:rgba(255,235,59,.95);color:#000;padding:3px 9px;border-radius:8px;font-size:.55em;font-weight:900;letter-spacing:.5px;box-shadow:0 2px 8px rgba(255,235,59,.4)}
.mc-p1{background:linear-gradient(135deg,#2196f3,#0d47a1 120%);color:#fff}
.mc-p2{background:linear-gradient(135deg,#4caf50,#1b5e20 120%);color:#fff}
.mc-p3{background:linear-gradient(135deg,#9c27b0,#4a148c 120%);color:#fff}
.mc-p4{background:linear-gradient(135deg,#ff9800,#bf360c 120%);color:#fff}
.mc-p5{background:linear-gradient(135deg,#ffeb3b,#f57f17 120%);color:#000}
.mc-p6{background:linear-gradient(135deg,#f44336,#880e4f 120%);color:#fff}
.mc-p7{background:linear-gradient(135deg,#00bcd4,#006064 120%);color:#fff}
.mc-p8{background:linear-gradient(135deg,#607d8b,#263238 120%);color:#fff}

/* ЭНЕРГИЯ */
.energy-bar{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-top:4px;border:1px solid #333}
.energy-fill{height:100%;border-radius:3px;transition:width .5s,background .3s;background:linear-gradient(90deg,#4caf50,#8bc34a)}
.energy-fill.mid{background:linear-gradient(90deg,#ffc107,#ff9800)}
.energy-fill.low{background:linear-gradient(90deg,#f44336,#d32f2f)}

/* МИНИ-ИГРЫ 2.0 */
.mg-menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mg-tile{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:14px 10px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.mg-tile:hover{transform:translateY(-3px);border-color:var(--yellow);box-shadow:0 8px 25px rgba(255,235,59,.15)}
.mg-tile .mg-icon{font-size:2.4em;display:block;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(255,235,59,.3))}
.mg-tile .mg-name{font-weight:800;font-size:.8em;color:var(--text);margin-bottom:2px}
.mg-tile .mg-desc{font-size:.62em;color:var(--muted);line-height:1.3}
.mg-tile .mg-best{position:absolute;top:6px;right:8px;font-size:.55em;color:var(--yellow);font-weight:800;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:8px}
.mg-tile.locked{opacity:.4;pointer-events:none;filter:grayscale(1)}
.mg-hud{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1a1a3a,#0a0a1a);padding:10px 14px;border-radius:12px;margin-bottom:10px;border:1px solid #333}
.mg-hud .mg-stat{text-align:center;font-size:.6em;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mg-hud .mg-stat b{display:block;font-size:1.7em;color:var(--yellow);font-weight:900;margin-top:2px;line-height:1}
.mg-hud .mg-stat.ok b{color:var(--green)}
.mg-hud .mg-stat.bad b{color:var(--red)}
.mg-pitch{position:relative;width:100%;height:200px;background:repeating-linear-gradient(90deg,#0d3d0d 0,#0d3d0d 22px,#134a13 22px,#134a13 44px);border-radius:12px;overflow:hidden;border:2px solid #2e7d32;margin-bottom:10px}
.mg-pitch::before{content:'';position:absolute;inset:8px;border:2px solid rgba(255,255,255,.2);border-radius:6px;pointer-events:none}
.mg-goal{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:66%;height:80px;border:4px solid #fff;border-bottom:none;border-radius:6px 6px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.mg-keeper{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:2.5em;transition:left .3s cubic-bezier(.4,0,.2,1),transform .2s;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));z-index:3}
.mg-keeper.diving{transform:translateX(-50%) rotate(-25deg)}
.mg-ball-mg{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:2em;transition:all .45s cubic-bezier(.2,.8,.4,1.2);z-index:2;filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
.mg-zones{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:66%;height:80px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:4px;z-index:5}
.mg-zone{border:1px solid rgba(255,255,255,.15);border-radius:4px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.03)}
.mg-zone:hover{background:rgba(255,235,59,.2);border-color:var(--yellow)}
.mg-zone.hit{background:rgba(76,175,80,.5);border-color:var(--green)}
.mg-zone.miss{background:rgba(244,67,54,.3);border-color:var(--red)}
.mg-power-bar{height:14px;background:var(--card2);border-radius:8px;overflow:hidden;position:relative;margin-bottom:8px;border:1px solid #333}
.mg-power-fill{height:100%;width:0%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336);transition:width .05s linear;border-radius:8px}
.mg-power-bar .target{position:absolute;top:-3px;bottom:-3px;background:rgba(255,255,255,.3);border:2px solid #fff;border-radius:4px;pointer-events:none}
.mg-aim{position:relative;width:100%;height:120px;background:linear-gradient(180deg,#0a2a0a,#0f3a0f);border-radius:10px;margin-bottom:10px;overflow:hidden;cursor:crosshair}
.mg-aim::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,235,59,.15),transparent 60%)}
.mg-target{position:absolute;width:44px;height:44px;border:3px solid var(--yellow);border-radius:50%;transform:translate(-50%,-50%);transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:1.2em;background:rgba(255,235,59,.1);box-shadow:0 0 15px rgba(255,235,59,.5);animation:pulse 1.5s infinite}
.mg-crosshair{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none;transition:all .15s}
.mg-crosshair::before,.mg-crosshair::after{content:'';position:absolute;background:var(--red);box-shadow:0 0 4px rgba(244,67,54,.8)}
.mg-crosshair::before{width:100%;height:2px;top:50%;transform:translateY(-50%)}
.mg-crosshair::after{height:100%;width:2px;left:50%;transform:translateX(-50%)}
.mg-rhythm-track{position:relative;width:100%;height:70px;background:#1a1a2a;border-radius:10px;margin-bottom:10px;overflow:hidden;border:1px solid #333}
.mg-rhythm-track::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--yellow);transform:translateX(-50%);box-shadow:0 0 10px var(--yellow)}
.mg-note{position:absolute;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:linear-gradient(135deg,#7b1fa2,#4a148c);border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1.1em;color:#fff}
.mg-note.hit-perfect{background:linear-gradient(135deg,#ffeb3b,#ff9800);box-shadow:0 0 20px var(--yellow)}
.mg-note.hit-good{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.mg-note.missed{opacity:.2}
.mg-juggle{position:relative;width:100%;height:200px;background:radial-gradient(circle at 50% 100%,#1a1a3a,#0a0a1a);border-radius:12px;margin-bottom:10px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px}
.mg-juggle .juggle-ball{position:absolute;font-size:2.4em;transition:all .35s cubic-bezier(.2,.8,.4,1.4)}
.mg-juggle .juggle-foot{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:2.2em}
.mg-result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s}
.mg-result-card{background:linear-gradient(135deg,var(--card),#0a0a1a);border:2px solid var(--yellow);border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 50px rgba(255,235,59,.4);animation:slideUp .4s}
.mg-result-card .mg-rt{font-size:.7em;color:var(--muted);letter-spacing:2px}
.mg-result-card .mg-rr{font-size:2.8em;font-weight:900;margin:8px 0;color:var(--yellow);line-height:1}
.mg-result-card .mg-rs{font-size:.85em;color:#ccc;margin-bottom:14px}
.mg-result-card .mg-rb{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:800;font-size:.9em;cursor:pointer;width:100%;margin-bottom:6px;font-family:inherit}
.mg-result-card .mg-rb.secondary{background:linear-gradient(135deg,#333,#1a1a1a)}
.mg-streak{font-size:.75em;color:var(--orange);font-weight:800;margin-top:6px}
.mg-timer{font-size:1.4em;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums}
.mg-timer.danger{color:var(--red);animation:pulse .5s infinite}
.mg-float{animation:ballFloat 1s ease-in-out infinite}

/* LIVE MATCH */
.live-match{padding:6px 0}
.live-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:linear-gradient(135deg,#1a1a3a,#0a0a1a);padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid #333}
.live-scoreboard .team{font-size:.75em;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-scoreboard .team.right{text-align:right}
.live-scoreboard .score{font-size:1.8em;font-weight:900;color:var(--yellow);padding:0 10px;letter-spacing:2px}
.live-scoreboard .minute{grid-column:1/-1;text-align:center;font-size:.68em;color:var(--muted);margin-top:2px;font-weight:600}
.live-pitch{position:relative;width:100%;height:160px;background:repeating-linear-gradient(90deg,#0d3d0d 0px,#0d3d0d 20px,#134a13 20px,#134a13 40px);border-radius:10px;overflow:hidden;border:2px solid #2e7d32;margin-bottom:8px}
.live-pitch::before{content:'';position:absolute;inset:8px;border:2px solid rgba(255,255,255,.25);border-radius:4px}
.live-pitch::after{content:'';position:absolute;left:50%;top:50%;width:52px;height:52px;border:2px solid rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%)}
.live-pitch .goal{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:48px;border:2px solid #fff;background:rgba(255,255,255,.08)}
.live-pitch .goal.left{left:0;border-left:none;border-radius:0 4px 4px 0}
.live-pitch .goal.right{right:0;border-right:none;border-radius:4px 0 0 4px}
.live-ball{position:absolute;left:50%;top:50%;width:16px;height:16px;background:radial-gradient(circle at 30% 30%,#fff,#ccc);border-radius:50%;transform:translate(-50%,-50%);transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(255,255,255,.7);z-index:2}
.live-ball::after{content:'⚽';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.6em;opacity:.3}
.live-commentary{background:#1a1a2a;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.8em;color:#ddd;min-height:42px;font-style:italic;border-left:3px solid var(--purple);display:flex;align-items:center;transition:opacity .3s}
.live-timeline{max-height:170px;overflow-y:auto;background:var(--card);border-radius:10px;padding:8px;border:1px solid var(--border);margin-bottom:8px}
.live-event{display:flex;gap:8px;padding:5px 0;font-size:.72em;border-bottom:1px solid #222;align-items:center}
.live-event:last-child{border-bottom:none}
.live-event .min{color:var(--muted);min-width:26px;font-weight:700}
.live-event.goal-us{color:var(--green);font-weight:700;background:rgba(76,175,80,.08);border-radius:4px;padding:5px 6px}
.live-event.goal-them{color:var(--red);font-weight:700;background:rgba(244,67,54,.08);border-radius:4px;padding:5px 6px}
.live-event.yellow{color:var(--yellow)}
.live-controls{display:flex;gap:5px;margin-bottom:8px}
.live-controls button{flex:1;padding:9px 6px;border:none;border-radius:8px;font-size:.72em;font-weight:700;cursor:pointer;font-family:inherit;background:var(--card2);color:var(--text);transition:background .15s}
.live-controls button.active{background:var(--green);color:#fff}
.live-controls button:hover:not(.active){background:#333}
.live-decision{border:2px solid var(--yellow);background:linear-gradient(135deg,#2a2a0a,#1a1a05);border-radius:12px;padding:12px;margin-bottom:8px;animation:slideUp .3s ease}
.live-decision .dt{font-size:.75em;font-weight:800;color:var(--yellow);margin-bottom:6px;letter-spacing:.5px}
.live-decision .dd{font-size:.85em;line-height:1.4;margin-bottom:10px;color:#fff}
.live-decision button{width:100%;background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:8px;font-size:.78em;font-weight:600;cursor:pointer;margin-bottom:5px;text-align:left;font-family:inherit;transition:background .15s}
.live-decision button:hover{background:#3a3a6a}
.live-decision button .ms{float:right;font-size:.85em;font-weight:800}
.live-result{text-align:center;padding:14px;font-size:.9em;font-weight:800;border-radius:10px;animation:slideUp .3s}
.live-player{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);transition:left .4s ease,top .4s ease;z-index:1;box-shadow:0 0 4px rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.5)}
.live-player.us{background:linear-gradient(135deg,#ffeb3b,#ff9800)}
.live-player.them{background:linear-gradient(135deg,#2196f3,#0d47a1)}
.live-player.mine{background:linear-gradient(135deg,#fff,#4caf50);width:16px;height:16px;border-color:#fff;box-shadow:0 0 10px #4caf50;z-index:3}

/* КАМПАНИЯ */
.stage-progress{display:flex;gap:4px;justify-content:center;margin:8px 0}
.stage-dot{width:24px;height:24px;border-radius:50%;background:#2a2a2a;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:.6em;font-weight:800;color:#666}
.stage-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.stage-dot.current{background:var(--yellow);border-color:var(--yellow);color:#000;animation:pulse 1.5s infinite}
.prep-btn{padding:16px 10px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:6px !important;font-size:.75em !important;line-height:1.3 !important;text-align:center !important;min-height:90px}
.prep-btn .prep-icon{font-size:1.8em}
.prep-btn .prep-sub{font-size:.75em;opacity:.8;font-weight:500}
.match-result-card{border-left:4px solid;padding:14px;text-align:center;animation:slideUp .4s ease;margin-bottom:8px}
.moment-stat{float:right;font-size:.8em;color:var(--muted);background:#222;padding:2px 8px;border-radius:6px}

/* ИМПЕРИЯ */
.empire-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding:4px;background:var(--card2);border-radius:12px}
.empire-tab{padding:9px 14px;border-radius:8px;font-size:.72em;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.empire-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(76,175,80,.3)}
.empire-tab iconify-icon{font-size:1.2em}
.stock-card{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid var(--blue);position:relative;overflow:hidden}
.stock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stock-name{font-weight:800;font-size:.85em;display:flex;align-items:center;gap:8px}
.stock-name img{width:28px;height:28px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.stock-price{text-align:right}
.stock-price b{font-size:1.1em;color:var(--yellow);display:block}
.stock-price small{font-size:.65em;color:var(--muted)}
.stock-delta{font-size:.7em;font-weight:800;padding:2px 8px;border-radius:6px;display:inline-block}
.stock-delta.up{background:rgba(76,175,80,.15);color:var(--green)}
.stock-delta.down{background:rgba(244,67,54,.15);color:var(--red)}
.stock-chart{display:flex;align-items:flex-end;gap:2px;height:40px;margin:8px 0}
.stock-bar{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px;transition:height .3s}
.stock-bar.down{background:linear-gradient(180deg,#f44336,#c62828)}
.rental-card{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid var(--purple);display:flex;gap:10px;align-items:center}
.rental-emoji{font-size:2.2em;flex-shrink:0}
.rental-info{flex:1;min-width:0}
.rental-info .rt{font-weight:800;font-size:.85em}
.rental-info .rd{font-size:.65em;color:var(--muted);margin-top:2px}
.rental-income{font-size:.85em;font-weight:800;color:var(--green);text-align:right;white-space:nowrap}
.startup-card{background:linear-gradient(135deg,#1a1a3a,#0a0a1a);border:1px solid #3a3a5a;border-radius:12px;padding:12px;margin-bottom:8px}
.startup-card.growing{border-color:var(--green)}
.startup-card.dead{border-color:var(--red);opacity:.6}
.startup-card .su-name{font-weight:800;font-size:.85em;color:var(--purple);display:flex;align-items:center;gap:8px}
.startup-card .su-desc{font-size:.65em;color:var(--muted);margin-top:4px;line-height:1.4}
.startup-card .su-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:.62em;text-align:center}
.startup-card .su-stats>div{background:rgba(0,0,0,.3);padding:6px;border-radius:6px;color:var(--muted)}
.startup-card .su-stats>div b{display:block;color:var(--yellow);font-size:1.3em;margin-bottom:2px}
.car-card{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid var(--orange);display:flex;gap:10px;align-items:center}
.car-card.owned{border-color:var(--green);background:linear-gradient(135deg,#1a2a1a,#0f1a0f)}
.car-emoji{font-size:2.4em;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(255,152,0,.4))}
.car-info{flex:1;min-width:0}
.car-info .cn{font-weight:800;font-size:.85em}
.car-info .cd{font-size:.65em;color:var(--muted);margin-top:2px}
.car-info .cb{font-size:.7em;color:var(--green);margin-top:4px;font-weight:700}
.empire-summary{background:linear-gradient(135deg,#1a1a3a,#0a0a1a);border:1px solid var(--purple);border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
.empire-summary .es-total{font-size:2em;font-weight:900;color:var(--yellow);margin:8px 0}
.empire-summary .es-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:.6em;text-align:center}
.empire-summary .es-grid>div{background:rgba(0,0,0,.3);padding:6px 4px;border-radius:8px;color:var(--muted)}
.empire-summary .es-grid>div b{display:block;color:var(--yellow);font-size:1.3em;margin-bottom:2px}

/* ДОСТИЖЕНИЯ */
.ach-popup{position:fixed;top:60px;right:-400px;width:340px;max-width:calc(100vw - 20px);background:linear-gradient(135deg,#1a1a2a,#0a0a1a);border:2px solid #ffeb3b;border-radius:14px;padding:14px;z-index:500;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(255,235,59,.4),0 0 0 1px rgba(255,235,59,.2) inset;transition:right .45s cubic-bezier(.4,0,.2,1);animation:glowAch 2s ease-in-out infinite}
.ach-popup.show{right:10px}
.ach-popup .ach-ico{font-size:2.6em;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(255,235,59,.6))}
.ach-popup .ach-info{flex:1;min-width:0}
.ach-popup .ach-top{font-size:.6em;letter-spacing:2px;color:var(--yellow);font-weight:800;text-transform:uppercase;margin-bottom:3px}
.ach-popup .ach-name{font-size:.9em;font-weight:800;color:#fff;margin-bottom:2px}
.ach-popup .ach-desc{font-size:.65em;color:var(--muted);line-height:1.3}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach-tile{background:var(--card2);border:2px solid #333;border-radius:12px;padding:10px;text-align:center;position:relative;transition:all .2s;padding-bottom:24px}
.ach-tile.unlocked{border-color:var(--yellow);background:linear-gradient(135deg,rgba(255,235,59,.08),rgba(255,152,0,.04))}
.ach-tile.locked{opacity:.5;filter:grayscale(.7)}
.ach-tile .at-ico{font-size:2em;display:block;margin-bottom:4px}
.ach-tile .at-name{font-size:.7em;font-weight:800;color:var(--text);margin-bottom:2px;line-height:1.2}
.ach-tile .at-desc{font-size:.55em;color:var(--muted);line-height:1.3}
.ach-tile .at-rarity{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.5em;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:8px;text-transform:uppercase}
.rar-bronze{background:rgba(205,127,50,.2);color:#cd7f32}
.rar-silver{background:rgba(192,192,192,.2);color:#c0c0c0}
.rar-gold{background:rgba(255,215,0,.2);color:#ffd700}
.rar-platinum{background:rgba(229,228,226,.2);color:#e5e4e2;text-shadow:0 0 8px rgba(229,228,226,.6)}
.ach-progress-bar{background:var(--card2);border-radius:8px;height:10px;overflow:hidden;margin-bottom:10px;border:1px solid #333}
.ach-progress-fill{height:100%;background:linear-gradient(90deg,#4caf50,#ffeb3b);transition:width .8s ease;border-radius:8px;box-shadow:0 0 10px rgba(255,235,59,.5)}

/* ЛЕГЕНДЫ / СЮЖЕТ */
.legend-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border:1px solid #7a5a2a;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.legend-card::before{content:'';position:absolute;top:0;left:-50%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,215,0,.08),transparent);animation:legendShine 4s infinite}
.legend-card.beaten{border-color:var(--green);background:linear-gradient(135deg,#1a2a1a,#0f1a0f)}
.legend-card.current{border-color:var(--yellow);box-shadow:0 0 20px rgba(255,235,59,.3)}

const $=id=>document.getElementById(id);const content=$('content');
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const cl=v=>Math.min(99,Math.max(1,v));const cm=v=>Math.min(100,Math.max(0,v));
const pick=a=>a[ri(0,a.length-1)];
const fmt=n=>{n=n||0;if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return Math.round(n/1e3)+'K';return Math.round(n)+'€'};

function ic(name,size,cls){const s=size?`width:${size}px;height:${size}px`:'';const c=cls?` class="${cls}"`:'';return `<iconify-icon icon="${name}"${c} style="${s}"></iconify-icon>`}
function cardTitle(icon,text,right){return `<div class="card-title"><span>${ic(icon)} ${text}</span>${right?`<span class="hint">${right}</span>`:''}</div>`}

function calcOvr(){const w=POSITIONS.find(x=>x.k===p.pos).w;let s=0;for(const k in w)s+=p[k]*w[k];return Math.round(s)}
const formEmoji=f=>f>=2.5?'🔥🔥':f>=1.5?'🔥':f>=.5?'😊':f>=-.5?'😐':f>=-1.5?'😕':f>=-2.5?'🥶':'❄️❄️';
const formCls=f=>f>=1.5?'form-hot':f>=.5?'form-good':f>=-.5?'form-ok':f>=-1.5?'form-bad':'form-cold';

function newCareerStats(){const o={};COMPS.forEach(c=>o[c]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0});return o}
function save(){try{localStorage.setItem('mfc6_slot'+currentSlot,JSON.stringify(p));localStorage.setItem('mfc6_active',String(currentSlot))}catch(e){}}
function load(){try{const a=localStorage.getItem('mfc6_active');if(a)currentSlot=parseInt(a)||1;const s=localStorage.getItem('mfc6_slot'+currentSlot);if(s){p=JSON.parse(s);return true}}catch(e){}return false}
function randomName(flag){const pool=NAME_POOL[flag]||NAME_POOL.es;return pick(pool.f)+' '+pick(pool.l)}
function calcSalary(ovr,tier){const tbl=[[50,1500],[55,4000],[60,12000],[65,35000],[70,100000],[75,300000],[80,900000],[85,2500000],[90,6000000],[95,15000000]];let base=1500;for(const[o,s]of tbl)if(ovr>=o)base=s;return Math.round(base*(.7+tier*.15))}
function startStats(age){const base=age<=16?ri(30,65):age<=18?ri(40,72):age<=20?ri(50,78):age<=22?ri(58,84):age<=25?ri(65,88):age<=28?ri(70,90):ri(72,92);const sp=()=>cl(base+ri(-15,15));return{pac:sp(),sho:sp(),pas:sp(),dri:sp(),def:sp(),phy:sp(),pen:cl(base+ri(-10,10)),lead:ri(40,60)}}
function relClass(v){return v>=70?'high':v>=40?'mid':'low'}
function getYear(){return START_YEAR+(p.age-p.startAge)}
function getPlayerLeague(clubName){for(const[key,clubs]of Object.entries(LEAGUE_CLUBS)){if(clubs.some(c=>c.name===clubName))return key}return 'eng_prem'}
function isTournament(type){return TOURNAMENTS[type]?.includes(getYear())}
function haptic(ms=10){if(!p.hapticOn)return;if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

function showToast(msg,type='info'){
  const t=document.createElement('div');
  t.className='toast-upgraded '+(type==='success'||type==='#4caf50'?'success':type==='error'||type==='#f44336'?'error':type==='warn'||type==='#ffeb3b'?'warn':'info');
  const icons={success:'✅',error:'❌',warn:'⚠️',info:'ℹ️'};
  t.innerHTML=`<span style="font-size:1.4em">${icons[t.className.split(' ')[1]]||'ℹ️'}</span><span>${msg}</span>`;
  document.body.appendChild(t);haptic(15);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500);
}
function progressBar(v,max=100,c='green'){const pct=Math.min(100,Math.max(0,(v/max)*100));return `<div class="progress-bar"><div class="progress-fill ${c}" style="width:${pct}%"></div></div>`}

  if(logoCache[name])return logoCache[name];

  try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),4000);const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(query)}`,{signal:ctrl.signal});const d=await r.json();if(d.teams&&d.teams.length){const team=d.teams[0];logoCache[name]=team.strTeamBadge||team.strTeamLogo||team.strBadge||svgBadge(name);return logoCache[name]}}catch(e){}

}

function resolveDomain(name,domain){if(domain)return domain;if(BRAND_DOMAINS&&BRAND_DOMAINS[name])return BRAND_DOMAINS[name];return name.toLowerCase().replace(/[^a-z0-9]/g,'')+'.com'}
function brandLogo(name,domain,cat,size){
  size=size||40;const dom=resolveDomain(name,domain);const emoji=CAT_EMOJI[cat]||CAT_EMOJI.default;
  const sources=[`https://logos.hunter.io/${dom}`,`https://www.google.com/s2/favicons?domain=${dom}&sz=128`,`https://icons.duckduckgo.com/ip3/${dom}.ico`];
  const uid='bl_'+Math.random().toString(36).slice(2,9);

function tryBrandSource(imgEl,sources,idx,emoji){
  if(!imgEl||!imgEl.isConnected)return;
  if(idx>=sources.length){const parent=imgEl.parentElement;if(parent)parent.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${Math.round(parent.offsetWidth*0.5)}px;background:#f5f5f5;border-radius:10px">${emoji}</div>`;return}
  const test=new Image();test.crossOrigin='anonymous';test.referrerPolicy='no-referrer';
  test.onload=()=>{if(test.width<16||test.height<16){tryBrandSource(imgEl,sources,idx+1,emoji);return}if(imgEl.isConnected)imgEl.src=sources[idx]};
  test.onerror=()=>tryBrandSource(imgEl,sources,idx+1,emoji);
  test.src=sources[idx];
}

function getAvailableBrandsPool(){
  const leagueKey=getPlayerLeague(p.club?.name||'');const leagueCountry=COUNTRY_LANG[leagueKey]||'en';const playerCountry=p.ntFlag||'ru';
  const localBrands=REGIONAL_BRANDS[leagueCountry]||[];const homeBrands=REGIONAL_BRANDS[playerCountry]||[];
  const homeFiltered=leagueCountry===playerCountry?[]:homeBrands;
  const pool=[];
  localBrands.forEach(b=>pool.push({...b,origin:'league',weight:60/Math.max(1,localBrands.length)}));
  homeFiltered.forEach(b=>pool.push({...b,origin:'home',weight:25/Math.max(1,homeFiltered.length)}));
  INTERNATIONAL_BRANDS.forEach(b=>pool.push({...b,origin:'int',weight:15/Math.max(1,INTERNATIONAL_BRANDS.length)}));
  return pool;
}
function pickBrandWeighted(pool,exclude=[]){const avail=pool.filter(b=>!exclude.some(x=>x.n===b.n));if(!avail.length)return null;const total=avail.reduce((s,b)=>s+b.weight,0);let r=Math.random()*total;for(const b of avail){r-=b.weight;if(r<=0)return b}return avail[avail.length-1]}

function ensureTeammates(){
  if(!p._teammates||p._teammates.club!==p.club.name||p._teammates.season!==p.season){
    const nation=p.ntFlag||'ru';const pool=NAME_POOL[nation]||NAME_POOL.es;const positions=['CB','LB','RB','CDM','CM','CAM','LW','RW','ST'];
    const list=[];
    for(let i=0;i<9;i++){const fn=pick(pool.f);const ln=pick(pool.l);list.push({id:'tm_'+i+'_'+Date.now(),name:`${fn[0]}. ${ln}`,fullName:`${fn} ${ln}`,pos:positions[i],ovr:cl((p.club?.str||75)+ri(-10,8)),chemistry:ri(30,60),seasonsWithMe:0})}
    p._teammates={club:p.club.name,season:p.season,list};
  }
  return p._teammates.list;
}
function getTeammateName(){const list=ensureTeammates();const att=list.filter(t=>['CAM','LW','RW','ST','CM'].includes(t.pos));return pick(att.length?att:list)}
function updateChemistrySeason(){ensureTeammates();p._teammates.list.forEach(t=>{t.seasonsWithMe++;let d=ri(0,8);if(p.careerTotal?.assists>20)d+=2;if((p.careerTotal?.matches||0)<10)d-=3;if(p.friends?.some(f=>f.name===t.fullName))d+=5;t.chemistry=cm((t.chemistry||30)+d)})}
function getChemBonus(){const list=p._teammates?.list||[];if(!list.length)return 1;const avg=list.reduce((s,t)=>s+(t.chemistry||50),0)/list.length;return 0.9+(avg/100)*0.35}

function goalProb(){
  const base=Math.min(.75,p.ovr/180);const formMult=1+p.form*.10;const pm=POSITION_MULT[p.pos]||{goals:0.5};const injuryMult=p.injury?.4:1;
  const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:p.ovr<88?0.9:1;const styleBoost=p._styleBoost||1;
  let prob=Math.min(.6,base*formMult*pm.goals*injuryMult*ovrPenalty*styleBoost);
  if(p.languageBarrier>0)prob*=0.9;
  return prob;
}
function assistProb(){const base=Math.min(.6,p.ovr/200);const pm=POSITION_MULT[p.pos]||{assists:0.5};const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:1;return Math.min(.65,base*pm.assists*ovrPenalty*(1+p.form*.08))}
function cardProb(){let b=.04;if(p.pos==='CB'||p.pos==='CDM')b=.09;if(p.def>85)b+=.02;return b}

function tryInjury(){
  if(p.injuryShield)return null;let chance=.05;
  if(p.form<=-2)chance+=.02;if(p.phy<60)chance+=.015;if(p.morale<40)chance+=.01;
  const chronic=p.chronicInjuries||[];if(chronic.length)chance+=chronic.length*0.02;
  if(Math.random()>chance)return null;
  const roll=Math.random();const stat=pick(['pac','sho','dri','phy']);const isChronic=chronic.includes(stat);
  let injury;
  if(roll<.6)injury={name:'Лёгкая',matchesLeft:ri(1,2),stat,penalty:ri(1,3),perm:false};
  else if(roll<.9)injury={name:'Средняя',matchesLeft:ri(3,5),stat,penalty:ri(3,6),perm:false};
  else injury={name:'Тяжёлая',matchesLeft:ri(5,9),stat,penalty:ri(3,8),perm:true};
  if(isChronic){injury.penalty+=3;injury.chronic=true}
  return injury;
}
function applyInjury(inj){
  p[inj.stat]=cl(p[inj.stat]-inj.penalty);p.injury={...inj};p.morale=cm(p.morale-15);p.ovr=calcOvr();
  if(inj.perm){p.chronicInjuries=p.chronicInjuries||[];if(!p.chronicInjuries.includes(inj.stat))p.chronicInjuries.push(inj.stat)}
  if(p.fans>=30&&typeof addHaterComment==='function')addHaterComment('injury');
}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}

function simMatch(opp,comp){
  const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false,comment:'',derby:false};
  if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}
  const derby=DERBIES.find(d=>(d.home===p.club.name&&d.away===opp.name)||(d.away===p.club.name&&d.home===opp.name));
  r.derby=!!derby;const bonus=derby?0.15:0;
  const baseT=Math.max(0,Math.round((p.club.str-opp.str)/22+1.4+ri(-1,1)));
  let prob=goalProb()+weatherBonus()*0.01+bonus;
  if(p._benched)prob*=0.5;
  if(p._scoutBonus)prob+=p._scoutBonus;
  if(p.friends&&p.friends.length)prob*=1.03;
  let pg=0;const secondGoal=prob*0.25,hatTrick=prob*0.04;
  if(Math.random()<prob)pg++;if(Math.random()<secondGoal)pg++;if(Math.random()<hatTrick)pg++;
  if(pg>0&&Math.random()<0.18){pg=0;r.comment='📺 VAR отменил гол!';r.varCancelled=true}
  else if(pg>0)r.comment=pick(['⚽ ГОЛ!','⚡ Что за удар!','🎯 В девятку!','💥 С 25 метров!','🔥 Стадион взорвался!']);
  else if(Math.random()<0.3)r.comment=pick(['😢 В штангу!','❌ Мимо!','😤 Выше ворот!']);
  const ap=assistProb();let a=0;if(Math.random()<ap)a++;
  const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-p.club.str)/22+1.4+ri(-1,1)));
  r.tg=tg;r.og=og;r.pg=pg;r.assist=a;
  if(Math.random()<cardProb())r.yellow=1;
  if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}
  if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);
  if(pg>=3)p._hatTricks=(p._hatTricks||0)+1;
  if(derby&&pg>0)p._derbyGoals=(p._derbyGoals||0)+pg;
  return r;
}
function recordMatch(comp,res){
  if(!p.career[comp])p.career[comp]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;
  p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;
  if(p.objectives){p.objectives.forEach(o=>{if(o.id==='goals')o.current+=res.pg;else if(o.id==='assists')o.current+=res.assist;else if(o.id==='matches')o.current++})}
  if(comp==='league'&&res.pg>0){p._leaguesPlayed=p._leaguesPlayed||[];const k=getPlayerLeague(p.club.name);if(!p._leaguesPlayed.includes(k))p._leaguesPlayed.push(k)}
}
function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}return m}
function simCup(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key]||[];const pool=clubs.filter(c=>c.name!==p.club.name);for(let i=0;i<5;i++){const o=pick(pool.length?pool:clubs);const r=simMatch(o,['1/16','1/8','1/4','1/2','Финал'][i]);m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<4)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===5)p.trophies.push({name:'Кубок',season:p.season});return m}

function simClubWorldCup(){const y=getYear();if(y%2!==0)return null;if(p.club.str<85)return null;if(p.ovr<82)return null;if(Math.random()>0.5)return null;const m=[];const pool=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=82&&c.name!==p.club.name);for(const st of['1/4','1/2','Финал']){const r=simMatch(pick(pool),'Клубный ЧМ '+st);m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'Клубный ЧМ',season:p.season});p.morale=cm(p.morale+15);showToast('🏆 Клубный Чемпионат Мира!','success')}}return m}

function simTournament(name,key){
  const m=[];const pool=NTS.filter(n=>n.name!==p.ntName);
  for(let i=0;i<3;i++){const o=pick(pool);const r=simMatch(o,name+' Группа');m.push(r);recordMatch(key,r)}

}

  if(isAfrican&&p.ovr>=76&&y%2===0&&y>=2024){const matches=simTournament('Кубок Африки','copa_africa');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Кубок Африки',season:p.season});res.newTrophies.push('Кубок Африки')}}
  if(isAsian&&p.ovr>=76&&y%4===0&&y>=2027){const matches=simTournament('Кубок Азии','copa_asia');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Кубок Азии',season:p.season});res.newTrophies.push('Кубок Азии')}}
  if(isConcacaf&&p.ovr>=76&&y%2===1&&y>=2025){const matches=simTournament('Золотой Кубок','gold_cup');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Золотой Кубок',season:p.season});res.newTrophies.push('Золотой Кубок')}}
  if(p.ntRegion==='eu'&&p.ovr>=76&&y%2===1&&y>=2024){const matches=simTournament('Лига наций','nations_league');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Лига наций УЕФА',season:p.season});res.newTrophies.push('Лига наций УЕФА')}}
  return res;
}
function simConfederations(){const y=getYear();if(y%4!==0||y<2026)return null;if(p.ovr<85)return null;const m=[];for(let i=0;i<3;i++){const opp=pick(NTS);const r=simMatch(opp,'Кубок Конфедераций');m.push(r);recordMatch('euro',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2&&Math.random()>0.4){p.trophies.push({name:'Кубок Конфедераций',season:p.season});showToast('🏆 Кубок Конфедераций выигран!','success')}return m}

function simSeason(skipLeague){
  const res={league:[],cup:[],cl:[]};
  if(!skipLeague) res.league=simLeague();
  res.cup=simCup();
  if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();
  simClubWorldCup();
  simConfederations();
  checkWorldXI();
  simAllStarMatch();
  simBeachWorldCup();
  simThreeVsThree();
  const newRes=simNewTournaments();
  if(newRes.newTrophies.length)p._newTrophies=newRes.newTrophies;
  if(!skipLeague){
    const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;
    const winRate=res.league.length?lw/res.league.length:0;
    const topClubs=Object.values(LEAGUE_CLUBS).flat().sort((a,b)=>b.str-a.str).slice(0,5);
    const isTopClub=topClubs.some(c=>c.name===p.club.name);
    if(winRate>=0.75&&isTopClub&&Math.random()<0.5){p.trophies.push({name:'Чемпионат',season:p.season})}
  } else if(p.campaign){
    const total=p.campaign.totalWins+p.campaign.totalDraws+p.campaign.totalLosses;
    const winRate=total?p.campaign.totalWins/total:0;
    const topClubs=Object.values(LEAGUE_CLUBS).flat().sort((a,b)=>b.str-a.str).slice(0,5);
    const isTopClub=topClubs.some(c=>c.name===p.club.name);
    if(winRate>=0.65&&isTopClub&&Math.random()<0.55){p.trophies.push({name:'Чемпионат',season:p.season})}
    else if(winRate>=0.5&&isTopClub&&Math.random()<0.35){p.trophies.push({name:'Чемпионат',season:p.season})}
  }
  return res;
}

function applyRivalResult(opt,kind){if(!p.enemies||!p.enemies.length)return;const enemy=p.enemies[0];if(kind==='success'){if(Math.random()<0.35){p.enemies.shift();addDiary(`⚔️ Унизил ${enemy.name} на поле`);p.morale=cm(p.morale+8)}p.fans=cm(p.fans+3)}else if(kind==='crit'){p.morale=cm(p.morale-5);enemy.dmg=(enemy.dmg||2)+1;tryRivalInjury()}}
function applyFriendResult(opt,kind){if(!p.friends||!p.friends.length)return;const friend=p.friends[0];if(kind==='success'){friend.bonus=(friend.bonus||1)+1;p.partners=cm(p.partners+3);p.morale=cm(p.morale+3)}}
function tryRivalInjury(){if(!p.enemies||!p.enemies.length)return;const enemy=p.enemies[0];if(Math.random()<0.30){p._rivalInjured={name:enemy.name,matches:ri(3,6)};addDiary(`🤕 ${enemy.name} травмирован — преимущество!`);addTweet('News',`${enemy.name} выбыл на ${p._rivalInjured.matches} матчей!`);showToast(`💪 ${enemy.name} выбыл! +шанс на гол`,'success')}}

function initSeasonCampaign(){
  const hasEuro=p.club.str>=78&&p.ovr>=70;
  p.campaign={stage:0,totalStages:STAGE_COUNT,stageResults:[],totalGoals:0,totalAssists:0,totalWins:0,totalDraws:0,totalLosses:0,stageOpps:genAllStageOpponents(),startedAt:getYear(),euroActive:hasEuro,euroStage:0,euroOpponents:hasEuro?genEuroOpponents():[],euroResults:[],euroEliminated:false};
  p._campaignPlayed=true;
}
function genAllStageOpponents(){
  const key=getPlayerLeague(p.club.name);const clubs=(LEAGUE_CLUBS[key]||[]).filter(c=>c.name!==p.club.name);const all=[];
  for(let i=0;i<STAGE_COUNT;i++){const shuffled=[...clubs].sort(()=>Math.random()-.5);const sorted=shuffled.sort((a,b)=>b.str-a.str);const opps=sorted.slice(0,MATCHES_PER_STAGE);opps.sort((a,b)=>(a.str+(i*3))-(b.str+(i*3)));all.push(opps.map(o=>o))}
  return all;
}
function genEuroOpponents(){const top=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=82&&c.name!==p.club.name).sort((a,b)=>b.str-a.str).slice(0,12);const sh=[...top].sort(()=>Math.random()-0.5);return sh.slice(0,6)}
function getStageOpponents(stageIdx){return p.campaign?.stageOpps?.[stageIdx]||[]}
function renderStageProgress(current){let html='<div class="stage-progress">';for(let i=0;i<STAGE_COUNT;i++){const cls=i<current?'done':i===current?'current':'';html+=`<div class="stage-dot ${cls}">${i+1}</div>`}html+='</div>';return html}

function talkToCoach(){const roll=Math.random();if(roll<0.4){p.trust=cm(p.trust+15);p.morale=cm(p.morale+10);addDiary('💬 Разговор с тренером помог');showToast('✅ Тренер дал шанс!','success');save();setTimeout(()=>startKeyMatch(),400)}else if(roll<0.75){p.trust=cm(p.trust+5);showToast('😐 Тренер выслушал','info');save();setTimeout(acceptBench,600)}else{p.trust=cm(p.trust-5);p.morale=cm(p.morale-5);showToast('😠 Тренер разозлился','error');save();setTimeout(acceptBench,600)}}
function acceptBench(){const stage=p.campaign.stage;const opps=getStageOpponents(stage);const wasBenched=p._benched;p._benched=true;opps.forEach(opp=>{const r=simMatch(opp,'Чемпионат');recordMatch('league',r);if(r.tg>r.og)p.campaign.totalWins++;else if(r.tg===r.og)p.campaign.totalDraws++;else p.campaign.totalLosses++});p._benched=wasBenched;p.campaign.stageResults[stage]={action:'bench',prepNote:'🪑 Пропустил этап',stageGoals:0,stageAssists:0,keyMatch:{opp:'—',tg:0,og:0,pg:0,assist:0}};p.campaign.stage++;p.morale=cm(p.morale-5);addDiary(`🪑 Этап ${stage+1}: сидел на лавке`);save();showStageRecap(stage)}
function requestBenchTransfer(){if(p.money<1e6){showToast('⚠️ Нужно €1M','error');return}p.money-=1e6;if(Math.random()<0.5){p._forcedTransfer=true;p.trust=cm(p.trust+10);showToast('📤 Трансфер согласован!','success');addDiary('📤 Запросил трансфер (со скамейки)');setTimeout(acceptBench,800)}else{p.trust=cm(p.trust-10);showToast('❌ Клуб отказал','error');save()}}

  const opps=getStageOpponents(stage);

  content.innerHTML=html;hideFAB();

function doStagePrep(action){
  const effs={
    train:()=>{const s=pick(['pac','sho','pas','dri','phy']);const gain=ri(1,3);p[s]=cl(p[s]+gain);p.morale=cm(p.morale-5);p.ovr=calcOvr();p._prepNote=`💪 +${gain} ${s.toUpperCase()}, −5 морали`},
    tactic:()=>{p.trust=cm(p.trust+8);p._stageBonus=0.05;p._prepNote=`🧠 +8 Trust, +5% к успеху`},
    media:()=>{p.fans=cm(p.fans+5);p.press=cm(p.press+8);p.morale=cm(p.morale-3);p._prepNote=`📸 +5 Фанаты, +8 Пресса`},
    rest:()=>{p.morale=cm(p.morale+10);restoreEnergy(30);p._restShield=true;p._prepNote=`😴 +10 Мораль, +30 Энергии`}
  };
  effs[action]();
  p.campaign.stageResults[p.campaign.stage]={action,prepNote:p._prepNote};
  p._prepNote=null;save();afterStagePrep();
}
function afterStagePrep(){
  if(p.isCaptain&&!p._captainSpeechUsed&&p.campaign.stage===1){setTimeout(showCaptainSpeech,200);return}
  if(p._captainSpeechSeason!==getYear())p._captainSpeechUsed=false;
  const stage=p.campaign.stage;const opps=getStageOpponents(stage);const keyOpp=opps.reduce((a,b)=>b.str>a.str?b:a,opps[0]);p.campaign.currentOpp=keyOpp;
  const isDecisive=isDecisiveStage(stage);
  content.innerHTML=`<div class="tab-title">🔥 КЛЮЧЕВОЙ МАТЧ${isDecisive?' ⚡ РЕШАЮЩИЙ':''}</div><div class="card" style="text-align:center;padding:16px;background:linear-gradient(135deg,#1a0a3a,#0a0520)"><div style="font-size:.7em;color:var(--muted)">ПРОТИВНИК</div><div style="font-size:1.15em;font-weight:800;color:var(--yellow);margin-top:6px">${keyOpp.name}</div><div class="muted" style="font-size:.7em;margin-top:6px">Сила соперника <b style="color:#fff">${keyOpp.str}</b> · Твой OVR <b style="color:#fff">${p.ovr}</b></div>${isDecisive?'<div style="margin-top:10px;padding:6px;background:#4a0a0a;border-radius:6px;font-size:.7em;color:#ff9800;font-weight:800">⚡ РЕШАЮЩИЙ МАТЧ СЕЗОНА</div>':''}</div><div class="card"><div class="card-title">🎬 КАК ИГРАЕМ?</div><button class="btn btn-gold" onclick="startLiveMatchFlow()" style="font-size:.85em;padding:14px;margin-bottom:6px">🎬 Смотреть вживую<br><small style="font-size:.7em;opacity:.85;font-weight:500">Решения, комментатор, поле</small></button><button class="btn btn-blue" onclick="startKeyMatch()" style="font-size:.8em;margin-bottom:6px">⚡ Быстро — 3 момента</button><button class="btn btn-gray" onclick="skipStageMatch()" style="font-size:.75em">⏩ Мгновенно симулировать</button></div>`;
  hideFAB();
}
function isDecisiveStage(stage){if(stage!==p.campaign.totalStages-1)return false;const total=p.campaign.totalWins+p.campaign.totalDraws+p.campaign.totalLosses;const winRate=total?p.campaign.totalWins/total:0;return winRate>=0.55}
function getDecisiveMoments(){const pool=getMomentPoolByPos();return [...pool].sort(()=>Math.random()-.5).slice(0,5)}

function startKeyMatch(){
  const stage=p.campaign.stage;const opps=getStageOpponents(stage);
  const decisive=isDecisiveStage(stage);
  const pool=getMomentPoolByPos();let moments;
  if(decisive) moments=getDecisiveMoments();else moments=[...pool].sort(()=>Math.random()-.5).slice(0,3);
  p.campaign.isDecisive=decisive;
  const rivalMoment=maybeInjectRivalMoment();const friendMoment=!rivalMoment?maybeInjectFriendMoment():null;
  if(rivalMoment)moments[0]=rivalMoment;else if(friendMoment)moments[1]=friendMoment;
  const keyOpp=opps.reduce((a,b)=>b.str>a.str?b:a,opps[0]);
  p.campaign.currentOpp=keyOpp;p.campaign.currentMoment=0;p.campaign.currentMoments=moments;p.campaign.matchState={goals:0,assists:0,oppGoals:0,minute:15};
  showMoment();
}
function calcMomentChance(stat){
  const base=(p[stat]||50)/110;const formMod=1+(p.form||0)*0.08;const moraleMod=0.85+(p.morale||75)/400;const stageBonus=p._stageBonus||0;const injuryPenalty=p.injury?0.6:1;const rivalBonus=p._rivalInjured?1.15:1;
  const strategyMult=(typeof liveMatch!=='undefined'&&liveMatch?.playerChanceMult)||p._liveStrategyMult||1;
  const energyMult=getEnergyPenalty();
  const chemBonus=getChemBonus();
  const penBonus=(stat==='sho'&&p.pen)?(p.pen-50)/200:0;
  let oppMult=1;if(p._oppBonus&&p._oppBonus.stat===stat)oppMult=p._oppBonus.mult;
  return Math.min(0.88,base*formMod*moraleMod*injuryPenalty*rivalBonus*strategyMult*energyMult*chemBonus*oppMult+stageBonus+penBonus);
}
function showMoment(){
  const m=p.campaign.currentMoments[p.campaign.currentMoment];const st=p.campaign.matchState;const opp=p.campaign.currentOpp;
  let html=`<div class="card" style="background:linear-gradient(135deg,#0d3d0d,#1a5c1a);color:#fff;padding:14px"><div style="display:flex;justify-content:space-between;font-size:.9em;font-weight:800"><span>vs ${opp.name}</span><span>${st.minute}' · ${st.goals}:${st.oppGoals}</span></div>${m.isRival?`<div style="margin-top:8px;padding:6px 10px;background:#3a0a0a;border-radius:6px;font-size:.7em;color:#ff6b6b;font-weight:800">⚔️ ЛИЧНАЯ ВСТРЕЧА С ${m.rival.name.toUpperCase()}</div>`:''}${m.isFriend?`<div style="margin-top:8px;padding:6px 10px;background:#0a2a3a;border-radius:6px;font-size:.7em;color:#6bd8ff;font-weight:800">🤝 НА ПОЛЕ С ${m.friend.name.toUpperCase()}</div>`:''}<div class="muted" style="font-size:.7em;margin-top:6px;color:#bbb">${p.campaign.isDecisive?'🔥 РЕШАЮЩИЙ МАТЧ':'🔥 Ключевой момент'} ${p.campaign.currentMoment+1}/${p.campaign.currentMoments.length}</div>${p.campaign.isDecisive?'<div style="margin-top:4px;padding:4px 8px;background:#4a0a0a;border-radius:6px;font-size:.65em;color:#ff9800;font-weight:800">⚡ МАКСИМАЛЬНАЯ СТАВКА</div>':''}</div><div class="card"><div style="font-size:.95em;line-height:1.5;margin-bottom:14px;font-weight:600">${m.text}</div>${m.options.map((o,i)=>{const ch=calcMomentChance(o.stat);const label=ch>0.6?'высокий':ch>0.4?'средний':'низкий';const col=ch>0.6?'var(--green)':ch>0.4?'var(--orange)':'var(--red)';return `<button class="choice-btn" onclick="resolveMoment(${i})" style="padding:14px;font-size:.85em;margin-bottom:6px">${o.n}<span class="moment-stat" style="color:${col}">${Math.round(p[o.stat])} ${o.stat.toUpperCase()} · ${label}</span></button>`}).join('')}</div>`;
  content.innerHTML=html;hideFAB();
}
function resolveMoment(optIdx){
  const m=p.campaign.currentMoments[p.campaign.currentMoment];const opt=m.options[optIdx];const st=p.campaign.matchState;
  const chance=calcMomentChance(opt.stat);const roll=Math.random();
  let text,kind;
  if(roll<chance){

let liveMatch = null;
function startLiveMatch(opp, comp, onFinish){
  const ourStr = p.club?.str || 75;
  const theirStr = opp.str || 75;
  const adv = (ourStr - theirStr) / 25;
  liveMatch = {
    opp, comp, onFinish, minute:0, score:{us:0,them:0}, events:[], speed:2, paused:false, finished:false,
    timerId:null, ballTimer:null, parallelTimerId:null,
    ballPos:{x:50,y:50}, stats:{goals:0, assists:0, shots:0, saves:0},
    decisions:[{minute:ri(12,18),done:false},{minute:ri(32,38),done:false},{minute:ri(52,58),done:false},{minute:ri(72,80),done:false}],
    currentDecision:null, ourChancePerMin:Math.max(0.008,0.020+adv*0.008), theirChancePerMin:Math.max(0.008,0.020-adv*0.008),
    lastCommentary:null, ourScorers:[], theirScorers:[], ourHighlights:[],
    subbed:false, subWindowShown:false, strategy:null, playerChanceMult:1, parallelShown:0, parallel:[],
    ourPoints:[], theirPoints:[]
  };
  showLiveMatchScreen();
  if(p._pendingStrategy){applyStrategyToLiveMatch(p._pendingStrategy);p._pendingStrategy=null}
  setCommentary(pick(LIVE_COMMENTS.kickoff));
  setTimeout(()=>{playLongWhistle();playCrowdNoise(1200)},200);
  liveMatch.ballTimer = setInterval(animateBallIdle, 750);
  startMatchTimer();
  initLivePlayers();
  liveMatch.parallelTimerId = setInterval(()=>{if(!liveMatch||liveMatch.finished||liveMatch.paused)return;if(Math.random()<0.35)pushParallelResults()},6000);
}

function updateLiveScoreboard(){const sc=document.getElementById('liveScore');const min=document.getElementById('liveMinute');if(sc)sc.textContent=`${liveMatch.score.us} : ${liveMatch.score.them}`;if(min){const half=liveMatch.minute<=45?'1-й тайм':'2-й тайм';min.textContent=`${liveMatch.minute}' · ${half}`}}
function startMatchTimer(){if(liveMatch.timerId)clearInterval(liveMatch.timerId);const interval=400/liveMatch.speed;liveMatch.timerId=setInterval(tickLiveMatch,interval)}
function setLiveSpeed(s){if(!liveMatch||liveMatch.finished)return;liveMatch.speed=s;document.querySelectorAll('.speedBtn').forEach(b=>b.classList.toggle('active',String(b.dataset.sp)===String(s)));startMatchTimer();if(navigator.vibrate)navigator.vibrate(8)}
function toggleLivePause(){if(!liveMatch||liveMatch.finished)return;liveMatch.paused=!liveMatch.paused;const btn=document.getElementById('livePauseBtn');if(btn)btn.textContent=liveMatch.paused?'▶':'⏸'}
function tickLiveMatch(){
  if(!liveMatch||liveMatch.finished||liveMatch.paused)return;
  liveMatch.minute++;updateLiveScoreboard();
  const dec=liveMatch.decisions.find(d=>!d.done&&liveMatch.minute>=d.minute);
  if(dec){dec.done=true;showLiveDecision();return}
  generateLiveMinuteEvents();
  if(liveMatch.minute===45){pushLiveEvent({min:45,text:'🥤 Перерыв',type:'half'});setCommentary(pick(LIVE_COMMENTS.half));playShortWhistle()}

}
function generateLiveMinuteEvents(){

  if(Math.random()<liveMatch.theirChancePerMin){liveMatch.score.them++;const oppScorer=pick(['Мбаппе','Холанд','Кейн','Салах','Винисиус','Беллингем','Левандовски']);pushLiveEvent({min:liveMatch.minute,text:`😢 Гол ${liveMatch.opp.name} — ${oppScorer}`,type:'goal_them'});liveMatch.theirScorers.push({minute:liveMatch.minute,name:oppScorer});setCommentary(pick(LIVE_COMMENTS.goal_them));ballToGoal(false);setTimeout(()=>moveBall(50,50),850);updateLiveScoreboard();playTone(220,400,'sawtooth',0.08)}
  if(Math.random()<0.06)setCommentary(pick(LIVE_COMMENTS.mid));
  if(Math.random()<0.04){pushLiveEvent({min:liveMatch.minute,text:'🟨 Карточка сопернику',type:'yellow'});setCommentary(pick(LIVE_COMMENTS.yellow))}
}
function pushLiveEvent(ev){if(!liveMatch)return;liveMatch.events.push(ev);const tl=document.getElementById('liveTimeline');if(!tl)return;const cls=ev.type==='goal_us'?'goal-us':ev.type==='goal_them'?'goal-them':ev.type==='yellow'?'yellow':'';const div=document.createElement('div');div.className=`live-event ${cls}`;div.innerHTML=`<span class="min">${ev.min}'</span><span>${ev.text}</span>`;tl.insertBefore(div,tl.firstChild)}
function setCommentary(text){const el=document.getElementById('liveComment');if(!el||text===liveMatch?.lastCommentary)return;if(liveMatch)liveMatch.lastCommentary=text;el.textContent=text;el.style.opacity='0';setTimeout(()=>{el.style.opacity='1';el.style.transition='opacity .3s'},30)}
function moveBall(x,y){if(!liveMatch)return;liveMatch.ballPos={x,y};const ball=document.getElementById('liveBall');if(ball){ball.style.left=x+'%';ball.style.top=y+'%'}clearTimeout(liveMatch._playerAnimTid);liveMatch._playerAnimTid=setTimeout(animatePlayersTowardBall,60)}
function ballToGoal(scoring){if(scoring)moveBall(98,50);else moveBall(2,50)}
function animateBallIdle(){if(!liveMatch||liveMatch.finished||liveMatch.paused)return;moveBall(50+ri(-22,22),50+ri(-18,18))}
function initLivePlayers(){

  const ourFormation=[{x:8,y:50},{x:25,y:20},{x:25,y:50},{x:25,y:80},{x:45,y:30},{x:45,y:50},{x:45,y:70},{x:65,y:25},{x:65,y:50},{x:65,y:75}];
  const theirFormation=ourFormation.map(pt=>({x:100-pt.x,y:pt.y}));
  const myPosIndex={'GK':0,'CB':2,'LB':1,'RB':3,'CDM':4,'CM':5,'CAM':5,'LW':7,'RW':9,'ST':8,'CF':8,'SS':8}[p.pos]??8;
  liveMatch.ourPoints=ourFormation.map((pt,i)=>{const el=document.createElement('div');el.className='live-player us'+(i===myPosIndex?' mine':'');el.style.left=pt.x+'%';el.style.top=pt.y+'%';pitch.appendChild(el);return{el,base:pt,i}});

}
function animatePlayersTowardBall(){
  if(!liveMatch||liveMatch.finished)return;const b=liveMatch.ballPos;const shiftX=(b.x-50)*0.25;const shiftY=(b.y-50)*0.2;
  (liveMatch.ourPoints||[]).forEach(({el,base,i})=>{const isGK=i===0;const off=isGK?0:1;el.style.left=(base.x+shiftX*off)+'%';el.style.top=(base.y+shiftY*off)+'%'});
  (liveMatch.theirPoints||[]).forEach(({el,base,i})=>{const isGK=i===0;const off=isGK?0:1;el.style.left=(base.x-shiftX*off)+'%';el.style.top=(base.y-shiftY*off)+'%'});
}
function genParallelResults(){
  const key=getPlayerLeague(p.club.name);const clubs=(LEAGUE_CLUBS[key]||[]).filter(c=>c.name!==p.club.name);const sh=[...clubs].sort(()=>Math.random()-0.5);const results=[];
  for(let i=0;i<Math.min(6,Math.floor(sh.length/2));i++){const a=sh[i*2],b=sh[i*2+1];if(!a||!b)continue;const aG=Math.max(0,Math.round((a.str-b.str)/22+1.3+ri(-1,1)));const bG=Math.max(0,Math.round((b.str-a.str)/22+1.3+ri(-1,1)));results.push({a:a.name,b:b.name,ag:aG,bg:bG})}
  return results;
}
function pushParallelResults(){
  if(!liveMatch||liveMatch.finished||liveMatch.parallelShown>=3)return;
  const parallel=genParallelResults();if(!parallel.length)return;
  liveMatch.parallelShown++;liveMatch.parallel=liveMatch.parallel||[];liveMatch.parallel.push(...parallel.slice(0,2));
  const tl=document.getElementById('liveTimeline');
  if(tl){const div=document.createElement('div');div.style.cssText='margin-top:6px;padding:6px 8px;background:rgba(33,150,243,.08);border-left:3px solid var(--blue);border-radius:4px;font-size:.65em;color:#9ecfff';div.innerHTML='<div style="font-weight:800;margin-bottom:3px">📡 ДРУГИЕ МАТЧИ</div>'+parallel.slice(0,2).map(r=>`<div>${r.a} <b style="color:#fff">${r.ag}:${r.bg}</b> ${r.b}</div>`).join('');tl.insertBefore(div,tl.firstChild)}
}
function showLiveDecision(){
  liveMatch.paused=true;const pool=getMomentPoolByPos();const moment=pick(pool);liveMatch.currentDecision=moment;
  const html=`<div class="live-decision" id="liveDecision"><div class="dt">🔥 ${liveMatch.minute}' · КЛЮЧЕВОЙ МОМЕНТ</div><div class="dd">${moment.text}</div>${moment.options.map((o,i)=>{const ch=calcMomentChance(o.stat);const col=ch>0.6?'var(--green)':ch>0.4?'var(--orange)':'var(--red)';return `<button onclick="resolveLiveDecision(${i})">${o.n}<span class="ms" style="color:${col}">${Math.round(p[o.stat])} ${o.stat.toUpperCase()}</span></button>`}).join('')}</div>`;
  const tl=document.getElementById('liveTimeline');if(tl)tl.insertAdjacentHTML('beforebegin',html);
  setCommentary('⚡ Момент! Решай!');if(navigator.vibrate)navigator.vibrate([20,50,20]);

function resolveLiveDecision(optIdx){
  if(liveMatch.subbed){const teammates=p._teammates?.list||[];const scorer=teammates.length?pick(teammates):{name:'Партнёр',pos:'CM'};if(Math.random()<0.35){liveMatch.score.us++;pushLiveEvent({min:liveMatch.minute,text:`⚽ Гол! ${scorer.name} (${scorer.pos})`,type:'goal_us'});setCommentary('⚽ Партнёр отличился!')}liveMatch.currentDecision=null;liveMatch.paused=false;save();return}
  const moment=liveMatch.currentDecision;const opt=moment.options[optIdx];const chance=calcMomentChance(opt.stat);const roll=Math.random();
  let result,kind;
  if(roll<chance){result=opt.success;kind='success';
    if(result.includes('ГОЛ')||result.includes('ПУШКА')||result.includes('ШЕДЕВР')||result.includes('забил')||result.includes('падении')){liveMatch.score.us++;liveMatch.stats.goals++;recordHighlight('goal',liveMatch.minute,`${p.name.split(' ')[1]||p.name} забил!`,{stat:opt.stat});ballToGoal(true);setTimeout(()=>moveBall(50,50),850)}
    else if(result.includes('Ассист')||result.includes('отдал')){liveMatch.stats.assists++;recordHighlight('assist',liveMatch.minute,`${p.name.split(' ')[1]||p.name} ассистировал`,{stat:opt.stat});moveBall(75,ri(30,70));setTimeout(()=>moveBall(50,50),700)}
    pushLiveEvent({min:liveMatch.minute,text:`⚽ ${result}`,type:'goal_us'});setCommentary(pick(LIVE_COMMENTS.goal_us));p.morale=cm(p.morale+3);
    if(navigator.vibrate)navigator.vibrate(40);if(result.includes('ГОЛ')||result.includes('ПУШКА'))playGoalSound();playCrowdNoise(1000);
  }else if(roll<chance+0.10&&opt.critFail){result=opt.critFail;kind='crit';recordHighlight('crit',liveMatch.minute,result,{});pushLiveEvent({min:liveMatch.minute,text:`💥 ${result}`,type:'yellow'});setCommentary('😤 Ошибка!');p.morale=cm(p.morale-5);if(navigator.vibrate)navigator.vibrate(60)
  }else{result=opt.fail;kind='fail';pushLiveEvent({min:liveMatch.minute,text:`❌ ${result}`,type:'miss'});setCommentary(pick(LIVE_COMMENTS.miss))}
  updateLiveScoreboard();
  const d=document.getElementById('liveDecision');
  if(d){const col=kind==='success'?'var(--green)':kind==='crit'?'var(--red)':'var(--orange)';const tt=kind==='success'?'🔥 УСПЕХ':kind==='crit'?'💥 ПРОВАЛ':'😐 НЕ ВЫШЛО';d.innerHTML=`<div class="dt">${tt}</div><div class="live-result" style="color:${col}">${result}</div>`;setTimeout(()=>{d.remove();liveMatch.paused=false;liveMatch.currentDecision=null;setTimeout(()=>moveBall(50,50),200)},1300)}
  save();
}
function recordHighlight(type,minute,text,extra){if(!liveMatch)return;liveMatch.ourHighlights=liveMatch.ourHighlights||[];liveMatch.ourHighlights.push({type,minute,text,...extra})}
function finishLiveMatch(){

function skipLiveMatch(){if(!liveMatch||liveMatch.finished)return;if(!confirm('Пропустить остаток матча?'))return;const remaining=90-liveMatch.minute;for(let i=0;i<remaining;i++){if(Math.random()<liveMatch.ourChancePerMin*0.45)liveMatch.score.us++;if(Math.random()<liveMatch.theirChancePerMin)liveMatch.score.them++}liveMatch.minute=90;updateLiveScoreboard();finishLiveMatch()}

function startLiveMatchFlow(){

          const stage=p.campaign.stage;p.campaign.stageResults[stage]=p.campaign.stageResults[stage]||{};
          p.campaign.stageResults[stage].keyMatch=res;p.campaign.stageResults[stage].stageGoals=res.pg;p.campaign.stageResults[stage].stageAssists=res.assist;
          if(res.tg>res.og)p.campaign.totalWins++;else if(res.tg===res.og)p.campaign.totalDraws++;else p.campaign.totalLosses++;

function generateYouthProspects(count){
  const list=[];
  for(let i=0;i<count;i++){const pos=pick(POSITIONS).k;const age=ri(15,18);const potential=cl((p.club?.str||75)+ri(-15,15)+(18-age)*2);const current=cl(potential-ri(10,25));const name=pick(YOUTH_FIRST)+' '+pick(YOUTH_LAST);const traits=['Скорость','Удар','Видение поля','Дриблинг','Характер','Физика','Игра головой','Пас'];list.push({id:'y_'+Date.now()+'_'+i,name,pos,age,potential,current,trait:pick(traits),foot:pick(['левый','правый','обе']),country:pick(['ru','es','br','fr','de','it','pt','ar','nl']),scouted:false,rejected:false})}
  return list.sort((a,b)=>b.potential-a.potential);
}
function showYouthDraft(){
  if(!p.youthProspects||p.youthProspects.length===0){p.youthProspects=generateYouthProspects(8);p.youthDraftYear=getYear();save()}

function scoutYouth(index){
  const y=p.youthProspects[index];if(!y)return;
  if(p._youthDraftedThisYear){showToast('⚠️ Уже выбрал в этом сезоне','warn');return}
  const scouted=p.youthProspects.filter(x=>x.scouted).length;if(scouted>=3){showToast('⚠️ Максимум 3','warn');return}

function playTone(freq,dur=200,type='sine',vol=0.15){if(!p.soundOn)return;try{initAudio();if(!audioCtx)return;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur/1000);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur/1000)}catch(e){}}

function playCrowdNoise(dur=1500){if(!p.soundOn)return;try{initAudio();if(!audioCtx)return;const bufferSize=audioCtx.sampleRate*(dur/1000);const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<bufferSize;i++){data[i]=(Math.random()*2-1)*0.08*(1-i/bufferSize)}const src=audioCtx.createBufferSource();src.buffer=buffer;const gain=audioCtx.createGain();gain.gain.value=0.5;const filter=audioCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=500;filter.Q.value=0.7;src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start()}catch(e){}}

function shootPenalty(zone){
