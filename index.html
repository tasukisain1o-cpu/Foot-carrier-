<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: PRO</title>
<style>
:root{--bg:#0a0a0a;--app:#161616;--card:#1f1f1f;--card2:#252525;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2e2e2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
#app{width:100%;max-width:420px;height:96vh;max-height:820px;background:var(--app);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}

.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase}
.hdr-title small{display:block;font-size:.6em;opacity:.7;font-weight:500;letter-spacing:.5px}
.hdr-tr{font-size:.7em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}

.status{display:grid;grid-template-columns:repeat(5,1fr);background:#1c1c1c;padding:6px 4px;font-size:.58em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.status>div b{display:block;color:var(--text);font-size:1.4em;margin-top:1px;font-weight:700}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.5em;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.5px}
.stats>div b{display:block;font-size:1.5em;color:var(--yellow);margin-top:1px;font-weight:800}

.timeline{display:flex;gap:3px;padding:6px 8px;background:#1c1c1c;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl-age{padding:3px 7px;border-radius:6px;background:#2a2a2a;font-size:.62em;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .3s}
.tl-age.active{background:var(--green);color:white;font-weight:800;transform:scale(1.15);box-shadow:0 0 12px rgba(76,175,80,.6)}
.tl-age.done{background:#1a3a1a;color:#4caf50}

.content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}

.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px}

.btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;transition:all .15s;font-family:inherit;letter-spacing:.3px}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-blue{background:var(--blue)}.btn-blue:hover{background:#1976d2}
.btn-gray{background:#333}.btn-gray:hover{background:#444}
.btn-red{background:var(--red);font-size:.7em;padding:8px}.btn-red:hover{background:#d32f2f}
.btn-yellow{background:var(--orange);color:#000}.btn-yellow:hover{background:#e68900}

.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px;letter-spacing:.5px}

/* FIFA-style match card */
.fifa-match{background:linear-gradient(135deg,#1a2a3a,#0f1a25);border-radius:12px;padding:10px 12px;margin-bottom:6px;border:1px solid #2a4a6a;position:relative;overflow:hidden}
.fifa-match.w{border-color:#2e7d32;background:linear-gradient(135deg,#1a2a1a,#0f250f)}
.fifa-match.l{border-color:#7d2e2e;background:linear-gradient(135deg,#2a1a1a,#250f0f)}
.fifa-match.d{border-color:#7d5a2e;background:linear-gradient(135deg,#2a241a,#25200f)}
.fifa-match.miss{opacity:.4;filter:grayscale(.8)}
.fifa-comp{font-size:.55em;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.fifa-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fifa-team{display:flex;align-items:center;gap:6px;font-size:.75em;font-weight:600}
.fifa-team.home{justify-content:flex-end;text-align:right}
.fifa-team.away{justify-content:flex-start;text-align:left}
.fifa-team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.fifa-score{background:#000;color:var(--yellow);font-weight:900;font-size:1.1em;padding:4px 10px;border-radius:6px;letter-spacing:2px;font-family:'Courier New',monospace;border:1px solid #333}
.fifa-foot{display:flex;justify-content:center;gap:8px;margin-top:6px;font-size:.65em;color:var(--muted)}
.fifa-goal{color:var(--green);font-weight:700}
.fifa-badge{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:50%;padding:1px;flex-shrink:0}

.match{display:grid;grid-template-columns:18px 1fr 44px 30px 22px;gap:6px;align-items:center;padding:7px 8px;background:var(--card2);border-radius:7px;margin-bottom:4px;font-size:.72em;border-left:3px solid #333}
.match.w{border-left-color:var(--green)}.match.l{border-left-color:var(--red)}.match.d{border-left-color:var(--orange)}
.match.miss{opacity:.5}.match .opp{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .score{font-weight:800;color:var(--yellow);text-align:center;font-size:1.1em}
.match .pg{text-align:center;color:var(--green);font-weight:700}.match .pg.empty{color:#444}
.match .res{text-align:center;font-size:.9em}

.train-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.train-btn{background:#2a2a2a;border:1.5px solid #3a3a3a;color:var(--text);padding:8px 3px;border-radius:9px;font-size:.6em;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.train-btn:hover{background:var(--purple);border-color:#9c27b0}
.train-btn:active{transform:scale(.96)}
.train-btn .val{display:block;font-size:1.5em;color:var(--yellow);margin-top:2px;font-weight:800}

.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.shop-btn{background:#1a1a1a;border:1px solid #333;color:var(--text);padding:8px;border-radius:9px;font-size:.65em;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.shop-btn:hover{background:#2a2a2a;border-color:var(--green)}
.shop-btn b{display:block;font-size:.95em;margin-bottom:2px}
.shop-btn small{color:var(--muted);font-size:.9em}
.shop-btn.bought{border-color:var(--green);background:#1a2a1a}

.club-card{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px;margin-bottom:6px;border-left:3px solid var(--green)}
.club-logo{width:34px;height:34px;object-fit:contain;background:white;border-radius:50%;padding:3px;flex-shrink:0}
.club-info{flex:1;min-width:0}
.club-info h3{font-size:.82em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-info p{font-size:.65em;color:var(--muted);margin-top:1px}
.club-price{color:var(--green);font-weight:800;font-size:.8em;white-space:nowrap}

.summary-bar{display:flex;justify-content:space-around;background:#1a1a1a;border-radius:9px;padding:8px;margin-bottom:10px;font-size:.65em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.4em;font-weight:800;margin-top:2px}

/* START SCREEN */
.start-hero{text-align:center;padding:20px 10px;margin-bottom:10px}
.start-hero h1{font-size:1.4em;background:linear-gradient(135deg,#4caf50,#2196f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;letter-spacing:2px;margin-bottom:6px}
.start-hero p{font-size:.75em;color:var(--muted)}

.field-label{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;font-weight:700}
.input-row{display:flex;gap:6px}
.input-box{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:9px;padding:10px 12px;color:var(--text);font-size:.85em;font-family:inherit;font-weight:600}
.input-box:focus{outline:none;border-color:var(--purple)}
.roll-btn{background:var(--purple);border:none;border-radius:9px;padding:0 14px;color:white;font-size:1.1em;cursor:pointer;font-weight:700}
.roll-btn:hover{background:#9c27b0}

.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pos-btn{background:#1a1a1a;border:2px solid #333;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:.7em;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.pos-btn:hover{background:#2a2a2a;border-color:#555}
.pos-btn.sel{background:var(--green);color:#000;border-color:var(--green);transform:scale(1.03)}

.nt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:180px;overflow-y:auto;padding-right:4px}
.nt-btn{background:#1a1a1a;border:2px solid #333;color:var(--text);padding:6px 3px;border-radius:9px;font-size:.6em;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.nt-btn:hover{background:#2a2a2a}
.nt-btn.sel{border-color:var(--green);background:#1a2a1a}
.nt-btn img{width:24px;height:16px;object-fit:cover;border-radius:2px;display:block;margin:0 auto 3px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.nt-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* WC TABLE */
.group-table{background:#1a1a1a;border-radius:10px;padding:8px;font-size:.7em;margin-bottom:8px}
.gt-row{display:grid;grid-template-columns:20px 1fr 24px 24px 24px 30px;gap:5px;padding:5px 4px;align-items:center;border-bottom:1px solid #252525}
.gt-row:last-child{border:none}
.gt-row.head{color:var(--muted);font-size:.85em;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #333}
.gt-row.you{background:#1a2a1a;border-radius:5px;color:var(--yellow);font-weight:700}
.gt-row.qual{border-left:3px solid var(--green);padding-left:2px}
.gt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.gt-name img{width:18px;height:12px;object-fit:cover;border-radius:2px}
.gt-pts{font-weight:800;color:var(--yellow);text-align:center}

/* AGENT */
.agent-card{background:linear-gradient(135deg,#2a1a3a,#1a0f25);border:1px solid #5a3a7a;border-radius:12px;padding:12px;margin-bottom:10px}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.3em}
.agent-name{font-size:.85em;font-weight:700}
.agent-name small{display:block;color:var(--muted);font-weight:400;font-size:.85em}
.agent-msg{font-size:.75em;line-height:1.4;color:#ddd;background:#1a1a1a;padding:8px 10px;border-radius:8px;margin-bottom:8px;border-left:2px solid var(--purple)}
.contract-row{display:flex;justify-content:space-between;font-size:.7em;padding:3px 0;color:var(--muted)}
.contract-row b{color:var(--text)}

.end-hero{text-align:center;padding:10px 0}
.end-hero h2{font-size:1.1em;color:var(--yellow);margin-bottom:6px}
.end-hero .legacy{font-size:.95em;font-weight:800;margin:8px 0;padding:8px;background:linear-gradient(135deg,#2a1a4a,#4a1a6a);border-radius:10px}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:.72em}
.end-stats div{background:var(--card);padding:8px;border-radius:8px;text-align:center}
.end-stats b{display:block;color:var(--yellow);font-size:1.3em;margin-top:2px}
.history-list{max-height:150px;overflow-y:auto;background:#1a1a1a;border-radius:8px;padding:8px;font-size:.7em;margin-top:8px}
.history-list::-webkit-scrollbar{width:3px}
.history-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.hist-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #252525}
.hist-item:last-child{border:none}

.text-center{text-align:center}.mb-8{margin-bottom:8px}.mt-8{margin-top:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}.hl-g{color:var(--green);font-weight:700}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

const logoCache={};
async function getLogo(name){
  if(logoCache[name])return logoCache[name];
  const q=apiMap[name]||name;
  try{
    const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(d.teams&&d.teams.length){logoCache[name]=d.teams[0].strTeamBadge||PH;return logoCache[name];}
  }catch(e){}
  logoCache[name]=PH;return PH;
}

function doTrain(stat){
  if(p.tp<=0)return;
  const gain=ri(1,3);
  p[stat]=cl(p[stat]+gain);
  p.tp--;p.ovr=calcOvr();
  $('tr_'+stat).textContent=p[stat];
  $('sOvr').textContent=p.ovr;
  document.querySelector('.summary-bar div:nth-child(2) b').textContent=p.tp;
  if(p.tp<=0)$('btnNext').disabled=false;
}

function buyYacht(){if(p.money>=10&&!p.hasYacht){p.money-=10;p.hasYacht=true;p.morale=cm(p.morale+10);showTraining()}}
function buyInv(){if(p.money>=20&&!p.hasInv){p.money-=20;p.hasInv=true;p.sponsor+=5;showTraining()}}

  const base=Math.min(.92,p.ovr/110);
  const formMult=1+p.form*.13;
  const posMult=p.pos==='GK'?.05:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.15:p.pos==='CDM'?.25:p.pos==='CM'?.35:p.pos==='CAM'||p.pos==='LW'||p.pos==='RW'||p.pos==='SS'?.75:1;
  const injMult=p.injury?.5:1;
  return Math.min(.95,base*formMult*posMult*injMult);
}

function tryInjury(){
  let chance=.045;
  if(p.form<=-2)chance+=.02;
  if(p.phy<60)chance+=.015;
  if(p.morale<40)chance+=.01;
  if(Math.random()>chance)return null;
  const roll=Math.random();
  const stat=pick(['pac','sho','dri','phy']);
  if(roll<.6)return{name:'Лёгкая',matchesLeft:ri(1,2),stat,penalty:ri(1,3),perm:false};
  if(roll<.9)return{name:'Средняя',matchesLeft:ri(3,5),stat,penalty:ri(3,6),perm:false};
  return{name:'Тяжёлая',matchesLeft:ri(5,9),stat,penalty:ri(3,8),perm:true};
}

function applyInjury(inj){
  p[inj.stat]=cl(p[inj.stat]-inj.penalty);
  p.injury={...inj};
  p.morale=cm(p.morale-15);p.ovr=calcOvr();
}

function recoverInjury(){
  if(!p.injury)return;
  if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);
  p.injury=null;p.ovr=calcOvr();
}

function simMatch(opp,comp,isCL){
  if(p.injury&&p.injury.matchesLeft>0){
    p.injury.matchesLeft--;
    if(p.injury.matchesLeft<=0)recoverInjury();
    return{opp:opp.name,comp,tg:0,og:0,pg:0,res:'M',missed:true,isCL,oppFlag:opp.flag};
  }
  const teamStr=p.club.str+(p.ovr-75)*.4;
  const baseT=Math.max(0,Math.round((teamStr-opp.str)/22+1.4+ri(-1,1)));
  const prob=goalProb();
  let pg=0;
  if(Math.random()<prob)pg++;
  if(Math.random()<prob*.35)pg++;
  if(Math.random()<prob*.07)pg++;
  const tg=baseT+pg;
  const og=Math.max(0,Math.round((opp.str-teamStr)/22+1.4+ri(-1,1)));
  const res=tg>og?'W':tg<og?'L':'D';
  if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}
  if(pg>=2)p.form=Math.min(3,p.form+1);
  else if(pg===1)p.form=Math.min(3,p.form+.5);
  else if(res==='L')p.form=Math.max(-3,p.form-.5);
  return{opp:opp.name,comp,tg,og,pg,res,missed:false,isCL,oppFlag:opp.flag};
}

/* ============================================================
   ОТБОРОЧНЫЕ К ЧМ
============================================================ */
function simWCQualifiers(){
  // Группа из 4 команд (включая игрока)
  const pool=NTS.filter(n=>n.name!==p.ntName);
  const group=[p.nt||{name:p.ntName,flag:p.ntFlag,str:NTS.find(n=>n.name===p.ntName).str}];
  while(group.length<4){
    const t=pick(pool);
    if(!group.find(x=>x.name===t.name))group.push({name:t.name,flag:t.flag,str:t.str});
  }
  const table=group.map(t=>({...t,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0}));
  const matches=[];
  // Круговой турнир: 6 матчей
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    const A=group[i],B=group[j];
    const aGoals=Math.max(0,Math.round((A.str-B.str)/15+1.4+ri(-1,1)));
    const bGoals=Math.max(0,Math.round((B.str-A.str)/15+1.4+ri(-1,1)));
    const tA=table.find(t=>t.name===A.name),tB=table.find(t=>t.name===B.name);
    tA.p++;tB.p++;tA.gf+=aGoals;tA.ga+=bGoals;tB.gf+=bGoals;tB.ga+=aGoals;
    if(aGoals>bGoals){tA.w++;tA.pts+=3;tB.l++}
    else if(aGoals<bGoals){tB.w++;tB.pts+=3;tA.l++}
    else{tA.d++;tB.d++;tA.pts++;tB.pts++}
    // матч игрока
    if(A.name===p.ntName||B.name===p.ntName){
      const opp=A.name===p.ntName?B:A;
      const myGoals=goalProb()>Math.random()?(goalProb()>.5?2:1):0;
      matches.push({opp:opp.name,oppFlag:opp.flag,tg:aGoals,og:bGoals,pg:myGoals,res:aGoals>bGoals?'W':aGoals<bGoals?'L':'D',missed:false,comp:'Отбор ЧМ'});
      p.goalsNT+=myGoals;
    }
  }
  table.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  const qualified=table.findIndex(t=>t.name===p.ntName)<2;
  p.ntQualified=qualified;
  p.qualTable=table;
  p.caps+=matches.length;
  return{matches,table,qualified};
}

/* ============================================================
   ЧМ ФИНАЛЬНАЯ ЧАСТЬ
============================================================ */
function simWorldCup(){
  const matches=[];
  // Группа 4 команды, 3 матча
  const group=[{name:p.ntName,flag:p.ntFlag,str:p.nt.str}];
  const pool=NTS.filter(n=>n.name!==p.ntName&&!group.find(g=>g.name===n.name));
  while(group.length<4){const t=pick(pool);if(!group.find(x=>x.name===t.name))group.push({name:t.name,flag:t.flag,str:t.str})}
  let pts=0,gf=0,ga=0;
  for(let i=1;i<4;i++){
    const A=group[0],B=group[i];
    const myGoals=goalProb()>Math.random()?(goalProb()>.5?2:1):0;
    const tg=Math.max(0,Math.round((A.str-B.str)/15+1.5+ri(-1,1)))+myGoals;
    const og=Math.max(0,Math.round((B.str-A.str)/15+1.5+ri(-1,1)));
    const res=tg>og?'W':tg<og?'L':'D';
    if(res==='W')pts+=3;else if(res==='D')pts++;
    gf+=tg;ga+=og;
    matches.push({opp:B.name,oppFlag:B.flag,tg,og,pg:myGoals,res,missed:false,comp:'ЧМ Группа'});
    p.goalsNT+=myGoals;
  }
  const advanced=pts>=4||(pts>=3&&gf-ga>=1);
  if(advanced){
    // 1/8
    let r=playKnockout(matches,'ЧМ 1/8');
    if(r)r=playKnockout(matches,'ЧМ 1/4');
    if(r)r=playKnockout(matches,'ЧМ 1/2');
    if(r){
      // Финал
      const opp=pick(NTS.filter(n=>n.name!==p.ntName));
      const myGoals=goalProb()>Math.random()?(goalProb()>.5?2:1):0;
      const tg=Math.max(0,Math.round((p.nt.str-opp.str)/15+1.5+ri(-1,1)))+myGoals;
      const og=Math.max(0,Math.round((opp.str-p.nt.str)/15+1.5+ri(-1,1)));
      const res=tg>og?'W':tg<og?'L':'D';
      if(res==='W'||(res==='D'&&Math.random()>.5)){
        p.wcWins++;p.tropNT++;p.morale=cm(p.morale+30);
      }
      matches.push({opp:opp.name,oppFlag:opp.flag,tg,og,pg:myGoals,res:'W',missed:false,comp:'🏆 ЧМ ФИНАЛ'});
      p.goalsNT+=myGoals;
    }
  }
  p.caps+=matches.length;
  return{matches,advanced};
}

function playKnockout(matches,comp){
  const opp=pick(NTS.filter(n=>n.name!==p.ntName));
  const myGoals=goalProb()>Math.random()?(goalProb()>.5?2:1):0;
  const tg=Math.max(0,Math.round((p.nt.str-opp.str)/15+1.5+ri(-1,1)))+myGoals;
  const og=Math.max(0,Math.round((opp.str-p.nt.str)/15+1.5+ri(-1,1)));
  const res=tg>og?'W':tg<og?'L':'D';
  matches.push({opp:opp.name,oppFlag:opp.flag,tg,og,pg:myGoals,res,missed:false,comp});
  p.goalsNT+=myGoals;
  return res!=='L';
}

/* ============================================================
   СЕЗОН
============================================================ */
function simSeason(){
  const clubMatches=[],clMatches=[],ntMatches=[];
  let wcData=null,clResult=null;

  // Клубный чемпионат (10 матчей)
  for(let i=0;i<10;i++){
    let opp=pick(CLUBS);while(opp.name===p.club.name)opp=pick(CLUBS);
    clubMatches.push(simMatch(opp,'Чемпионат'));
  }
  
  // Лига Чемпионов
  if(p.club.str+(p.ovr-75)*.5>=82){
    const topClubs=CLUBS.filter(c=>c.str>=82&&c.name!==p.club.name);
    const gm=[];
    for(let i=0;i<3;i++)gm.push(simMatch(pick(topClubs),'ЛЧ Группа',true));
    const wins=gm.filter(m=>m.res==='W').length;
    let stage='Группа',ko=[];
    if(wins>=2){
      const qf=simMatch(pick(topClubs),'ЛЧ 1/4',true);ko.push(qf);
      if(qf.res!=='L'){const sf=simMatch(pick(topClubs),'ЛЧ 1/2',true);ko.push(sf);
        if(sf.res!=='L'){const fnl=simMatch(pick(topClubs),'ЛЧ Финал',true);ko.push(fnl);
          if(fnl.res==='W'){p.clWins++;p.tropClub++;p.morale=cm(p.morale+20);stage='🏆 ЧЕМПИОН!'}
          else stage='Финалист'
        }else stage='1/2'
      }else stage='1/4'
    }
    clResult={groupMatches:gm,knockoutMatches:ko,advanced:wins>=2,stageReached:stage};
    clMatches.push(...gm,...ko);
  }

  // Сборная
  const isWC=p.age>=18&&(p.age-18)%4===0;
  const isQual=p.age>=16&&!isWC;
  if(p.ovr>=76){
    if(!p.nt)p.nt={name:p.ntName,flag:p.ntFlag,str:NTS.find(n=>n.name===p.ntName).str};
    if(isQual){
      wcData=simWCQualifiers();
      ntMatches.push(...wcData.matches);
    }else if(isWC&&p.ntQualified){
      // финальная часть
      wcData=simWorldCup();
      ntMatches.push(...wcData.matches);
    }else if(isWC&&!p.ntQualified){
      // всё равно отбор в след году
      wcData=simWCQualifiers();
      ntMatches.push(...wcData.matches);
    }
  }

  const clubGoals=clubMatches.reduce((s,m)=>s+m.pg,0);
  const clGoals=clMatches.reduce((s,m)=>s+m.pg,0);
  const ntGoals=ntMatches.reduce((s,m)=>s+m.pg,0);
  p.goals+=clubGoals;p.goalsCL+=clGoals;
  // ntGoals уже добавлены в отдельных функциях
  
  const wins=clubMatches.filter(m=>m.res==='W').length;
  if(wins>=7&&Math.random()>.4)p.tropClub++;
  const seasonTotal=clubGoals+clGoals;
  if(p.ovr>88&&seasonTotal>20&&p.tropClub>0&&Math.random()>.65){p.ballonDors++;p.morale=cm(p.morale+20)}
  
  p.history.push({age:p.age,club:p.club.name,goals:clubGoals,cl:p.clWins>0?'⭐':''});
  
  return{clubMatches,clMatches,ntMatches,clResult,wcData,isWC,isQual,clubGoals,clGoals,ntGoals};
}

/* ============================================================
   СЛЕДУЮЩИЙ СЕЗОН
============================================================ */
function nextSeason(){
  p.season++;p.age++;
  const ev=pick(EVENTS);ev.fn();
  p.pac=cl(p.pac+ri(-2,3));p.sho=cl(p.sho+ri(-2,4));p.pas=cl(p.pas+ri(-2,3));
  p.dri=cl(p.dri+ri(-2,3));p.def=cl(p.def+ri(-1,2));p.phy=cl(p.phy+ri(-2,3));
  p.ovr=calcOvr();p.form*=.6;
  const earn=Math.round(p.ovr*ri(1,3)/10)+p.sponsor;p.money+=earn;
  p.tp=p.age<=20?ri(3,5):p.age<=24?ri(3,4):p.age<=28?ri(2,3):1;
  const season=simSeason();
  save();render();
  showSeasonRecap(season,ev);
}

function fifaCard(m,teamName,teamFlag){
  const cls=m.missed?'miss':m.res==='W'?'w':m.res==='L'?'l':'d';
  const homeFlag=teamFlag?flagUrl(teamFlag):PH;
  const awayFlag=m.oppFlag?flagUrl(m.oppFlag):PH;
  const homeLogo=logoCache[teamName]||PH;
  const awayLogo=logoCache[m.opp]||PH;
  const pgTag=m.pg>0?`<span class="fifa-goal">⚽ ${p.name.split(' ')[1]||p.name} ×${m.pg}</span>`:'';
  return`<div class="fifa-match ${cls}">
    <div class="fifa-comp"><span>${m.comp}</span><span>${m.missed?'🤕 ПРОПУСК':'90\''}</span></div>
    <div class="fifa-row">
      <div class="fifa-team home"><span class="nm">${teamName}</span><img class="fifa-badge" src="${homeLogo}" onerror="this.src='${homeFlag}'"></div>
      <div class="fifa-score">${m.missed?'—':m.tg+' : '+m.og}</div>
      <div class="fifa-team away"><img class="fifa-badge" src="${awayLogo}" onerror="this.src='${awayFlag}'"><span class="nm">${m.opp}</span></div>
    </div>
    ${pgTag?`<div class="fifa-foot">${pgTag}</div>`:''}
  </div>`;
}

    s.clMatches.forEach(m=>html+=fifaCard(m,p.club.name,p.club.flag));

  }

        <div class="gt-row head"><div>#</div><div>Команда</div><div>И</div><div>В</div><div>Н</div><div>О</div></div>

          <div class="gt-name"><img src="${flagUrl(row.flag)}" onerror="this.style.display='none'">${row.name}</div>
          <div style="text-align:center">${row.p}</div>
          <div style="text-align:center">${row.w}</div>
          <div style="text-align:center">${row.d}</div>

      </div>

  </div>`;
  
  html+=`<button class="btn" onclick="showAgent()">📞 ПОЗВОНИТЬ АГЕНТУ →</button>`;

}

============================================================ */
async function showAgent(){
  const numOffers=p.ovr>85?3:2;
  const shuffled=[...CLUBS].filter(c=>c.name!==p.club.name).sort(()=>.5-Math.random());
  const offers=shuffled.slice(0,numOffers);
  const logos=await Promise.all(offers.map(c=>getLogo(c.name)));
  
  let html=`<div class="agent-card fade">
    <div class="agent-head">
      <div class="agent-avatar">👔</div>
      <div class="agent-name">Мистер Родригес<small>Твой агент</small></div>
    </div>
    <div class="agent-msg">
      Слушай, ${p.name.split(' ')[0]}! Тебе ${p.age}, OVR ${p.ovr}. Есть несколько вариантов на следующий сезон:
    </div>`;
  
  offers.forEach((c,i)=>{
    const price=Math.round(p.ovr*ri(2,6)/10);
    const salary=Math.round(p.ovr*ri(3,8)/10);
    const years=ri(2,5);
    html+=`<div class="club-card">
      <img class="club-logo" src="${logos[i]}" onerror="this.src='${PH}'">
      <div class="club-info"><h3>${c.name}</h3><p>${c.country} · Сила ${c.str}</p>
        <div class="contract-row" style="margin-top:4px"><span>💰 Трансфер: <b>€${price}M</b></span><span>📅 Контракт: <b>${years} г.</b></span></div>
      </div>
    </div>
    <button class="btn" onclick="acceptOffer('${c.name}',${price},${salary},${years})">✍️ Подписать с ${c.name}</button>`;
  });
  
  html+=`<button class="btn btn-gray" onclick="stayClub()">🏠 Остаться в ${p.club.name}</button>`;
  html+=`</div>`;
  content.innerHTML=html;content.scrollTop=0;
}

function acceptOffer(name,price,salary,years){
  const c=CLUBS.find(x=>x.name===name);
  if(c){
    p.club=c;
    p.money+=price;
    p.sponsor+=Math.round(salary/2);
    p.trust=cm(p.trust+10);
    p.morale=cm(p.morale+10);
    p.currentContract={club:name,years,salary};
  }
  save();showTraining();
}

function stayClub(){
  p.money+=ri(2,10);p.trust=cm(p.trust+5);p.morale=cm(p.morale+5);
  p.morale=cm(p.morale+5);
  save();showTraining();
}

  content.innerHTML=`

      <div class="legacy">${legacy}</div>
      <div class="muted">${p.name} · ${p.pos} · ${p.ntName} <img src="${flagUrl(p.ntFlag)}" style="width:18px;vertical-align:middle"></div>
    </div>
    <div class="end-stats">
      <div>Возраст<b>${p.age}</b></div>
      <div>OVR<b style="color:var(--yellow)">${p.ovr}</b></div>
      <div>Голы клуб<b>${p.goals}</b></div>
      <div>Голы ЛЧ<b>${p.goalsCL}</b></div>
      <div>Голы сборная<b>${p.goalsNT}</b></div>
      <div>Кэпы<b>${p.caps}</b></div>
      <div>Трофеи клуба<b>${p.tropClub}</b></div>
      <div>Лиги Чемпионов<b>${p.clWins}</b></div>
      <div>ЧМ побед<b>${p.wcWins}</b></div>
      <div>Золотые мячи<b>${p.ballonDors}</b></div>
      <div>💰 Заработано<b>€${p.money}M</b></div>
      <div>Сезонов<b>${p.season}</b></div>
    </div>
    <div class="card">
      <div class="card-title">📜 ИСТОРИЯ КАРЬЕРЫ</div>
      <div class="history-list">${hist||'<div class="muted text-center">Нет данных</div>'}</div>
    </div>
    <button class="btn" onclick="resetGame()">🔄 НОВАЯ КАРЬЕРА</button>
  `;
  content.scrollTop=0;
}

function resetGame(){
  localStorage.removeItem('mfc_pro');
  location.reload();
}

/* ============================================================
   ЗАПУСК
============================================================ */
if(load()&&p.name){
  $('statusBar').style.display='grid';
  $('statsBar').style.display='grid';
  $('timeline').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos} · ${p.ntName}</small>`;
  render();
  // Прекеш логотипов
  Promise.all(CLUBS.slice(0,10).map(c=>getLogo(c.name)));
  if(p.age>42)showEnd();
  else showTraining();
}else{
  showStart();
}
</script>
</body>
</html>
