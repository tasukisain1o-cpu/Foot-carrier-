<style>

[data-theme="light"]{--bg:#e8e8e8;--app:#f5f5f5;--card:#fff;--card2:#f0f0f0;--text:#1a1a1a;--muted:#666;--border:#ddd;--nav-bg:rgba(255,255,255,.95);--nav-active:#e0e0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
#app{width:100%;max-width:420px;height:96vh;max-height:860px;background:var(--app);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card2);padding:6px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase}
.status>div b{display:block;color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.48em;font-weight:700;color:rgba(255,255,255,.7)}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;background:var(--nav-bg);backdrop-filter:blur(20px);border-radius:28px;padding:8px 6px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06);z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.55em;font-weight:600;cursor:pointer;transition:all .25s;padding:6px 10px;border-radius:20px;min-width:56px}
.nav-item.active{background:var(--nav-active);color:var(--blue)}
.nav-icon{font-size:1.6em;margin-bottom:2px;line-height:1}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.btn-gold{background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000;font-weight:800}
.menu-btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:.9em;cursor:pointer;margin-bottom:8px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;animation:slideUp .5s ease}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu-btn .mb-icon{font-size:2em}.menu-btn .mb-info{flex:1}
.menu-btn .mb-title{font-size:1em;font-weight:800;margin-bottom:3px}
.menu-btn .mb-desc{font-size:.65em;opacity:.85;font-weight:500}
.mb-p1{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.mb-p2{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff}
.mb-p3{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff}
.mb-p4{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}
.mb-p5{background:linear-gradient(135deg,#ffeb3b,#fbc02d);color:#000}
.mb-p6{background:linear-gradient(135deg,#f44336,#b71c1c);color:#fff}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.summary-bar{display:flex;justify-content:space-around;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:10px;font-size:.62em}

.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:var(--card2);border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}

.text-center{text-align:center}.mb-8{margin-bottom:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:flex-end;padding:0}
.modal.show{display:flex;animation:fade .3s ease}

.modal-box{background:var(--card);border-radius:20px 20px 0 0;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 16px 24px;border:1px solid var(--border);animation:slideUpSheet .3s ease}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box::before{content:'';display:block;width:40px;height:4px;background:#555;border-radius:2px;margin:0 auto 12px}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}

.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}

.story-card .desc{font-size:.72em;color:var(--muted);line-height:1.4}
.manager-card{background:linear-gradient(135deg,#1a1a2a,#0f0f1a);border:2px solid #333;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}

.manager-card.owned{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}

.manager-card .mc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.manager-card .mc-info{flex:1}
.manager-card .mc-name{font-weight:800;font-size:.85em}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bounce{animation:bounce .6s ease infinite}
.chart-bar{display:flex;align-items:flex-end;gap:2px;height:80px;padding:6px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.chart-col{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px}
.obj-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border-left:3px solid var(--orange);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.72em}
.obj-card.done{background:linear-gradient(135deg,#0a2a0a,#051a05);border-left-color:var(--green)}
.obj-card .ttl{font-weight:800;margin-bottom:2px}
.obj-card .prog{color:var(--muted);font-size:.85em}
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}
.theme-btn{flex:1;padding:8px;border:2px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;font-size:.7em;font-weight:700;cursor:pointer;font-family:inherit}
.theme-btn.active{border-color:var(--green);background:var(--green);color:#fff}
.progress-bar{background:var(--card2);border-radius:10px;height:6px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:10px;transition:width .6s ease}
.progress-fill.green{background:linear-gradient(90deg,#4caf50,#8bc34a)}

.accordion{background:var(--card);border-radius:14px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden}
.accordion-head{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.8em}
.accordion-arrow{transition:transform .3s;color:var(--muted)}
.accordion.open .accordion-arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .4s,padding .3s;padding:0 12px}
.accordion.open .accordion-body{max-height:3000px;padding:0 12px 12px}
.quick-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding:4px;background:var(--card2);border-radius:10px}

.search-input{width:100%;padding:10px 12px 10px 36px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.8em;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--green)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.fab{position:fixed;bottom:100px;right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;border:none;font-size:1.5em;cursor:pointer;box-shadow:0 6px 20px rgba(76,175,80,.6);z-index:45;display:flex;align-items:center;justify-content:center}

</style>

function goalProb(){
  const base=Math.min(.75,p.ovr/180);
  const formMult=1+p.form*.10;
  const pm=POSITION_MULT[p.pos]||{goals:0.5};
  const injuryMult=p.injury?.4:1;
  const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:p.ovr<88?0.9:1;
  return Math.min(.6,base*formMult*pm.goals*injuryMult*ovrPenalty);
}
function assistProb(){
  const base=Math.min(.6,p.ovr/200);
  const pm=POSITION_MULT[p.pos]||{assists:0.5};
  const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:1;
  return Math.min(.65,base*pm.assists*ovrPenalty*(1+p.form*.08));
}
function cardProb(){let b=.04;if(p.pos==='CB'||p.pos==='CDM')b=.09;if(p.def>85)b+=.02;return b}
function tryInjury(){if(p.injuryShield)return null;if(Math.random()>.05)return null;const stat=pick(['pac','sho','dri','phy']);return{name:'Травма',matchesLeft:ri(1,5),stat,penalty:ri(1,5),perm:false}}
function applyInjury(inj){p[inj.stat]=cl(p[inj.stat]-inj.penalty);p.injury={...inj};p.morale=cm(p.morale-15);p.ovr=calcOvr()}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}

function simMatch(opp,comp){
  const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false,comment:'',derby:false};
  if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}
  const derby=DERBIES.find(d=>(d.home===p.club.name&&d.away===opp.name)||(d.away===p.club.name&&d.home===opp.name));
  r.derby=!!derby;const bonus=derby?0.15:0;
  const baseT=Math.max(0,Math.round((p.club.str-opp.str)/22+1.4+ri(-1,1)));
  let prob=goalProb()+weatherBonus()*0.01+bonus;if(p._benched)prob*=0.5;
  let pg=0;
  const secondGoal=prob*0.25,hatTrick=prob*0.04;
  if(Math.random()<prob)pg++;
  if(Math.random()<secondGoal)pg++;
  if(Math.random()<hatTrick)pg++;
  if(pg>0&&Math.random()<0.18){pg=0;r.comment='📺 VAR отменил гол!';r.varCancelled=true}
  else if(pg>0)r.comment=pick(['⚽ ГОЛ!','⚡ Что за удар!','🎯 В девятку!','💥 С 25 метров!','🔥 Стадион взорвался!']);
  else if(Math.random()<0.3)r.comment=pick(['😢 В штангу!','❌ Мимо!','😤 Выше ворот!']);
  const ap=assistProb();let a=0;if(Math.random()<ap)a++;
  const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-p.club.str)/22+1.4+ri(-1,1)));
  r.tg=tg;r.og=og;r.pg=pg;r.assist=a;
  if(Math.random()<cardProb())r.yellow=1;
  if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}
  if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);
  if(pg>=3)p._hatTricks=(p._hatTricks||0)+1;
  return r;
}
function recordMatch(comp,res){
  if(!p.career[comp])p.career[comp]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;
  p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;
  if(p.objectives){p.objectives.forEach(o=>{if(o.id==='goals')o.current+=res.pg;else if(o.id==='assists')o.current+=res.assist;else if(o.id==='matches')o.current++})}
  if(comp==='league'&&res.pg>0){p._leaguesPlayed=p._leaguesPlayed||[];const k=getPlayerLeague(p.club.name);if(!p._leaguesPlayed.includes(k))p._leaguesPlayed.push(k)}
}
function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}return m}
function simCup(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key]||[];const pool=clubs.filter(c=>c.name!==p.club.name);for(let i=0;i<5;i++){const o=pick(pool.length?pool:clubs);const r=simMatch(o,['1/16','1/8','1/4','1/2','Финал'][i]);m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<4)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===5)p.trophies.push({name:'Кубок',season:p.season});return m}
function simCL(){const m=[];const top=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=85&&c.name!==p.club.name);for(let i=0;i<3;i++){const r=simMatch(pick(top),'ЛЧ Группа');m.push(r);recordMatch('cl',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2){for(const st of['1/8','1/4','1/2','Финал']){const r=simMatch(pick(top),'ЛЧ '+st);m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'ЛЧ',season:p.season});p.clWins=(p.clWins||0)+1;p.morale=cm(p.morale+20)}}}return m}
function simNewTournaments(){
  const res={newTrophies:[]};const y=getYear();
  const isAfrican=AFRICAN_NTS.some(n=>n.name===p.ntName);
  const isAsian=ASIAN_NTS.some(n=>n.name===p.ntName);
  const isConcacaf=CONCACAF_NTS.some(n=>n.name===p.ntName);

  if(isAsian&&p.ovr>=76&&y%4===0&&y>=2027){const matches=simTournament('Кубок Азии','copa_asia');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Кубок Азии',season:p.season});res.newTrophies.push('Кубок Азии')}}
  if(isConcacaf&&p.ovr>=76&&y%2===1&&y>=2025){const matches=simTournament('Золотой Кубок','gold_cup');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Золотой Кубок',season:p.season});res.newTrophies.push('Золотой Кубок')}}
  if(p.ntRegion==='eu'&&p.ovr>=76&&y%2===1&&y>=2024){const matches=simTournament('Лига наций','nations_league');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Лига наций УЕФА',season:p.season});res.newTrophies.push('Лига наций УЕФА')}}
  return res;

function simTournament(name,key){
  const m=[];const pool=NTS.filter(n=>n.name!==p.ntName);
  for(let i=0;i<3;i++){const o=pick(pool);const r=simMatch(o,name+' Группа');m.push(r);recordMatch(key,r)}
  const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;
  if(wins>=1){for(const st of['1/8','1/4','1/2','Финал']){const o=pick(pool);const r=simMatch(o,name+' '+st);m.push(r);recordMatch(key,r);if(r.missed)continue;if(r.tg<r.og)break}}
  return m;
}
function simSeason(){
  const res={league:[],cup:[],cl:[]};
  res.league=simLeague();res.cup=simCup();
  if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();
  const newRes=simNewTournaments();
  if(newRes.newTrophies.length)p._newTrophies=newRes.newTrophies;
  const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;
  const winRate=lw/res.league.length;
  const topClubs=Object.values(LEAGUE_CLUBS).flat().sort((a,b)=>b.str-a.str).slice(0,5);
  const isTopClub=topClubs.some(c=>c.name===p.club.name);
  if(winRate>=0.75&&isTopClub&&Math.random()<0.5){p.trophies.push({name:'Чемпионат',season:p.season})}
  return res;
}
function getRivalStriker(){
  if(!p._rivalStriker||p.season%3===0){p._rivalStriker=pick(RIVAL_STRIKERS)}

function checkSeasonAwards(stats){
  const rival=getRivalStriker();
  if(stats.goals<rival.goals)stats.goals=Math.min(stats.goals,rival.goals-1);
  const na=[];
  AWARD_DEFS.forEach(a=>{
    if(a.cat==='career'&&(p.awards||[]).some(x=>x.id===a.id))return;
    if(a.check(stats)){
      const aw={id:a.id,n:a.n,icon:a.icon,cat:a.cat,season:p.season,year:getYear()};
      p.awards=p.awards||[];p.awards.push(aw);na.push(aw);

}

    if(c.id==='c1')done=p.trophies.some(t=>t.name==='ЛЧ');
    else if(c.id==='c2')done=p.history.some(h=>h.goals>=50);
    else if(c.id==='c3'){const g={};p.history.forEach(h=>g[h.club]=(g[h.club]||0)+1);done=Object.values(g).filter(v=>v>=5).length>=5}

    else if(c.id==='c5')done=p.manager?.tier===5;
    else if(c.id==='c7')done=p.history.some(h=>h.goals>=30);
    else if(c.id==='c9')done=(p._leaguesPlayed||[]).length>=5;
    else if(c.id==='c10')done=p.careerTotal.goals>=850;
    if(done){p.challenges.push(c.id);p.money+=10;showToast(`🎯 ${c.n}! +€10M`,'warn')}

function generateTransferPlayer(baseStr=75,minOvr=null,maxOvr=null){
  const nation=pick(TRANSFER_NATIONS);
  const firstName=pick(TRANSFER_FIRST_NAMES[nation.code]||TRANSFER_FIRST_NAMES.en);
  const lastName=pick(TRANSFER_LAST_NAMES[nation.code]||TRANSFER_LAST_NAMES.en);
  const pos=pick(POSITIONS_LIST);
  const age=ri(17,35);
  let ovr;
  if(minOvr!==null&&maxOvr!==null)ovr=ri(minOvr,maxOvr);
  else{let mod=0;if(age<20)mod=-10;else if(age<24)mod=-3;else if(age<28)mod=5;else if(age<32)mod=0;else mod=-8;ovr=cl(baseStr+mod+ri(-8,10))}
  let value=Math.round(Math.pow(ovr/10,3.5)*0.3);
  if(age<23)value=Math.round(value*1.5);else if(age>30)value=Math.round(value*0.6);
  const wage=Math.max(1,Math.round(ovr/8));
  return{id:Date.now()+Math.random(),name:firstName+' '+lastName,pos,age,ovr,value,wage,flag:nation.flag,nation:nation.name,injured:0,young:age<23};
}

  const mb=(p.manager?.tier||1)*2;

      <button class="btn" onclick="acceptTransferPre('${c.name}',${price})">✍️ Подписать</button>`;

function showDraftLegends(){
  content.innerHTML=`<div class="tab-title">⚔️ ДРАФТ ЛЕГЕНД</div>
  <div class="card"><div class="card-title">📜 ПРАВИЛА</div><div class="muted" style="font-size:.75em;line-height:1.5">По очереди выбираете легенд. У каждого 11 пиков. Победит тот, у кого сумма OVR выше!</div></div>
  <button class="btn btn-gold" onclick="startDraft()" style="padding:14px">🚀 НАЧАТЬ ДРАФТ</button>
  <button class="btn btn-gray" onclick="showMainMenu()">← Назад</button>`;
}
function startDraft(){
  let myTeam=[],aiTeam=[],pool=[...DRAFT_LEGENDS].sort(()=>Math.random()-.5);
  function draftTurn(){
    if(myTeam.length>=11||pool.length===0){finishDraft(myTeam,aiTeam);return}
    let html=`<div class="tab-title">⚔️ ДРАФТ (${myTeam.length}/11)</div>
    <div class="card"><div class="card-title">ТВОЯ КОМАНДА</div><div style="font-size:.7em">${myTeam.map(l=>`${l.country} ${l.n}`).join(', ')||'Пусто'}</div></div>
    <div class="card-title">📋 ВЫБЕРИ ЛЕГЕНДУ</div>`;
    pool.slice(0,4).forEach((l,i)=>{html+=`<div class="story-card" onclick="pickLegend(${DRAFT_LEGENDS.indexOf(l)})"><div class="ttl">${l.country} ${l.n}</div><div class="desc">${l.pos} · OVR ${l.ovr}</div></div>`});
    content.innerHTML=html;
  }
  window.pickLegend=(idx)=>{const l=DRAFT_LEGENDS[idx];if(!l)return;myTeam.push(l);const poolIdx=pool.indexOf(l);if(poolIdx>=0)pool.splice(poolIdx,1);if(pool.length){const aiPick=pool.splice(ri(0,pool.length-1),1)[0];aiTeam.push(aiPick)}haptic(20);draftTurn()};
  window.finishDraft=(my,ai)=>{
    const mySum=my.reduce((s,l)=>s+l.ovr,0);const aiSum=ai.reduce((s,l)=>s+l.ovr,0);const win=mySum>aiSum;
    content.innerHTML=`<div class="tab-title">🏆 РЕЗУЛЬТАТ</div>
    <div class="card" style="text-align:center;background:linear-gradient(135deg,${win?'#2e7d32,#4caf50':'#c62828,#f44336'},#0a0a0a)">
      <div style="font-size:3em">${win?'🏆':'😢'}</div>
      <div style="font-size:1.5em;font-weight:900;color:#fff;margin-top:8px">${win?'ПОБЕДА!':'ПОРАЖЕНИЕ'}</div>
      <div style="font-size:.85em;color:#fff;margin-top:8px">Ты: ${mySum} · ИИ: ${aiSum}</div>
    </div>
    <button class="btn btn-gray" onclick="showMainMenu()">← В меню</button>`;
    if(win)playGoalSound();haptic(50);
  };
  draftTurn();
}

function filterManagerTier(t){window._mgrFilter.tier=t;document.querySelectorAll('#mgrTabs .quick-tab').forEach(b=>b.classList.toggle('active',b.dataset.tier==String(t)));renderManagers()}
function renderManagers(){
  const f=window._mgrFilter||{tier:'all',search:''};
  f.search=($('mgrSearch')?.value||'').toLowerCase();
  let list=MANAGERS;
  if(f.tier!=='all')list=list.filter(m=>String(m.tier)===String(f.tier));
  if(f.search)list=list.filter(m=>m.n.toLowerCase().includes(f.search));
  const current=p.manager?.id||0;const listDiv=$('mgrList');if(!listDiv)return;
  listDiv.innerHTML=list.map(m=>{
    const owned=current===m.id;const canAfford=p.money>=m.cost;const clazz=owned?'owned':(canAfford?'':'locked');
    return `<div class="manager-card ${clazz}" onclick="${!owned&&canAfford?`hireManager(${m.id})`:''}">
      <div class="mc-head"><div class="mc-avatar">${m.avatar}</div><div class="mc-info"><div class="mc-name">${m.n} ${owned?'✅':''}</div><div class="mc-tier">${m.desc}</div></div></div>
      <div class="mc-stats"><div>Опыт<b>${m.exp}</b></div><div>Комис<b>${m.com}%</b></div><div>Цена<b style="color:${canAfford?'#4caf50':'#f44336'}">€${fmt(m.cost)}M</b></div></div></div>`;
  }).join('');
}

function renderMarketList(players){

function filterMarket(type){
  const cd=p.coachData;if(!cd.market)return;
  let filtered=cd.market;
  if(type==='GK')filtered=cd.market.filter(p=>p.pos==='GK');
  else if(type==='DEF')filtered=cd.market.filter(p=>['CB','LB','RB'].includes(p.pos));
  else if(type==='MID')filtered=cd.market.filter(p=>['CDM','CM','CAM'].includes(p.pos));
  else if(type==='ATT')filtered=cd.market.filter(p=>['LW','RW','ST','CF','SS'].includes(p.pos));
  else if(type==='young')filtered=cd.market.filter(p=>p.age<=23);
  else if(type==='star')filtered=cd.market.filter(p=>p.ovr>=85);
  document.querySelectorAll('.quick-tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderMarketList(filtered);
}
function buyCoachPlayer(id){
  const cd=p.coachData;

  if(!pl||cd.budget<pl.value){showToast('⚠️ Мало бюджета','error');return}
  cd.budget-=pl.value;
  cd.squad.push({...pl,id:Date.now()+Math.random()});
  cd.market=cd.market.filter(x=>x.id!==id);
  addDiary(`💰 Купил ${pl.name} (${pl.ovr}) за €${pl.value}M`);

function genCoachSquad(clubStr){
  const squad=[];
  const positions=['GK','GK','CB','CB','CB','CB','LB','LB','RB','RB','CDM','CDM','CM','CM','CM','CAM','LW','RW','ST','ST'];
  positions.forEach((pos,i)=>{
    const base=clubStr+ri(-15,5);
    squad.push({
      id:i,
      name:randomName('es').split(' ')[1]+' '+ri(1,99),
      pos,
      age:ri(18,35),
      ovr:cl(base+ri(-8,8)),
      value:ri(1,80),
      wage:ri(1,15),
      injured:0,
      young:Math.random()<0.2
    });
  });
  return squad;
}
function genCoachTasks(){
  const pool=[
    {id:'top3',t:'Финишировать в топ-3',check:(r)=>r.position<=3},
    {id:'top8',t:'Финишировать в топ-8',check:(r)=>r.position<=8},
    {id:'wins15',t:'Выиграть 15+ матчей',check:(r)=>r.wins>=15},
    {id:'cup',t:'Дойти до 1/4 Кубка',check:(r)=>r.cupStage>=2},
    {id:'goals60',t:'Забить 60+ голов',check:(r)=>r.gf>=60}
  ].sort(()=>Math.random()-.5);
  return pool.slice(0,3).map(t=>({...t,done:false}));
}

  if(type==='coach')p.name='Bog Coach '+randomName('ru');
  $('statusBar').style.display='grid';
  $('statsBar').style.display='grid';
  $('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`👑 ${p.name}<small>РЕЖИМ БОГА</small>`;
  save();render();switchTab('home');

}

/* ============ RENDER ============ */
function render(){
  if(!p.name)return;
  $('sAge').textContent=(p.age||0)+'('+getYear()+')';
  $('sOvr').textContent=p.ovr||0;
  $('sMorale').textContent=p.morale||0;
  const f=$('sForm');f.textContent=formEmoji(p.form||0);f.className=formCls(p.form||0);
  const inj=$('sInjury');
  if(p.injury){inj.textContent=`${p.injury.name} ${p.injury.matchesLeft}м`;inj.className='injury-active'}
  else{inj.textContent='—';inj.className=''}
  $('stPac').textContent=p.pac||0;
  $('stSho').textContent=p.sho||0;
  $('stPas').textContent=p.pas||0;
  $('stDri').textContent=p.dri||0;
  $('stDef').textContent=p.def||0;
  $('stPhy').textContent=p.phy||0;
  $('stTrust').textContent=p.trust||0;
  $('tClub').textContent='🏆 '+(p.trophies||[]).length;
  $('tCL').textContent='⭐ '+(p.trophies||[]).filter(t=>t.name==='ЛЧ').length;
  $('tNT').textContent='🌍 '+(p.trophies||[]).filter(t=>['ЧМ','Евро','Копа'].includes(t.name)).length;
}

/* ============ НАВИГАЦИЯ ============ */
function switchTab(tab){
  currentTab=tab;hideFAB();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  if(tab==='home')showHomeTab();
  else if(tab==='stats')showStatsTab();
  else if(tab==='world')showWorldTab();
  else if(tab==='shop')showShopTab();
  else if(tab==='settings')showSettingsTab();
  content.scrollTop=0;haptic(8);
}

/* ============ КЛИК ПО КНОПКЕ СЕЗОНА ============ */
function nextSeason(){
  if(p.god){godSkipSeason();return}
  const _st=['pac','sho','pas','dri','def','phy'];
  if(_st.every(s=>p[s]>=99)&&p.tp>0){
    const bonus=p.tp*200000;
    p.money+=bonus;
    showToast(`💰 Автосброс: ${p.tp} очков → €${fmt(bonus)}`,'success');
    p.tp=0;
  }
  p.season++;p.age++;
  if(Math.random()<.006){
    const crit=pick(CRITICAL);
    p.finished=true;p.endType=crit.type;p.endCause=crit.cause;
    save();showCriticalEvent(crit);return;
  }
  const ev=pick(EVENTS);
  p._pendingEvent=ev;
  showEventPreviewForNewSeason(ev);
}

function godSkipSeason(){
  for(let i=0;i<10;i++){
    p.season++;p.age++;p.money+=50000000;
    p.trophies.push({name:'Чемпионат',season:p.season});
    p.trophies.push({name:'ЛЧ',season:p.season});
    p.ballonDors++;
  }
  save();showToast('⏩ 10 сезонов','warn');showHomeTab();
}

/* ============ СИМУЛЯЦИЯ СЕЗОНА ============ */
function runSeasonSimulation(){
  // Рост статов
  let gm=1;
  if(p.age<=18)gm=2.0;
  else if(p.age<=20)gm=1.6;
  else if(p.age<=24)gm=1.2;
  else if(p.age<=28)gm=0.7;
  else gm=0.3;
  p.pac=cl(p.pac+Math.round(ri(0,4)*gm));
  p.sho=cl(p.sho+Math.round(ri(0,5)*gm));
  p.pas=cl(p.pas+Math.round(ri(0,4)*gm));
  p.dri=cl(p.dri+Math.round(ri(0,4)*gm));
  p.def=cl(p.def+Math.round(ri(-1,3)*gm));
  p.phy=cl(p.phy+Math.round(ri(0,3)*gm));
  p.ovr=calcOvr();p.form*=.6;
  const tpBase=p.age<=20?ri(8,20):p.age<=24?ri(6,15):p.age<=28?ri(4,10):ri(2,6);
  p.tp=tpBase;
  p.money+=p.salary+p.sponsorValue+(p.passive||0);
  p.salary=calcSalary(p.ovr,p.club.tier||1);
  p.injuryShield=false;p.weather=getWeather();
  // Семья, соцсети
  updateFamilyYearly();
  const socialIncome=updateSocialMedia();
  if(socialIncome>0)addDiary(`📱 Доход от соцсетей: €${socialIncome}M`);
  // Симуляция матчей
  const before=JSON.parse(JSON.stringify(p.career));
  const season=simSeason();
  const sStats={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  COMPS.forEach(c=>{
    if(!before[c])before[c]={matches:0,goals:0,assists:0};
    sStats.matches+=p.career[c].matches-before[c].matches;
    sStats.goals+=p.career[c].goals-before[c].goals;
    sStats.assists+=p.career[c].assists-before[c].assists;
  });
  checkObjectives();
  // Награды за цели
  let objReward=0,objDone=0;
  (p.objectives||[]).forEach(o=>{
    if(o.done){objDone++;objReward+=(o.reward||2)}
  });
  if(objReward>0){
    p.money+=objReward;
    setTimeout(()=>showToast(`🎯 Цели: ${objDone}/${(p.objectives||[]).length} · +€${objReward}M`,'success'),600);
  }
  // Новые цели
  const newObjectives=genObjectives();
  // Проверка событий года
  const famEv=rollFamilyEvent();
  checkChallenges();
  if(!p.injury)p._noInjurySeason=true;
  else p._noInjurySeason=false;
  // Награды сезона
  const newAwards=checkSeasonAwards({...sStats,...season});
  // История
  p.history.push({age:p.age,year:getYear(),club:p.club.name,salary:p.salary,...sStats});
  p.seasonCards=p.seasonCards||[];
  p.seasonCards.push({year:getYear()-1,ovr:p.ovr,club:p.club.name,goals:sStats.goals,assists:sStats.assists,matches:sStats.matches});
  ACHIEVEMENTS.forEach(a=>{
    if(!(p.achievements||[]).includes(a.id)&&a.check()){
      p.achievements=p.achievements||[];
      p.achievements.push(a.id);
    }
  });
  addDiary(`Сезон ${getYear()-1}/${getYear()}. ${p.club.name}. ${sStats.goals} голов.`);
  if(Math.random()<.5)genTweet();
  p.lastSeasonStats=sStats;
  p.objectives=newObjectives;
  // Голосовые
  if(sStats.goals>=3)setTimeout(()=>speak(`Гол! ${p.name}`),800);
  const ev=p._pendingEvent||{text:'Сезон прошёл без событий'};
  p._pendingEvent=null;
  save();render();
  // Новые трофеи
  if(p._newTrophies&&p._newTrophies.length){
    setTimeout(()=>{
      openModal(`<div class="modal-title">🏆 НОВЫЕ ТРОФЕИ!</div>
      ${p._newTrophies.map(t=>`<div style="text-align:center;padding:10px;font-weight:800;color:var(--yellow);font-size:1em">🏆 ${t}</div>`).join('')}
      <button class="modal-close" onclick="closeModal()">Забрать</button>`);
      p._newTrophies=null;
    },800);
  }
  if(famEv)setTimeout(()=>showToast(famEv.t,'success'),1200);
  showSeasonRecap(season,ev,sStats,newAwards);
}

/* ============ СЕЗОН ТРЕНЕРА ============ */
function coachNextSeason(){
  const cd=p.coachData;cd.seasons++;p.age++;
  const tactic=TACTICS[cd.tactic]||TACTICS['4-2-3-1'];
  const squadStr=cd.squad.reduce((s,x)=>s+x.ovr,0)/cd.squad.length;
  const staffBonus=Object.keys(cd.staff).length*1.5;
  const teamStr=squadStr+tactic.atk*12+tactic.def*8+staffBonus+cd.reputation*0.10+cd.budget*0.03;
  const leagueKey=getPlayerLeague(cd.club.name);
  const leagueTier=LEAGUES[leagueKey]?.tier||2;
  const baseDifficulty=leagueTier===5?88:leagueTier===4?80:leagueTier===3?74:68;
  const numMatches=(leagueKey==='eng_prem'||leagueKey==='esp_laliga'||leagueKey==='ita_seriea')?38:34;
  let w=0,d=0,l=0,gf=0,ga=0;
  for(let i=0;i<numMatches;i++){
    const oppStr=baseDifficulty+ri(-12,12);
    const myStrength=teamStr+ri(-8,8);
    const myGoals=Math.max(0,Math.round((myStrength-oppStr)/12+1.2+ri(-1,1)));
    const oppGoals=Math.max(0,Math.round((oppStr-myStrength)/12+1.2+ri(-1,1)));
    gf+=myGoals;ga+=oppGoals;
    if(myGoals>oppGoals)w++;
    else if(myGoals<oppGoals)l++;
    else d++;
  }
  const pts=w*3+d;
  cd.matches+=numMatches;cd.wins+=w;cd.draws+=d;cd.losses+=l;cd.gf+=gf;cd.ga+=ga;
  const winRate=w/numMatches;
  let position;
  if(winRate>=0.75)position=ri(1,2);
  else if(winRate>=0.6)position=ri(2,5);
  else if(winRate>=0.45)position=ri(5,10);
  else if(winRate>=0.3)position=ri(10,15);
  else position=ri(15,20);
  cd.position=position;
  if(position===1&&winRate>=0.72){
    cd.trophies.push({name:'Чемпионат',season:cd.seasons});
    p.money+=ri(15,40);
  }
  if(Math.random()<0.15&&position<=8){
    cd.trophies.push({name:'Кубок',season:cd.seasons});
    p.money+=ri(5,15);
  }
  const delta=Math.round((winRate-0.45)*40);
  cd.reputation=cm(cd.reputation+delta);
  cd.boardRating=cm(cd.boardRating+Math.round(delta*0.8));
  cd.fanRating=cm(cd.fanRating+Math.round(delta*0.6));
  cd.budget+=Math.round((winRate-0.4)*30);
  if(winRate>=0.7&&Math.random()<0.3){
    cd.awards=cd.awards||[];
    cd.awards.push({id:'best_league',n:'🥇 Тренер года',season:cd.seasons});
  }
  if(position===1&&Math.random()<0.15){
    cd.awards=cd.awards||[];
    cd.awards.push({id:'best_world',n:'👑 Лучший тренер мира',season:cd.seasons});
  }
  p.money+=ri(1,5);
  cd.squad.forEach(s=>{
    if(s.injured>0)s.injured--;
    if(s.age<24)s.ovr=cl(s.ovr+ri(0,1));
    else if(s.age>30)s.ovr=cl(s.ovr-ri(0,1));
    s.age++;
  });
  if(cd.boardRating<20||(position>=17&&Math.random()>0.6)){
    save();showCoachFired();return;
  }
  cd.history=cd.history||[];
  cd.history.push({season:cd.seasons,club:cd.club.name,wins:w,draws:d,losses:l,gf,ga,pts,position,tactic:cd.tactic});
  save();render();showCoachSeasonRecap({wins:w,draws:d,losses:l,gf,ga,position});
}
function showCoachSeasonRecap(r){
  const cd=p.coachData;
  let html=`<div class="card" style="background:linear-gradient(135deg,#2a1a4a,#4a1a6a);text-align:center;color:#fff">
    <div style="font-size:.7em;opacity:.8">СЕЗОН ${cd.seasons}</div>
    <div style="font-size:1.6em;font-weight:900;color:var(--yellow)">${r.position} МЕСТО</div>
    <div style="font-size:.75em;margin-top:4px">${r.wins}П ${r.draws}Н ${r.losses}П · ${r.gf}-${r.ga}</div></div>
  <div class="card"><div class="card-title">📊 СТАТИСТИКА</div>
    <div class="summary-bar">
      <div>Победы<b>${r.wins}</b></div>
      <div>Ничьи<b>${r.draws}</b></div>
      <div>Поражения<b>${r.losses}</b></div>
      <div>Очки<b>${r.wins*3+r.draws}</b></div>
    </div>
  </div>`;
  const trophies=cd.trophies.filter(t=>t.season===cd.seasons);
  if(trophies.length){
    html+=`<div class="card" style="border:2px solid gold;background:linear-gradient(135deg,#2a2a0a,#1a1a05)">
      <div class="card-title" style="color:var(--yellow)">🏆 ТРОФЕИ</div>
      ${trophies.map(x=>`<div style="text-align:center;font-weight:800;color:var(--yellow);padding:6px">🏆 ${x.name}</div>`).join('')}
    </div>`;
  }
  const awards=cd.awards.filter(a=>a.season===cd.seasons);
  if(awards.length){
    html+=`<div class="card" style="border:2px solid #ff9800">
      <div class="card-title" style="color:var(--orange)">🥇 НАГРАДЫ</div>
      ${awards.map(a=>`<div style="text-align:center;font-weight:800;padding:4px">${a.n}</div>`).join('')}
    </div>`;
  }
  html+=`<button class="btn" onclick="switchTab('home')">ПРОДОЛЖИТЬ →</button>`;
  content.innerHTML=html;content.scrollTop=0;
}

/* ============ СТАРТ ТРЕНЕРСКОГО РЕЖИМА (из игрока) ============ */
function startCoachMode(){
  p.coachMode=true;p.wasCoach=true;
  p.coachData={
    club:p.club,seasons:0,matches:0,wins:0,draws:0,losses:0,gf:0,ga:0,
    trophies:[],reputation:60,budget:0,tactic:'4-2-3-1',
    squad:genCoachSquad(p.club.str||70),staff:{},tasks:genCoachTasks(),
    history:[],awards:[],position:10,boardRating:60,fanRating:60,
    uclStage:0,cupStage:0,uclWin:false
  };
  save();showCoachScreen();
}

/* ============ ФИНАЛЬНЫЙ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.awards)p.awards=[];
  if(!p.diary)p.diary=[];
  if(!p.twitter)p.twitter=[];
  if(!p.objectives)p.objectives=genObjectives();
  if(!p.manager)p.manager=MANAGERS[0];
  if(!p._leaguesPlayed)p._leaguesPlayed=[];
  if(!p._clClubs)p._clClubs=[];
  if(p._hatTricks===undefined)p._hatTricks=0;
  if(p._derbyGoals===undefined)p._derbyGoals=0;
  if(!p.socialMedia)p.socialMedia={instagram:0,tiktok:0,twitter:0,youtube:0};
  if(!p.adBrands)p.adBrands=[];
  if(!p.family||Array.isArray(p.family))p.family={status:'single',partner:null,children:[],history:[],weddingYear:null};
  if(!p.media)p.media=[];
  if(!p.challenges)p.challenges=[];
  if(p.soundOn===undefined)p.soundOn=true;
  if(p.voiceOn===undefined)p.voiceOn=false;
  if(p.hapticOn===undefined)p.hapticOn=true;
  if(p.isCaptain===undefined)p.isCaptain=false;
  if(p._benched===undefined)p._benched=false;
  if(p.coachData){
    if(!p.coachData.squad)p.coachData.squad=genCoachSquad(p.coachData.club?.str||70);
    if(!p.coachData.tactic)p.coachData.tactic='4-2-3-1';
    if(!p.coachData.tasks)p.coachData.tasks=genCoachTasks();
    if(!p.coachData.staff)p.coachData.staff={};
    if(!p.coachData.awards)p.coachData.awards=[];
    if(p.coachData.boardRating===undefined)p.coachData.boardRating=60;
    if(p.coachData.fanRating===undefined)p.coachData.fanRating=60;
    if(p.coachData.budget===undefined)p.coachData.budget=0;
  }
  document.documentElement.setAttribute('data-theme',p.theme==='light'?'light':'');
  $('statusBar').style.display='grid';
  $('statsBar').style.display='grid';
  $('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos||'—'} · ${p.ntName||'—'}</small>`;
  render();switchTab('home');
}else{
  showMainMenu();
}
