<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: STORY</title>
<style>
:root{--bg:#0a0a0a;--app:#121212;--card:#1c1c1c;--card2:#242424;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2a2a2a;--nav-bg:rgba(30,30,42,0.95);--nav-active:#2a2a3a}
[data-theme="light"]{--bg:#e8e8e8;--app:#f5f5f5;--card:#ffffff;--card2:#f0f0f0;--text:#1a1a1a;--muted:#666;--border:#ddd;--nav-bg:rgba(255,255,255,0.95);--nav-active:#e0e0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden;transition:background .3s,color .3s}
#app{width:100%;max-width:420px;height:96vh;max-height:860px;background:var(--app);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative;transition:background .3s}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card2);padding:6px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase}
.status>div b{display:block;color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.48em;font-weight:700;color:rgba(255,255,255,.7)}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:8px 6px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.06);z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.55em;font-weight:600;cursor:pointer;transition:all .25s;padding:6px 10px;border-radius:20px;position:relative;min-width:56px}
.nav-item.active{background:var(--nav-active);color:var(--blue)}
.nav-item.active .nav-icon{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(33,150,243,0.5))}
.nav-icon{font-size:1.6em;margin-bottom:2px;transition:all .25s;line-height:1}
.nav-item:active{transform:scale(.95)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:white;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--green-d)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px;color:var(--text)}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;border-color:#7a7aff;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.summary-bar{display:flex;justify-content:space-around;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:10px;font-size:.62em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:var(--card2);border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}
.detail-row .nm{color:var(--text)}.detail-row .val{font-weight:800;color:var(--yellow)}
.detail-head{font-size:.7em;font-weight:800;color:var(--orange);text-transform:uppercase;margin:8px 0 4px}
.stat-click{background:linear-gradient(135deg,#1a2a3a,#0f1a25);border:1px solid #2a4a6a;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.stat-click .label{font-size:.65em;color:var(--muted);text-transform:uppercase}
.stat-click .value{font-size:1.5em;font-weight:800;color:var(--yellow);margin-top:2px}
.stat-click .hint{font-size:.6em;color:var(--muted);margin-top:2px}
.ach-card{background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid #7a7a2a;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:.7em}
.ach-card .ttl{font-weight:800;color:var(--yellow)}.ach-card .desc{color:var(--muted);font-size:.9em;margin-top:2px}
.ach-card.locked{opacity:.35;filter:grayscale(.7)}
.history-item{background:var(--card2);border-radius:8px;padding:8px;margin-bottom:5px;font-size:.72em;cursor:pointer}
.history-head{display:flex;justify-content:space-between;align-items:center}
.history-details{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.history-item.open .history-details{display:block}
.text-center{text-align:center}.mb-8{margin-bottom:8px}.mt-8{margin-top:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}.hl-g{color:var(--green);font-weight:700}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:14px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;border:1px solid var(--border)}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}
.modal-close{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:.8em;margin-top:10px;font-family:inherit}
.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}
.story-card{background:linear-gradient(135deg,#1a0a2a,#0f051a);border:2px solid #7b1fa2;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.story-card:hover{border-color:var(--yellow);transform:translateY(-2px)}
.story-card.sel{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.story-card .ttl{font-size:.95em;font-weight:800;color:var(--yellow);margin-bottom:4px}
.story-card .desc{font-size:.72em;color:var(--muted);line-height:1.4}
/* MINI-GAME */
.mini-field{background:linear-gradient(180deg,#1a3a1a,#0f250f);border-radius:12px;padding:20px;margin-bottom:10px;position:relative;min-height:220px}
.goal-frame{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:280px;height:130px;border:4px solid #fff;border-bottom:none;border-radius:8px 8px 0 0;background:linear-gradient(180deg,transparent 60%,rgba(255,255,255,0.1))}
.goal-zone{position:absolute;top:0;height:100%;width:25%;cursor:pointer;transition:background .15s}
.goal-zone:hover{background:rgba(76,175,80,0.3)}
.goal-zone.g1{left:0}.goal-zone.g2{left:25%}.goal-zone.g3{left:50%}.goal-zone.g4{left:75%}
.goal-zone.top-half{height:50%;width:33.33%}
.goal-zone.top-half.t1{left:0}.goal-zone.top-half.t2{left:33.33%}.goal-zone.top-half.t3{left:66.66%}
.keeper{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:3em;transition:all .3s}
.ball{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:2em}
.mini-result{margin-top:200px;text-align:center;font-size:1.1em;font-weight:800}
/* TWITTER */
.tweet{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:6px;font-size:.72em;border-left:3px solid var(--blue)}
.tweet .who{font-weight:800;color:var(--blue);font-size:.9em;margin-bottom:3px}
.tweet .body{color:var(--text);line-height:1.4}
.tweet .meta{font-size:.8em;color:var(--muted);margin-top:4px}
/* WEATHER */
.weather-icon{font-size:2em;display:inline-block;vertical-align:middle;margin-right:6px}
/* CHART */
.chart-bar{display:flex;align-items:flex-end;gap:2px;height:80px;padding:6px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.chart-col{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px;transition:all .3s}
.chart-lbl{font-size:.5em;color:var(--muted);text-align:center}
/* OBJECTIVES */
.obj-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border-left:3px solid var(--orange);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.72em}
.obj-card.done{background:linear-gradient(135deg,#0a2a0a,#051a05);border-left-color:var(--green)}
.obj-card.fail{background:linear-gradient(135deg,#2a0a0a,#1a0505);border-left-color:var(--red)}
.obj-card .ttl{font-weight:800;margin-bottom:2px}
.obj-card .prog{color:var(--muted);font-size:.85em}
/* THEME */
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}
.theme-btn{flex:1;padding:8px;border:2px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;font-size:.7em;font-weight:700;cursor:pointer;font-family:inherit}
.theme-btn.active{border-color:var(--green);background:var(--green);color:white}
</style>
</head>

const formEmoji=f=>f>=2.5?'🔥🔥':f>=1.5?'🔥':f>=.5?'😊':f>=-.5?'😐':f>=-1.5?'😕':f>=-2.5?'🥶':'❄️❄️';
const formCls=f=>f>=1.5?'form-hot':f>=.5?'form-good':f>=-.5?'form-ok':f>=-1.5?'form-bad':'form-cold';
function newCareerStats(){const o={};COMPS.forEach(c=>o[c]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0});return o}
function save(){try{localStorage.setItem('mfc_story',JSON.stringify(p))}catch(e){}}
function load(){try{const s=localStorage.getItem('mfc_story');if(s){p=JSON.parse(s);return true}}catch(e){}return false}
function randomName(flag){const pool=NAME_POOL[flag]||NAME_POOL.es;return pick(pool.f)+' '+pick(pool.l)}
function calcSalary(ovr,tier){const tbl=[[50,1500],[55,4000],[60,12000],[65,35000],[70,100000],[75,300000],[80,900000],[85,2500000],[90,6000000],[95,15000000]];let base=1500;for(const[o,s]of tbl)if(ovr>=o)base=s;return Math.round(base*(.7+tier*.15))}
function startStats(age){const base=age<=16?ri(30,65):age<=18?ri(40,72):age<=20?ri(50,78):age<=22?ri(58,84):age<=25?ri(65,88):age<=28?ri(70,90):ri(72,92);const sp=()=>cl(base+ri(-15,15));return{pac:sp(),sho:sp(),pas:sp(),dri:sp(),def:sp(),phy:sp()}}
function relClass(v){return v>=70?'high':v>=40?'mid':'low'}
function getYear(){return 2024+(p.age-p.startAge)}
function getPlayerLeague(clubName){for(const[key,clubs]of Object.entries(LEAGUE_CLUBS)){if(clubs.some(c=>c.name===clubName))return key}return 'eng_prem'}
function showToast(msg,color){const t=document.createElement('div');t.textContent=msg;t.style.cssText=`position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:.8em;font-weight:700;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.6);border-left:3px solid ${color||'#ff9800'};max-width:340px;text-align:center`;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2200)}
const logoCache={};
function svgBadge(name){const l=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#6a1b9a" stroke="#fff" stroke-width="2"/><text x="20" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">${l}</text></svg>`)}`}
async function getLogo(name){if(logoCache[name])return logoCache[name];try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),3000);const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(name)}`,{signal:ctrl.signal});const d=await r.json();if(d.teams&&d.teams.length){logoCache[name]=d.teams[0].strTeamBadge||svgBadge(name);return logoCache[name]}}catch(e){}logoCache[name]=svgBadge(name);return logoCache[name]}

/* ============ WEATHER ============ */
function getWeather(){const w=['☀️ Ясно','☁️ Пасмурно','🌧️ Дождь','❄️ Снег','🌫️ Туман','⛈️ Гроза'];const r=ri(0,5);const bonus=[0,-1,-2,-3,-1,-2][r];return{w:w[r],bonus}}
function weatherBonus(){const w=getWeather();return w.bonus}

/* ============ PLAYER DIARY & TWITTER ============ */
function addDiary(text){p.diary=p.diary||[];p.diary.push({year:getYear(),age:p.age,text})}
function addTweet(who,body){p.twitter=p.twitter||[];p.twitter.unshift({year:getYear(),who,body,likes:ri(100,50000)});if(p.twitter.length>30)p.twitter.pop()}
function genTweet(){const tweets=[
  {w:'Sky Sports',b:`${p.name} — новый талант! OVR уже ${p.ovr}!`},
  {w:'Marca',b:`Слухи: ${p.name} может перейти в топ-клуб за €${ri(30,150)}M`},
  {w:'Fan Zone',b:`${p.name} забил ${ri(1,3)} в последнем матче! 🔥`},
  {w:'L\'Equipe',b:`${p.name} входит в топ-10 игроков года`},
  {w:'Голос фаната',b:`${p.name} — лучший! Купил футболку с его именем`},
  {w:'Transfer News',b:`${p.name} интересен клубам из Саудовской Аравии`},
  {w:'Opta',b:`Статистика ${p.name} за сезон: ${ri(10,30)} голов`}
];
const t=pick(tweets);addTweet(t.w,t.b)}

/* ============ OBJECTIVES ============ */
function genObjectives(){const objs=[];const season=p.season;
  objs.push({id:'goals',text:`Забить ${ri(10,20)} голов`,target:ri(10,20),current:0,done:false,fail:false});
  objs.push({id:'assists',text:`Отдать ${ri(5,15)} голевых`,target:ri(5,15),current:0,done:false,fail:false});
  objs.push({id:'matches',text:`Сыграть ${ri(20,30)} матчей`,target:ri(20,30),current:0,done:false,fail:false});
  return objs;
}
function checkObjectives(){if(!p.objectives)return;p.objectives.forEach(o=>{if(o.current>=o.target)o.done=true;else o.fail=true})}

function playPenalty(onResult){
  const zones=[{x:'left',y:'top',p:0.55},{x:'left',y:'bottom',p:0.65},{x:'center',y:'top',p:0.4},{x:'center',y:'bottom',p:0.7},{x:'right',y:'top',p:0.55},{x:'right',y:'bottom',p:0.65}];

  <div style="text-align:center;font-size:.75em;color:var(--muted);margin-bottom:8px">Выбери направление удара:</div>
  <div class="mini-field">
    <div class="goal-frame">
      <div class="goal-zone" style="left:0;top:0;width:33%;height:50%" onclick="penaltyResult('left','top')"></div>
      <div class="goal-zone" style="left:33%;top:0;width:34%;height:50%" onclick="penaltyResult('center','top')"></div>
      <div class="goal-zone" style="left:67%;top:0;width:33%;height:50%" onclick="penaltyResult('right','top')"></div>
      <div class="goal-zone" style="left:0;top:50%;width:33%;height:50%" onclick="penaltyResult('left','bottom')"></div>
      <div class="goal-zone" style="left:33%;top:50%;width:34%;height:50%" onclick="penaltyResult('center','bottom')"></div>
      <div class="goal-zone" style="left:67%;top:50%;width:33%;height:50%" onclick="penaltyResult('right','bottom')"></div>
    </div>
    <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:2em">🧍</div>
    <div style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:1.5em">⚽</div>
  </div>
  <div class="muted text-center" style="font-size:.7em">Нажми на зону ворот для удара</div>
  <button class="modal-close" onclick="closeModal()">Отмена</button>`;
  openModal(html);
  window._penaltyCb=onResult;
}
function penaltyResult(x,y){
  const zones={'left-top':0.55,'left-bottom':0.65,'center-top':0.4,'center-bottom':0.7,'right-top':0.55,'right-bottom':0.65};
  const prob=zones[x+'-'+y];
  const success=Math.random()<prob;
  closeModal();
  if(window._penaltyCb)window._penaltyCb(success);
}
function playFreeKick(onResult){
  let html=`<div class="modal-title">🎯 СВОБОДНЫЙ УДАР</div>
  <div style="text-align:center;font-size:.75em;color:var(--muted);margin-bottom:8px">Пробей стенку — выбери угол:</div>
  <div class="mini-field">
    <div class="goal-frame">
      <div class="goal-zone" style="left:0;top:0;width:33%;height:100%" onclick="fkResult('left')"></div>
      <div class="goal-zone" style="left:33%;top:0;width:34%;height:100%" onclick="fkResult('center')"></div>
      <div class="goal-zone" style="left:67%;top:0;width:33%;height:100%" onclick="fkResult('right')"></div>
    </div>
    <div style="position:absolute;top:80px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
      <div style="width:20px;height:40px;background:#333;border-radius:4px"></div>
      <div style="width:20px;height:40px;background:#333;border-radius:4px"></div>
      <div style="width:20px;height:40px;background:#333;border-radius:4px"></div>
    </div>
    <div style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:1.5em">⚽</div>
  </div>
  <div class="muted text-center" style="font-size:.7em">Нажми на зону ворот</div>
  <button class="modal-close" onclick="closeModal()">Отмена</button>`;
  openModal(html);
  window._fkCb=onResult;
}
function fkResult(side){
  const probs={left:0.45,center:0.25,right:0.45};
  const success=Math.random()<probs[side];
  closeModal();
  if(window._fkCb)window._fkCb(success);
}

/* ============ TAB NAVIGATION ============ */
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  if(tab==='home')showHomeTab();
  else if(tab==='stats')showStatsTab();
  else if(tab==='world')showWorldTab();
  else if(tab==='shop')showShopTab();
  else if(tab==='settings')showSettingsTab();
  content.scrollTop=0;
}

let ss={name:'',pos:'ST',nt:'Россия',age:16,story:'rise'};
function showStart(){
  $('statusBar').style.display='none';$('statsBar').style.display='none';$('bottomNav').style.display='none';
  const storyCards=STORYLINES.map(s=>`<div class="story-card ${ss.story===s.id?'sel':''}" onclick="ss.story='${s.id}';ss.age=${s.startAge};showStart()"><div class="ttl">${s.name}</div><div class="desc">${s.desc}</div></div>`).join('');

}
function startCareer(){
  const nm=$('inpName')?.value.trim()||randomName('ru');const story=STORYLINES.find(s=>s.id===ss.story);const st=startStats(story.startAge);const ntObj=NTS.find(n=>n.name===ss.nt)||NTS[0];
  p={name:nm,pos:ss.pos,ntName:ntObj.name,ntFlag:ntObj.flag,ntRegion:ntObj.region,startAge:story.startAge,age:story.startAge,ovr:0,story:story.id,
    pac:st.pac,sho:st.sho,pas:st.pas,dri:st.dri,def:st.def,phy:st.phy,club:null,money:story.startMoney,salary:0,season:0,tp:3,
    morale:cm(75+story.moraleBonus),trust:70,form:0,injury:null,partners:60,press:60,fans:cm(60+story.fansBonus),injuryShield:false,
    bootBoost:0,forceTransfer:false,passive:0,trophies:[],awards:[],history:[],achievements:[],seasonCards:[],diary:[],twitter:[],
    career:newCareerStats(),careerTotal:{matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0},nt:null,ntQualified:false,caps:0,sponsor:null,
    sponsorValue:0,clWins:0,wcWins:0,euroWins:0,copaWins:0,ballonDors:0,goldenBoots:0,finished:false,endCause:null,endType:null,
    shopOwned:[],agentLevel:1,agentName:"Мистер Родригес",dilemmaSeen:[],mentee:null,mentorOffered:false,coachMode:false,wasCoach:false,
    coachData:null,coachOfferDeclined:false,stocksOwned:[],stockValues:{},realEstateOwned:[],betsWon:0,betsLost:0,betsTotal:0,
    clubRecordGoals:0,clubRecordSeason:0,comebackDone:false,chronicInjuries:[],sonPlayed:false,weather:getWeather(),objectives:null,theme:'dark'};
  if(p.pos==='GK'){p.def=ri(60,99);p.phy=ri(60,99);p.pac=ri(40,80);p.sho=ri(20,50)}
  if(story.boost)p[story.boost]=cl(p[story.boost]+10);
  const leagueKey=story.startLeague;p.club=pick(LEAGUE_CLUBS[leagueKey]||LEAGUE_CLUBS['por_primeira']);
  p.ovr=calcOvr();p.salary=calcSalary(p.ovr,p.club.tier||1);
  p.objectives=genObjectives();
  addDiary(`Начало карьеры. Сюжет: ${story.name}. Клуб: ${p.club.name}`);
  addTweet('Sky Sports',`Новый талант ${p.name} начинает карьеру в ${p.club.name}!`);
  $('statusBar').style.display='grid';$('statsBar').style.display='grid';$('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos} · ${p.ntName}</small>`;
  save();render();switchTab('home');
  setTimeout(()=>showToast(`📖 Сюжет: ${story.name}`,'#7b1fa2'),500);
}

/* ============ RENDER ============ */
function render(){
  $('sAge').textContent=p.age+'('+getYear()+')';$('sOvr').textContent=p.ovr;$('sMorale').textContent=p.morale;
  const f=$('sForm');f.textContent=formEmoji(p.form);f.className=formCls(p.form);
  const inj=$('sInjury');if(p.injury){inj.textContent=`${p.injury.name} ${p.injury.matchesLeft}м`;inj.className='injury-active'}else{inj.textContent='—';inj.className=''}
  $('stPac').textContent=p.pac;$('stSho').textContent=p.sho;$('stPas').textContent=p.pas;$('stDri').textContent=p.dri;$('stDef').textContent=p.def;$('stPhy').textContent=p.phy;$('stTrust').textContent=p.trust;

}

function doTrain(stat){if(p.tp<=0||p[stat]>=99)return;const gain=ri(1,3);p[stat]=cl(p[stat]+gain);p.tp--;p.ovr=calcOvr();p.salary=calcSalary(p.ovr,p.club.tier||1);save();showHomeTab()}

/* ============ SIM ============ */
function goalProb(){const base=Math.min(.92,p.ovr/110);const formMult=1+p.form*.13;const posMult=p.pos==='GK'?.03:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.12:p.pos==='CDM'?.22:p.pos==='CM'?.35:p.pos==='CAM'?.7:p.pos==='LW'||p.pos==='RW'||p.pos==='SS'?.75:1;return Math.min(.95,base*formMult*posMult*(p.injury?.5:1))}
function assistProb(){const base=Math.min(.75,p.ovr/130);return Math.min(.85,base)}
function cardProb(){let base=.04;if(p.pos==='CB'||p.pos==='CDM')base=.09;if(p.def>85)base+=.02;return base}
function tryInjury(){if(p.injuryShield)return null;if(Math.random()>.05)return null;const stat=pick(['pac','sho','dri','phy']);return{name:'Травма',matchesLeft:ri(1,5),stat,penalty:ri(1,5),perm:false}}
function applyInjury(inj){p[inj.stat]=cl(p[inj.stat]-inj.penalty);p.injury={...inj};p.morale=cm(p.morale-15);p.ovr=calcOvr()}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}
function simMatch(opp,comp){const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false};if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}const baseT=Math.max(0,Math.round((p.club.str-opp.str)/22+1.4+ri(-1,1)));const prob=goalProb()+weatherBonus()*0.01;let pg=0;if(Math.random()<prob)pg++;if(Math.random()<prob*.35)pg++;if(Math.random()<prob*.07)pg++;const ap=assistProb();let a=0;if(Math.random()<ap)a++;const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-p.club.str)/22+1.4+ri(-1,1)));r.tg=tg;r.og=og;r.pg=pg;r.assist=a;if(Math.random()<cardProb())r.yellow=1;if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);return r}
function recordMatch(comp,res){if(!p.career[comp])p.career[comp]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;
  if(p.objectives){p.objectives.forEach(o=>{if(o.id==='goals')o.current+=res.pg;else if(o.id==='assists')o.current+=res.assist;else if(o.id==='matches')o.current++})}}
function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}p._lastLeagueMatches=m;p._lastLeagueKey=key;p._lastLeagueTable=simTable(key,m);return m}
function simTable(leagueKey,pm){const clubs=LEAGUE_CLUBS[leagueKey]||[];const num=(leagueKey==='eng_prem'||leagueKey==='esp_laliga'||leagueKey==='ita_seriea')?38:34;const teams=clubs.map(c=>({name:c.name,flag:c.flag,str:c.str,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,pts:0,isPlayer:c.name===p.club.name}));teams.forEach(t=>{if(t.isPlayer)return;for(let i=0;i<num;i++){const roll=Math.random()+(t.str-75)*.02;if(roll>.65){t.wins++;t.gf+=ri(2,4);t.ga+=ri(0,1)}else if(roll>.35){t.draws++;t.gf+=ri(1,2);t.ga+=ri(1,2)}else{t.losses++;t.gf+=ri(0,1);t.ga+=ri(1,3)}t.played++}t.pts=t.wins*3+t.draws});const pt=teams.find(t=>t.isPlayer);if(pt&&pm){pm.forEach(m=>{pt.played++;if(m.tg>m.og){pt.wins++;pt.pts+=3}else if(m.tg===m.og){pt.draws++;pt.pts++}else pt.losses++;pt.gf+=m.tg;pt.ga+=m.og})}teams.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return teams}
function simCup(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key]||[];const pool=clubs.filter(c=>c.name!==p.club.name);for(let i=0;i<5;i++){const o=pick(pool.length?pool:clubs);const r=simMatch(o,['1/16','1/8','1/4','1/2','Финал'][i]);m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<4)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===5)p.trophies.push({name:'Кубок',season:p.season});return m}
function simCL(){const m=[];const top=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=82&&c.name!==p.club.name);for(let i=0;i<3;i++){const r=simMatch(pick(top),'ЛЧ Группа');m.push(r);recordMatch('cl',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2){for(const st of['1/8','1/4','1/2','Финал']){const r=simMatch(pick(top),'ЛЧ '+st);m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'ЛЧ',season:p.season});p.clWins++;p.morale=cm(p.morale+20)}}}return m}
function simSeason(){const res={league:[],cup:[],cl:[]};res.league=simLeague();res.cup=simCup();if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;if(lw>=Math.floor(res.league.length*.7)&&Math.random()>.4)p.trophies.push({name:'Чемпионат',season:p.season});return res}

function checkSeasonAwards(stats){const newAwards=[];AWARD_DEFS.forEach(a=>{if(a.cat==='career'&&(p.awards||[]).some(x=>x.id===a.id))return;if(a.check(stats)){const aw={id:a.id,n:a.n,icon:a.icon,cat:a.cat,season:p.season,year:getYear()};if(!p.awards)p.awards=[];p.awards.push(aw);newAwards.push(aw);if(a.id==='ballon'){p.ballonDors=(p.ballonDors||0)+1;p.morale=cm(p.morale+25);p.fans=cm(p.fans+20)}else{p.morale=cm(p.morale+8);p.fans=cm(p.fans+5)}}});return newAwards}

/* ============ SEASON ============ */
function nextSeason(){
  const _st=['pac','sho','pas','dri','def','phy'];if(_st.every(s=>p[s]>=99)&&p.tp>0){p.money+=p.tp*200000;p.tp=0}
  p.season++;p.age++;
  if(Math.random()<.006){const crit=pick(CRITICAL);p.finished=true;p.endType=crit.type;p.endCause=crit.cause;save();showCriticalEvent(crit);return}
  const ev=pick(EVENTS);ev.fn();
  p.pac=cl(p.pac+ri(-2,3));p.sho=cl(p.sho+ri(-2,4));p.pas=cl(p.pas+ri(-2,3));p.dri=cl(p.dri+ri(-2,3));p.def=cl(p.def+ri(-1,2));p.phy=cl(p.phy+ri(-2,3));p.ovr=calcOvr();p.form*=.6;
  p.money+=p.salary+p.sponsorValue+(p.passive||0);p.tp=ri(0,20);p.salary=calcSalary(p.ovr,p.club.tier||1);p.injuryShield=false;
  p.weather=getWeather();
  const before=JSON.parse(JSON.stringify(p.career));const season=simSeason();
  const sStats={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};COMPS.forEach(c=>{if(!before[c])before[c]={matches:0,goals:0,assists:0};sStats.matches+=p.career[c].matches-before[c].matches;sStats.goals+=p.career[c].goals-before[c].goals;sStats.assists+=p.career[c].assists-before[c].assists});
  checkObjectives();
  const newAwards=checkSeasonAwards({...sStats,...season});
  p.history.push({age:p.age,year:getYear(),club:p.club.name,salary:p.salary,...sStats});
  p.seasonCards=p.seasonCards||[];p.seasonCards.push({year:getYear()-1,ovr:p.ovr,club:p.club.name,goals:sStats.goals,assists:sStats.assists,matches:sStats.matches});
  ACHIEVEMENTS.forEach(a=>{if(!(p.achievements||[]).includes(a.id)&&a.check()){p.achievements=p.achievements||[];p.achievements.push(a.id)}});
  addDiary(`Сезон ${getYear()-1}/${getYear()}. ${p.club.name}. ${sStats.goals} голов.`);
  if(Math.random()<.5)genTweet();
  save();render();showSeasonRecap(season,ev,sStats,newAwards);
}
function showSeasonRecap(s,ev,stats,newAwards){
  const year=getYear();
  let html=`<div class="event-box fade"><b>📰 СОБЫТИЕ</b>${ev.text}</div>
  <div class="card fade" style="background:linear-gradient(135deg,#2a1a4a,#4a1a6a);text-align:center"><div style="font-size:.7em;color:#ccc">СЕЗОН</div><div style="font-size:1.3em;font-weight:800;color:var(--yellow)">${year-1}/${year}</div></div>`;
  if(s.league.length){html+=`<div class="card fade"><div class="card-title">🏟️ ЧЕМПИОНАТ</div><div class="summary-bar"><div>Матчи<b>${s.league.length}</b></div><div>Голы<b>${stats.goals}</b></div><div>Пасы<b>${stats.assists}</b></div></div></div>`}
  if(s.cup.length){html+=`<div class="card fade"><div class="card-title">🏆 КУБОК</div><div class="muted text-center">Матчей: ${s.cup.length}</div></div>`}
  if(s.cl.length){html+=`<div class="card fade"><div class="card-title">⭐ ЛЧ</div><div class="muted text-center">Матчей: ${s.cl.length}</div></div>`}
  if(newAwards&&newAwards.length){
    html+=`<div class="card fade" style="border:2px solid #ffeb3b;background:linear-gradient(135deg,#2a2a0a,#1a1a05)">`;
    html+=`<div class="card-title" style="color:var(--yellow)">🏆 НАГРАДЫ</div>`;
    newAwards.forEach(a=>{html+=`<div style="padding:8px;border-bottom:1px solid #333;display:flex;align-items:center;gap:8px"><div style="font-size:1.8em">${a.icon}</div><div><div style="font-weight:800;color:var(--yellow);font-size:.85em">${a.n}</div><div style="font-size:.65em;color:var(--muted)">${a.year}</div></div></div>`});
    html+=`</div>`;
  }
  const dilemma=Math.random()<.5?pick(DILEMMAS.filter(d=>!(p.dilemmaSeen||[]).includes(d.id))):null;
  html+=`<button class="btn" onclick="switchTab('home')">ПРОДОЛЖИТЬ →</button>`;
  content.innerHTML=html;content.scrollTop=0;
  if(dilemma)setTimeout(()=>showDilemma(dilemma,()=>{}),300);
}
function showDilemma(d,done){content.innerHTML=`<div class="dilemma-box fade"><div class="ttl">${d.t}</div><div class="txt">${d.txt}</div>${d.choices.map((c,i)=>`<button class="choice-btn" onclick="pickChoice(${i},'${d.id}')">${c.n}</button>`).join('')}</div>`;window._d=d;window._dd=done}
function pickChoice(i,id){const d=window._d;d.choices[i].fn();p.dilemmaSeen=p.dilemmaSeen||[];p.dilemmaSeen.push(id);save();if(window._dd)window._dd();switchTab('home')}
function showCriticalEvent(crit){content.innerHTML=`<div class="event-box fade" style="padding:20px;text-align:center"><div style="font-size:3em">💀</div><div style="font-size:1.1em;font-weight:800;color:var(--red);margin-top:10px">${crit.type==='death'?'СМЕРТЬ':crit.type==='prison'?'ТЮРЬМА':crit.type==='ban'?'ДИСКВАЛИФИКАЦИЯ':'КАРЬЕРА ОКОНЧЕНА'}</div><div style="font-size:.85em;margin-top:10px">${crit.text}</div></div><button class="btn" onclick="${crit.type==='death'?'showEnd()':'showCoachOffer()'}">${crit.type==='death'?'ИТОГИ':'ПРОДОЛЖИТЬ'}</button>`}
function showEnd(){content.innerHTML=`<div class="tab-title">🏁 КАРЬЕРА ЗАВЕРШЕНА</div><div class="card fade text-center"><div style="font-size:1.2em;font-weight:800;color:var(--yellow)">${p.name}</div><div class="muted" style="margin-top:6px">Сезонов: ${p.season} · Матчей: ${p.careerTotal.matches}</div><div class="muted">Голов: ${p.careerTotal.goals} · Трофеев: ${(p.trophies||[]).length}</div><div class="muted">Наград: ${(p.awards||[]).length} · ЗМ: ${p.ballonDors||0}</div></div><button class="btn" onclick="if(confirm('Новая карьера?')){localStorage.removeItem('mfc_story');location.reload()}">🔄 НОВАЯ</button><button class="btn btn-purple" onclick="startLegacy()" ${p.sonPlayed?'disabled':''}>${p.sonPlayed?'✅ Сын играл':'👶 Сын (наследие)'}</button>`}
function showCoachOffer(){content.innerHTML=`<div class="tab-title">👔 СТАТЬ ТРЕНЕРОМ?</div><button class="btn" onclick="startCoachMode()">✅ Да</button><button class="btn btn-gray" onclick="showEnd()">❌ Нет</button>`}
function startCoachMode(){p.coachMode=true;p.wasCoach=true;p.coachData={club:p.club,seasons:0,matches:0,wins:0,draws:0,losses:0,trophies:[],reputation:60,history:[]};save();showCoachScreen()}
function showCoachScreen(){const cd=p.coachData;if(!cd){showEnd();return}content.innerHTML=`<div class="tab-title">👔 ТРЕНЕР: ${cd.club.name}</div><div class="card fade"><div class="summary-bar"><div>Сезонов<b>${cd.seasons}</b></div><div>Побед<b>${cd.wins}</b></div><div>Трофеев<b>${cd.trophies.length}</b></div></div><button class="btn" onclick="coachSeason()">▶ Следующий сезон</button><button class="btn btn-gray" onclick="p.coachMode=false;showEnd()">Завершить</button></div>`}
function coachSeason(){const cd=p.coachData;cd.seasons++;const w=ri(5,15),d=ri(1,8),l=Math.max(0,20-w-d);cd.matches+=w+d+l;cd.wins+=w;cd.draws+=d;cd.losses+=l;const wr=w/(w+d+l);if(wr>.6&&Math.random()>.4){cd.trophies.push({name:'Чемпионат',s:cd.seasons});p.money+=ri(5,20)}cd.reputation=cm(cd.reputation+Math.round((wr-.4)*30));if(cd.reputation<20){showToast('Уволен!');p.coachMode=false;showEnd();return}save();showCoachScreen()}
function endCareer(cause){p.finished=true;p.endCause=cause;save();showCoachOffer()}
function startLegacy(){if(p.sonPlayed||p.age<30)return;p.sonPlayed=true;const sonName=randomName(p.ntFlag==='ru'?'ru':'es');p.son={name:sonName,father:p.name};save();showToast(`👶 Твой сын ${sonName} начинает карьеру!`,'#7b1fa2')}

/* ============ MODAL ============ */
function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}

/* ============ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.awards)p.awards=[];
  if(!p.diary)p.diary=[];
  if(!p.twitter)p.twitter=[];
  if(!p.objectives)p.objectives=genObjectives();
  document.documentElement.setAttribute('data-theme',p.theme==='light'?'light':'');
  $('statusBar').style.display='grid';$('statsBar').style.display='grid';$('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos} · ${p.ntName}</small>`;
  render();switchTab('home');
}else{
  ss={name:'',pos:'ST',nt:'Россия',age:16,story:'rise'};showStart();
}
</script>
