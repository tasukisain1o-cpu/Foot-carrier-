<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: ULTIMATE 2</title>
<style>
:root{--bg:#0a0a0a;--app:#121212;--card:#1c1c1c;--card2:#242424;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2a2a2a;--nav-bg:rgba(30,30,42,.95);--nav-active:#2a2a3a}
[data-theme="light"]{--bg:#e8e8e8;--app:#f5f5f5;--card:#fff;--card2:#f0f0f0;--text:#1a1a1a;--muted:#666;--border:#ddd;--nav-bg:rgba(255,255,255,.95);--nav-active:#e0e0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden;transition:background .3s,color .3s}
#app{width:100%;max-width:420px;height:96vh;max-height:860px;background:var(--app);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card2);padding:6px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase}
.status>div b{display:block;color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.48em;font-weight:700;color:rgba(255,255,255,.7)}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:8px 6px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06);z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.55em;font-weight:600;cursor:pointer;transition:all .25s;padding:6px 10px;border-radius:20px;min-width:56px}
.nav-item.active{background:var(--nav-active);color:var(--blue)}
.nav-item.active .nav-icon{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(33,150,243,.5))}
.nav-icon{font-size:1.6em;margin-bottom:2px;transition:all .25s;line-height:1}
.nav-item:active{transform:scale(.95)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;transition:all .15s;font-family:inherit;position:relative;overflow:hidden}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.btn-gold{background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000;font-weight:800}
.menu-btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:.9em;cursor:pointer;margin-bottom:8px;transition:all .2s;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;animation:slideUp .5s ease}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu-btn:active{transform:scale(.98)}
.menu-btn .mb-icon{font-size:2em}
.menu-btn .mb-info{flex:1}
.menu-btn .mb-title{font-size:1em;font-weight:800;margin-bottom:3px}
.menu-btn .mb-desc{font-size:.65em;opacity:.85;font-weight:500}
.mb-p1{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.mb-p2{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff}
.mb-p3{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff}
.mb-p4{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}
.mb-p5{background:linear-gradient(135deg,#ffeb3b,#fbc02d);color:#000}
.mb-p6{background:linear-gradient(135deg,#f44336,#b71c1c);color:#fff}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px;animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;border-color:#7a7aff;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.summary-bar{display:flex;justify-content:space-around;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:10px;font-size:.62em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:var(--card2);border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}
.detail-row .nm{color:var(--text)}.detail-row .val{font-weight:800;color:var(--yellow)}
.detail-head{font-size:.7em;font-weight:800;color:var(--orange);text-transform:uppercase;margin:8px 0 4px}
.stat-click{background:linear-gradient(135deg,#1a2a3a,#0f1a25);border:1px solid #2a4a6a;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.stat-click:hover{transform:translateY(-2px);border-color:var(--blue)}
.ach-card{background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid #7a7a2a;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:.7em}
.ach-card .ttl{font-weight:800;color:var(--yellow)}.ach-card .desc{color:var(--muted);font-size:.9em;margin-top:2px}
.ach-card.locked{opacity:.35;filter:grayscale(.7)}
.history-item{background:var(--card2);border-radius:8px;padding:8px;margin-bottom:5px;font-size:.72em;cursor:pointer}
.history-head{display:flex;justify-content:space-between;align-items:center}
.history-details{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.history-item.open .history-details{display:block}
.text-center{text-align:center}.mb-8{margin-bottom:8px}.mt-8{margin-top:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}.hl-g{color:var(--green);font-weight:700}
.fade{animation:slideUp .4s ease}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:popIn .3s ease}
.modal-box{background:var(--card);border-radius:14px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;border:1px solid var(--border)}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}
.modal-close{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:.8em;margin-top:10px;font-family:inherit}
.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}
.story-card{background:linear-gradient(135deg,#1a0a2a,#0f051a);border:2px solid #7b1fa2;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;animation:slideUp .4s ease}
.story-card:hover{border-color:var(--yellow);transform:translateY(-2px)}
.story-card.sel{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.story-card .ttl{font-size:.95em;font-weight:800;color:var(--yellow);margin-bottom:4px}
.story-card .desc{font-size:.72em;color:var(--muted);line-height:1.4}
.manager-card{background:linear-gradient(135deg,#1a1a2a,#0f0f1a);border:2px solid #333;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;animation:slideUp .4s ease}
.manager-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.manager-card.owned{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.manager-card.locked{opacity:.5}
.manager-card .mc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.manager-card .mc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.manager-card .mc-info{flex:1}
.manager-card .mc-name{font-weight:800;font-size:.85em}
.manager-card .mc-tier{font-size:.65em;color:var(--muted);margin-top:2px}
.manager-card .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:.6em;text-align:center;margin-top:6px}
.manager-card .mc-stats>div{background:var(--card2);padding:4px;border-radius:6px;color:var(--muted)}
.manager-card .mc-stats>div b{display:block;color:var(--yellow);font-size:1.3em;font-weight:800}
.god-panel{background:linear-gradient(135deg,#2a0a0a,#1a0505);border:2px solid #7d2e2e;border-radius:14px;padding:12px;margin-bottom:10px;animation:pulse 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bounce{animation:bounce .6s ease infinite}
.chart-bar{display:flex;align-items:flex-end;gap:2px;height:80px;padding:6px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.chart-col{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px}
.chart-lbl{font-size:.5em;color:var(--muted);text-align:center}
.obj-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border-left:3px solid var(--orange);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.72em}
.obj-card.done{background:linear-gradient(135deg,#0a2a0a,#051a05);border-left-color:var(--green)}
.obj-card .ttl{font-weight:800;margin-bottom:2px}
.obj-card .prog{color:var(--muted);font-size:.85em}
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}
.theme-btn{flex:1;padding:8px;border:2px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;font-size:.7em;font-weight:700;cursor:pointer;font-family:inherit}
.theme-btn.active{border-color:var(--green);background:var(--green);color:#fff}
</style>
</head>

function startStats(age){const base=age<=16?ri(30,65):age<=18?ri(40,72):age<=20?ri(50,78):age<=22?ri(58,84):age<=25?ri(65,88):age<=28?ri(70,90):ri(72,92);const sp=()=>cl(base+ri(-15,15));return{pac:sp(),sho:sp(),pas:sp(),dri:sp(),def:sp(),phy:sp()}}

function svgBadge(name){const l=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#6a1b9a" stroke="#fff" stroke-width="2"/><text x="20" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">${l}</text></svg>`)}`}
async function getLogo(name){if(logoCache[name])return logoCache[name];try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),3000);const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(name)}`,{signal:ctrl.signal});const d=await r.json();if(d.teams&&d.teams.length){logoCache[name]=d.teams[0].strTeamBadge||svgBadge(name);return logoCache[name]}}catch(e){}logoCache[name]=svgBadge(name);return logoCache[name]}

function doTrain(stat){if(p.tp<=0||p[stat]>=99)return;const gain=ri(1,3);p[stat]=cl(p[stat]+gain);p.tp--;p.ovr=calcOvr();p.salary=calcSalary(p.ovr,p.club.tier||1);save();showHomeTab()}

function showManagers(){

  <div class="card" style="text-align:center"><div style="font-weight:800;color:var(--yellow)">💰 Баланс: €${fmt(p.money)}</div></div>`;
  const grouped={1:[],2:[],3:[],4:[],5:[]};MANAGERS.forEach(m=>grouped[m.tier].push(m));
  const tierNames={1:'Новички (€0.1-0.3M)',2:'Начинающие (€1-3M)',3:'Опытные (€5-15M)',4:'Топ-агенты (€30-50M)',5:'Элита (€100M+)'};
  Object.keys(grouped).forEach(t=>{
    html+=`<div class="card-title" style="margin-top:10px">${tierNames[t]}</div>`;
    grouped[t].forEach(m=>{
      const owned=current===m.id;const canAfford=p.money>=m.cost;const clazz=owned?'owned':(canAfford?'':'locked');
      html+=`<div class="manager-card ${clazz}" onclick="${!owned&&canAfford?`hireManager(${m.id})`:''}">

      </div>`;
    });
  });

function hireManager(id){
  const m=MANAGERS.find(x=>x.id===id);if(!m)return;

}

function showTransfers(){
  const seasonGoals=(p.lastSeasonStats?.goals||0)+(p.lastSeasonStats?.assists||0);
  const managerBoost=(p.manager?.tier||1)*3;
  const perf=p.ovr+seasonGoals*0.5+managerBoost;
  let maxTier=1;
  if(perf>92)maxTier=5;else if(perf>85)maxTier=4;else if(perf>78)maxTier=3;else if(perf>70)maxTier=2;
  maxTier=Math.min(5,maxTier+((p.manager?.tier||1)-1));
  const available=[];
  for(const[key,clubs]of Object.entries(LEAGUE_CLUBS)){
    const lt=LEAGUES[key]?.tier||2;
    if(lt<=maxTier){clubs.forEach(c=>{if(c.name!==p.club.name&&(c.tier||2)<=maxTier)available.push({...c,leagueKey:key})})}
  }
  let html=`<div class="tab-title">📩 ПРЕДЛОЖЕНИЯ</div>
  <div class="card" style="background:linear-gradient(135deg,#2a1a3a,#1a0f25);border:1px solid #5a3a7a">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.3em">${p.manager?.avatar||'👔'}</div><div><div style="font-weight:800;font-size:.85em">${p.manager?.n||'—'}</div><div style="font-size:.7em;color:var(--muted)">Tier ${p.manager?.tier||1} · ${p.manager?.com||0}%</div></div></div>
    <div style="font-size:.75em;line-height:1.4;color:#ddd;background:#1a1a1a;padding:8px 10px;border-radius:8px">Привет! Тебе ${p.age}, OVR ${p.ovr}, ${seasonGoals} голевых. Вот варианты:</div>
  </div>`;
  if(!available.length){html+=`<div class="card text-center muted">Пока предложений нет</div>`}
  else{
    const num=Math.min(4,1+Math.floor((p.manager?.tier||1)/2)+Math.floor(p.ovr/28));
    const shuffled=available.sort(()=>Math.random()-.5).slice(0,num);
    shuffled.forEach(c=>{
      const price=Math.round(p.ovr*ri(3,8)/10+(p.manager?.tier||1)*5);
      const ns=calcSalary(p.ovr,c.tier||2);const ln=LEAGUES[c.leagueKey]?.name||c.leagueKey;
      html+=`<div class="card fade" style="background:var(--card2);border-left:3px solid var(--green);margin-bottom:6px"><div style="font-weight:800;font-size:.85em">${c.name}</div><div style="font-size:.65em;color:var(--muted);margin-top:2px">${ln} · Сила ${c.str}</div><div style="font-size:.7em;color:var(--green);margin-top:4px">💰 €${fmt(ns)}/год · Трансфер: €${price}M</div></div><button class="btn" onclick="acceptTransfer('${c.name}',${price})" style="margin-bottom:8px">✍️ Подписать с ${c.name}</button>`;
    });
  }
  html+=`<button class="btn btn-gray" onclick="switchTab('home')">🏠 Остаться в ${p.club.name}</button>`;
  content.innerHTML=html;
}
function acceptTransfer(name,price){
  const all=Object.values(LEAGUE_CLUBS).flat();const c=all.find(x=>x.name===name);
  if(c){p.club=c;p.money+=price;p.trust=cm(p.trust+10);p.morale=cm(p.morale+10);p.salary=calcSalary(p.ovr,c.tier||2);addDiary(`Перешёл в ${c.name}`);addTweet('Transfer',`${p.name} в ${c.name}!`)}
  save();showToast(`✅ ${name}!`,'#4caf50');switchTab('home');
}

function coachNextSeason(){
  const cd=p.coachData;cd.seasons++;p.age++;
  const tactic=TACTICS[cd.tactic]||TACTICS['4-2-3-1'];
  const squadStr=cd.squad.reduce((s,x)=>s+x.ovr,0)/cd.squad.length;
  const staffBonus=Object.keys(cd.staff).length*2;
  const teamStr=squadStr+tactic.atk*20+tactic.def*10+staffBonus+cd.reputation*0.15+cd.budget*0.05;
  const numMatches=34;let w=0,d=0,l=0,gf=0,ga=0;
  for(let i=0;i<numMatches;i++){
    const oppStr=cd.club.str+ri(-15,15);
    const myGoals=Math.max(0,Math.round((teamStr-oppStr)/8+1.4+ri(-1,1)));
    const oppGoals=Math.max(0,Math.round((oppStr-teamStr)/8+1.4+ri(-1,1)));
    gf+=myGoals;ga+=oppGoals;
    if(myGoals>oppGoals)w++;else if(myGoals<oppGoals)l++;else d++;
  }
  const pts=w*3+d;
  cd.matches+=numMatches;cd.wins+=w;cd.draws+=d;cd.losses+=l;cd.gf+=gf;cd.ga+=ga;
  const position=Math.max(1,Math.min(20,Math.round(20-pts/2.5)-ri(0,2)));cd.position=position;
  cd.cupStage=Math.min(4,Math.max(0,Math.round(w/5)+ri(-1,1)));
  if(position<=6){cd.uclStage=Math.min(4,Math.max(0,Math.round(w/4)+ri(-1,1)));cd.uclWin=cd.uclStage>=4&&Math.random()>0.6}
  else{cd.uclStage=0;cd.uclWin=false}
  if(position===1)cd.trophies.push({name:'Чемпионат',season:cd.seasons});
  if(cd.cupStage>=4&&Math.random()>0.4)cd.trophies.push({name:'Кубок',season:cd.seasons});
  if(cd.uclWin)cd.trophies.push({name:'ЛЧ',season:cd.seasons});
  cd.reputation=cm(cd.reputation+Math.round((w/numMatches-0.4)*30));
  cd.boardRating=cm(cd.boardRating+Math.round((w/numMatches-0.4)*25));
  cd.fanRating=cm(cd.fanRating+Math.round((w/numMatches-0.4)*20));
  const result={wins:w,draws:d,losses:l,gf,ga,position,uclWin:cd.uclWin,uclStage:cd.uclStage,cupStage:cd.cupStage};
  COACH_AWARDS.forEach(a=>{if(cd.awards.some(x=>x.id===a.id))return;if(a.check(result)){cd.awards.push({id:a.id,n:a.n,season:cd.seasons,age:p.age});p.morale=cm(p.morale+10)}});
  cd.tasks.forEach(t=>{if(t.check(result))t.done=true});
  const completed=cd.tasks.filter(t=>t.done).length;
  if(completed>=2){p.money+=ri(3,8);cd.budget+=ri(5,15);showToast(`✅ Задачи: ${completed}/3`,'#4caf50')}
  else if(completed<=1){cd.boardRating=cm(cd.boardRating-10)}
  cd.tasks=genCoachTasks();
  const earn=ri(2,10)+Math.floor(cd.reputation/10);p.money+=earn;cd.budget+=ri(3,20);
  cd.squad.forEach(s=>{if(s.injured>0)s.injured--;if(s.young&&cd.staff.youth)s.ovr=cl(s.ovr+ri(0,3));else if(s.age<24)s.ovr=cl(s.ovr+ri(0,2));else if(s.age>30)s.ovr=cl(s.ovr-ri(0,1));s.age++});
  if(cd.boardRating<15||(position>=18&&Math.random()>0.5)){save();showCoachFired();return}
  cd.history.push({season:cd.seasons,club:cd.club.name,wins:w,draws:d,losses:l,gf,ga,pts,position,tactic:cd.tactic});
  addDiary(`Сезон ${cd.seasons} · ${cd.club.name} · ${position} место`);
  save();render();showCoachSeasonRecap(result);
}

  const available=Object.values(LEAGUE_CLUBS).flat().filter(c=>(c.tier||2)<=(cd.club.tier||3));
  if(!available.length){showToast('⚠️ Нет клубов');p.coachMode=false;showEnd();return}
  const newClub=pick(available);cd.club=newClub;cd.reputation=cm(cd.reputation-15);cd.budget=ri(2,15);cd.squad=genCoachSquad(newClub.str-5);p.club=newClub;
  addDiary(`Возглавил ${newClub.name}`);save();showToast(`✅ ${newClub.name}!`,'#4caf50');switchTab('home');
}
function coachMoveUp(){
  const cd=p.coachData;
  const better=Object.values(LEAGUE_CLUBS).flat().filter(c=>(c.tier||2)>(cd.club.tier||2));
  if(!better.length)return;
  const newClub=pick(better);cd.club=newClub;cd.budget+=ri(20,80);cd.reputation=cm(cd.reputation-5);cd.squad=genCoachSquad(newClub.str);p.club=newClub;

}

/* ============ СИМУЛЯЦИЯ ============ */
function goalProb(){const base=Math.min(.92,p.ovr/110);const formMult=1+p.form*.13;const posMult=p.pos==='GK'?.03:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.12:p.pos==='CDM'?.22:p.pos==='CM'?.35:p.pos==='CAM'?.7:p.pos==='LW'||p.pos==='RW'||p.pos==='SS'?.75:1;return Math.min(.95,base*formMult*posMult*(p.injury?.5:1))}
function assistProb(){return Math.min(.85,Math.min(.75,p.ovr/130))}
function cardProb(){let b=.04;if(p.pos==='CB'||p.pos==='CDM')b=.09;if(p.def>85)b+=.02;return b}
function tryInjury(){if(p.injuryShield)return null;if(Math.random()>.05)return null;const stat=pick(['pac','sho','dri','phy']);return{name:'Травма',matchesLeft:ri(1,5),stat,penalty:ri(1,5),perm:false}}
function applyInjury(inj){p[inj.stat]=cl(p[inj.stat]-inj.penalty);p.injury={...inj};p.morale=cm(p.morale-15);p.ovr=calcOvr()}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}
function simMatch(opp,comp){const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false};if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}const baseT=Math.max(0,Math.round((p.club.str-opp.str)/22+1.4+ri(-1,1)));const prob=goalProb()+weatherBonus()*0.01;let pg=0;if(Math.random()<prob)pg++;if(Math.random()<prob*.35)pg++;if(Math.random()<prob*.07)pg++;const ap=assistProb();let a=0;if(Math.random()<ap)a++;const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-p.club.str)/22+1.4+ri(-1,1)));r.tg=tg;r.og=og;r.pg=pg;r.assist=a;if(Math.random()<cardProb())r.yellow=1;if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);return r}
function recordMatch(comp,res){if(!p.career[comp])p.career[comp]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;if(p.objectives){p.objectives.forEach(o=>{if(o.id==='goals')o.current+=res.pg;else if(o.id==='assists')o.current+=res.assist;else if(o.id==='matches')o.current++})}}
function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}p._lastLeagueKey=key;p._lastLeagueTable=simTable(key,m);return m}
function simTable(leagueKey,pm){const clubs=LEAGUE_CLUBS[leagueKey]||[];const num=(leagueKey==='eng_prem'||leagueKey==='esp_laliga'||leagueKey==='ita_seriea')?38:34;const teams=clubs.map(c=>({name:c.name,flag:c.flag,str:c.str,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,pts:0,isPlayer:c.name===p.club.name}));teams.forEach(t=>{if(t.isPlayer)return;for(let i=0;i<num;i++){const roll=Math.random()+(t.str-75)*.02;if(roll>.65){t.wins++;t.gf+=ri(2,4);t.ga+=ri(0,1)}else if(roll>.35){t.draws++;t.gf+=ri(1,2);t.ga+=ri(1,2)}else{t.losses++;t.gf+=ri(0,1);t.ga+=ri(1,3)}t.played++}t.pts=t.wins*3+t.draws});const pt=teams.find(t=>t.isPlayer);if(pt&&pm){pm.forEach(m=>{pt.played++;if(m.tg>m.og){pt.wins++;pt.pts+=3}else if(m.tg===m.og){pt.draws++;pt.pts++}else pt.losses++;pt.gf+=m.tg;pt.ga+=m.og})}teams.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return teams}
function simCup(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key]||[];const pool=clubs.filter(c=>c.name!==p.club.name);for(let i=0;i<5;i++){const o=pick(pool.length?pool:clubs);const r=simMatch(o,['1/16','1/8','1/4','1/2','Финал'][i]);m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<4)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===5)p.trophies.push({name:'Кубок',season:p.season});return m}
function simCL(){const m=[];const top=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=82&&c.name!==p.club.name);for(let i=0;i<3;i++){const r=simMatch(pick(top),'ЛЧ Группа');m.push(r);recordMatch('cl',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2){for(const st of['1/8','1/4','1/2','Финал']){const r=simMatch(pick(top),'ЛЧ '+st);m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'ЛЧ',season:p.season});p.clWins++;p.morale=cm(p.morale+20)}}}return m}
function simSeason(){const res={league:[],cup:[],cl:[]};res.league=simLeague();res.cup=simCup();if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;if(lw>=Math.floor(res.league.length*.7)&&Math.random()>.4)p.trophies.push({name:'Чемпионат',season:p.season});return res}
function checkSeasonAwards(stats){const newAwards=[];AWARD_DEFS.forEach(a=>{if(a.cat==='career'&&(p.awards||[]).some(x=>x.id===a.id))return;if(a.check(stats)){const aw={id:a.id,n:a.n,icon:a.icon,cat:a.cat,season:p.season,year:getYear()};if(!p.awards)p.awards=[];p.awards.push(aw);newAwards.push(aw);if(a.id==='ballon'){p.ballonDors=(p.ballonDors||0)+1;p.morale=cm(p.morale+25);p.fans=cm(p.fans+20)}else{p.morale=cm(p.morale+8);p.fans=cm(p.fans+5)}}});return newAwards}

function nextSeason(){
  if(p.god){godSkipSeason();return}
  const _st=['pac','sho','pas','dri','def','phy'];if(_st.every(s=>p[s]>=99)&&p.tp>0){p.money+=p.tp*200000;p.tp=0}
  p.season++;p.age++;
  if(Math.random()<.006){const crit=pick(CRITICAL);p.finished=true;p.endType=crit.type;p.endCause=crit.cause;save();showCriticalEvent(crit);return}
  const ev=pick(EVENTS);ev.fn();
  let gm=1;if(p.age<=18)gm=2.0;else if(p.age<=20)gm=1.6;else if(p.age<=24)gm=1.2;else if(p.age<=28)gm=0.7;else gm=0.3;
  p.pac=cl(p.pac+Math.round(ri(0,4)*gm));p.sho=cl(p.sho+Math.round(ri(0,5)*gm));p.pas=cl(p.pas+Math.round(ri(0,4)*gm));p.dri=cl(p.dri+Math.round(ri(0,4)*gm));p.def=cl(p.def+Math.round(ri(-1,3)*gm));p.phy=cl(p.phy+Math.round(ri(0,3)*gm));
  p.ovr=calcOvr();p.form*=.6;
  const tpBase=p.age<=20?ri(8,20):p.age<=24?ri(6,15):p.age<=28?ri(4,10):ri(2,6);p.tp=tpBase;
  p.money+=p.salary+p.sponsorValue+(p.passive||0);p.salary=calcSalary(p.ovr,p.club.tier||1);p.injuryShield=false;p.weather=getWeather();
  const before=JSON.parse(JSON.stringify(p.career));const season=simSeason();
  const sStats={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};COMPS.forEach(c=>{if(!before[c])before[c]={matches:0,goals:0,assists:0};sStats.matches+=p.career[c].matches-before[c].matches;sStats.goals+=p.career[c].goals-before[c].goals;sStats.assists+=p.career[c].assists-before[c].assists});
  checkObjectives();const newAwards=checkSeasonAwards({...sStats,...season});
  p.history.push({age:p.age,year:getYear(),club:p.club.name,salary:p.salary,...sStats});
  p.seasonCards=p.seasonCards||[];p.seasonCards.push({year:getYear()-1,ovr:p.ovr,club:p.club.name,goals:sStats.goals,assists:sStats.assists,matches:sStats.matches});
  ACHIEVEMENTS.forEach(a=>{if(!(p.achievements||[]).includes(a.id)&&a.check()){p.achievements=p.achievements||[];p.achievements.push(a.id)}});
  addDiary(`Сезон ${getYear()-1}/${getYear()}. ${p.club.name}. ${sStats.goals} голов.`);
  if(Math.random()<.5)genTweet();p.lastSeasonStats=sStats;
  save();render();showSeasonRecap(season,ev,sStats,newAwards);
}
function showSeasonRecap(s,ev,stats,newAwards){
  const year=getYear();
  let html=`<div class="event-box fade"><b>📰 СОБЫТИЕ</b>${ev.text}</div>
  <div class="card fade" style="background:linear-gradient(135deg,#2a1a4a,#4a1a6a);text-align:center"><div style="font-size:.7em;color:#ccc">СЕЗОН</div><div style="font-size:1.3em;font-weight:800;color:var(--yellow)">${year-1}/${year}</div></div>`;
  if(s.league.length){html+=`<div class="card fade"><div class="card-title">🏟️ ЧЕМПИОНАТ</div><div class="summary-bar"><div>Матчи<b>${s.league.length}</b></div><div>Голы<b>${stats.goals}</b></div><div>Пасы<b>${stats.assists}</b></div></div><button class="btn btn-blue" onclick="switchTab('world')">📊 ТАБЛИЦА</button></div>`}
  if(s.cup.length){html+=`<div class="card fade"><div class="card-title">🏆 КУБОК</div><div class="muted text-center">Матчей: ${s.cup.length}</div></div>`}
  if(s.cl.length){html+=`<div class="card fade"><div class="card-title">⭐ ЛЧ</div><div class="muted text-center">Матчей: ${s.cl.length}</div></div>`}
  if(newAwards&&newAwards.length){html+=`<div class="card fade" style="border:2px solid #ffeb3b;background:linear-gradient(135deg,#2a2a0a,#1a1a05)"><div class="card-title" style="color:var(--yellow)">🏆 НАГРАДЫ</div>${newAwards.map(a=>`<div style="padding:8px;border-bottom:1px solid #333;display:flex;align-items:center;gap:8px"><div style="font-size:1.8em">${a.icon}</div><div><div style="font-weight:800;color:var(--yellow);font-size:.85em">${a.n}</div><div style="font-size:.65em;color:var(--muted)">${a.year}</div></div></div>`).join('')}</div>`}
  html+=`<button class="btn btn-blue" onclick="showTransfers()">📩 К ПРЕДЛОЖЕНИЯМ →</button>`;
  content.innerHTML=html;content.scrollTop=0;
  const dilemma=Math.random()<.5?pick(DILEMMAS.filter(d=>!(p.dilemmaSeen||[]).includes(d.id))):null;
  if(dilemma)setTimeout(()=>showDilemma(dilemma),400);
}
function showDilemma(d){content.innerHTML+=`<div class="dilemma-box fade" style="margin-top:10px"><div style="font-size:.75em;font-weight:800;color:#9c9cff;text-transform:uppercase;margin-bottom:6px">${d.t}</div><div style="font-size:.85em;line-height:1.5;color:#ddd;margin-bottom:12px">${d.txt}</div>${d.choices.map((c,i)=>`<button class="choice-btn" onclick="pickChoice(${i})">${c.n}</button>`).join('')}</div>`;window._d=d}
function pickChoice(i){const d=window._d;d.choices[i].fn();p.dilemmaSeen=p.dilemmaSeen||[];p.dilemmaSeen.push(d.id);save();switchTab('home')}
function showCriticalEvent(crit){content.innerHTML=`<div class="event-box fade" style="padding:20px;text-align:center"><div style="font-size:3em">💀</div><div style="font-size:1.1em;font-weight:800;color:var(--red);margin-top:10px">${crit.type==='death'?'СМЕРТЬ':crit.type==='prison'?'ТЮРЬМА':crit.type==='ban'?'ДИСКВАЛИФИКАЦИЯ':'КАРЬЕРА ОКОНЧЕНА'}</div><div style="font-size:.85em;margin-top:10px">${crit.text}</div></div><button class="btn" onclick="${crit.type==='death'?'showEnd()':'showCoachOffer()'}">${crit.type==='death'?'ИТОГИ':'ПРОДОЛЖИТЬ'}</button>`}
function showEnd(){content.innerHTML=`<div class="tab-title">🏁 КАРЬЕРА ЗАВЕРШЕНА</div><div class="card fade text-center"><div style="font-size:1.2em;font-weight:800;color:var(--yellow)">${p.name}</div><div class="muted" style="margin-top:6px">Сезонов: ${p.season} · Матчей: ${p.careerTotal.matches}</div><div class="muted">Голов: ${p.careerTotal.goals} · Трофеев: ${(p.trophies||[]).length}</div><div class="muted">Наград: ${(p.awards||[]).length} · ЗМ: ${p.ballonDors||0}</div></div><button class="btn" onclick="if(confirm('Новая?')){localStorage.removeItem('mfc_ult2');location.reload()}">🔄 НОВАЯ</button><button class="btn btn-gray" onclick="showMainMenu()">🏠 Меню</button>`}
function showCoachOffer(){content.innerHTML=`<div class="tab-title">👔 СТАТЬ ТРЕНЕРОМ?</div><button class="btn" onclick="startCoachMode()">✅ Да</button><button class="btn btn-gray" onclick="showEnd()">❌ Нет</button>`}
function startCoachMode(){p.coachMode=true;p.wasCoach=true;p.coachData={club:p.club,seasons:0,matches:0,wins:0,draws:0,losses:0,gf:0,ga:0,trophies:[],reputation:60,budget:0,wageBudget:0,tactic:'4-2-3-1',squad:genCoachSquad(p.club.str||70),staff:{},tasks:genCoachTasks(),history:[],awards:[],position:10,boardRating:60,fanRating:60,uclStage:0,cupStage:0,uclWin:false};save();showCoachScreen()}
function endCareer(cause){p.finished=true;p.endCause=cause;save();showCoachOffer()}

/* ============ MODAL ============ */
function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}

/* ============ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.awards)p.awards=[];
  if(!p.diary)p.diary=[];
  if(!p.twitter)p.twitter=[];
  if(!p.objectives)p.objectives=genObjectives();
  if(!p.manager)p.manager=MANAGERS[0];
  if(p.coachData){
    if(!p.coachData.squad)p.coachData.squad=genCoachSquad(p.coachData.club?.str||70);
    if(!p.coachData.tactic)p.coachData.tactic='4-2-3-1';
    if(!p.coachData.tasks)p.coachData.tasks=genCoachTasks();
    if(!p.coachData.staff)p.coachData.staff={};
    if(!p.coachData.awards)p.coachData.awards=[];
    if(p.coachData.boardRating===undefined)p.coachData.boardRating=60;
    if(p.coachData.fanRating===undefined)p.coachData.fanRating=60;
    if(p.coachData.budget===undefined)p.coachData.budget=0;
  }
  document.documentElement.setAttribute('data-theme',p.theme==='light'?'light':'');
  $('statusBar').style.display='grid';$('statsBar').style.display='grid';$('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos||'—'} · ${p.ntName||'—'}</small>`;
  render();switchTab('home');
}else{
  showMainMenu();
}
</script>
</body>
</html>
