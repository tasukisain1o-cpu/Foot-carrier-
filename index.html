<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Football Career: ULTIMATE 6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0a0a0a;--app:#121212;--card:#1c1c1c;--card2:#242424;--green:#4caf50;--green-d:#388e3c;--blue:#2196f3;--orange:#ff9800;--red:#f44336;--purple:#7b1fa2;--yellow:#ffeb3b;--text:#e8e8e8;--muted:#888;--border:#2a2a2a;--nav-bg:rgba(30,30,42,.95);--nav-active:#2a2a3a}
[data-theme="light"]{--bg:#e8e8e8;--app:#f5f5f5;--card:#fff;--card2:#f0f0f0;--text:#1a1a1a;--muted:#666;--border:#ddd;--nav-bg:rgba(255,255,255,.95);--nav-active:#e0e0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
#app{width:100%;max-width:420px;height:96vh;max-height:860px;background:var(--app);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9);border:1px solid var(--border);position:relative}
.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.hdr-title small{display:block;font-size:.6em;opacity:.75;font-weight:500}
.hdr-tr{font-size:.65em;font-weight:700;color:var(--yellow);text-align:right;line-height:1.3}
.hdr-tr span{display:block}
.status{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card2);padding:6px 4px;font-size:.55em;border-bottom:1px solid var(--border);flex-shrink:0}
.status>div{text-align:center;color:var(--muted);text-transform:uppercase}
.status>div b{display:block;color:var(--text);font-size:1.35em;margin-top:1px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}
.stats>div{text-align:center;font-size:.48em;font-weight:700;color:rgba(255,255,255,.7)}
.stats>div b{display:block;font-size:1.45em;color:var(--yellow);margin-top:1px;font-weight:800}
.form-hot{color:#ff5722!important}.form-good{color:#8bc34a!important}.form-ok{color:#ffc107!important}.form-bad{color:#ff9800!important}.form-cold{color:#64b5f6!important}
.injury-active{color:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;background:var(--nav-bg);backdrop-filter:blur(20px);border-radius:28px;padding:8px 6px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06);z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.55em;font-weight:600;cursor:pointer;transition:all .25s;padding:6px 10px;border-radius:20px;min-width:56px}
.nav-item.active{background:var(--nav-active);color:var(--blue)}
.nav-icon{font-size:1.6em;margin-bottom:2px;line-height:1}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.btn-gold{background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000;font-weight:800}
.menu-btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:.9em;cursor:pointer;margin-bottom:8px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;animation:slideUp .5s ease}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu-btn .mb-icon{font-size:2em}.menu-btn .mb-info{flex:1}
.menu-btn .mb-title{font-size:1em;font-weight:800;margin-bottom:3px}
.menu-btn .mb-desc{font-size:.65em;opacity:.85;font-weight:500}
.mb-p1{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.mb-p2{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff}
.mb-p3{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff}
.mb-p4{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}
.mb-p5{background:linear-gradient(135deg,#ffeb3b,#fbc02d);color:#000}
.mb-p6{background:linear-gradient(135deg,#f44336,#b71c1c);color:#fff}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.rel-item{background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center;font-size:.55em;color:var(--muted)}
.rel-item .ico{font-size:1.3em;display:block;margin-bottom:2px}
.rel-item .val{font-size:1.3em;font-weight:800;display:block}
.rel-item.high .val{color:var(--green)}.rel-item.mid .val{color:var(--yellow)}.rel-item.low .val{color:var(--red)}
.summary-bar{display:flex;justify-content:space-around;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:10px;font-size:.62em}
.summary-bar div{text-align:center;color:var(--muted)}
.summary-bar b{display:block;color:var(--text);font-size:1.35em;font-weight:800;margin-top:2px}
.detail-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;background:var(--card2);border-radius:6px;margin-bottom:4px;font-size:.72em;align-items:center}
.detail-row .nm{color:var(--text)}.detail-row .val{font-weight:800;color:var(--yellow)}
.ach-card{background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid #7a7a2a;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:.7em}
.ach-card .ttl{font-weight:800;color:var(--yellow)}.ach-card .desc{color:var(--muted);font-size:.9em;margin-top:2px}
.ach-card.locked{opacity:.35;filter:grayscale(.7)}
.text-center{text-align:center}.mb-8{margin-bottom:8px}
.muted{color:var(--muted);font-size:.7em}
.hl{color:var(--yellow);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:flex-end;padding:0}
.modal.show{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 16px 24px;border:1px solid var(--border);animation:slideUpSheet .3s ease}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box::before{content:'';display:block;width:40px;height:4px;background:#555;border-radius:2px;margin:0 auto 12px}
.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}
.modal-close{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:.8em;margin-top:10px;font-family:inherit}
.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}
.story-card{background:linear-gradient(135deg,#1a0a2a,#0f051a);border:2px solid #7b1fa2;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.story-card:hover{border-color:var(--yellow);transform:translateY(-2px)}
.story-card.sel{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.story-card .ttl{font-size:.95em;font-weight:800;color:var(--yellow);margin-bottom:4px}
.story-card .desc{font-size:.72em;color:var(--muted);line-height:1.4}
.manager-card{background:linear-gradient(135deg,#1a1a2a,#0f0f1a);border:2px solid #333;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.manager-card:hover{border-color:var(--blue)}
.manager-card.owned{border-color:var(--green);background:linear-gradient(135deg,#0a2a1a,#051a0f)}
.manager-card.locked{opacity:.5}
.manager-card .mc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.manager-card .mc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7b1fa2,#4a148c);display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.manager-card .mc-info{flex:1}
.manager-card .mc-name{font-weight:800;font-size:.85em}
.manager-card .mc-tier{font-size:.65em;color:var(--muted);margin-top:2px}
.manager-card .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:.6em;text-align:center;margin-top:6px}
.manager-card .mc-stats>div{background:var(--card2);padding:4px;border-radius:6px;color:var(--muted)}
.manager-card .mc-stats>div b{display:block;color:var(--yellow);font-size:1.3em}
.god-panel{background:linear-gradient(135deg,#2a0a0a,#1a0505);border:2px solid #7d2e2e;border-radius:14px;padding:12px;margin-bottom:10px;animation:pulse 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bounce{animation:bounce .6s ease infinite}
.chart-bar{display:flex;align-items:flex-end;gap:2px;height:80px;padding:6px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.chart-col{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:2px 2px 0 0;min-height:3px}
.obj-card{background:linear-gradient(135deg,#2a1a0a,#1a0f05);border-left:3px solid var(--orange);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.72em}
.obj-card.done{background:linear-gradient(135deg,#0a2a0a,#051a05);border-left-color:var(--green)}
.obj-card .ttl{font-weight:800;margin-bottom:2px}
.obj-card .prog{color:var(--muted);font-size:.85em}
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}
.theme-btn{flex:1;padding:8px;border:2px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;font-size:.7em;font-weight:700;cursor:pointer;font-family:inherit}
.theme-btn.active{border-color:var(--green);background:var(--green);color:#fff}
.progress-bar{background:var(--card2);border-radius:10px;height:6px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:10px;transition:width .6s ease}
.progress-fill.green{background:linear-gradient(90deg,#4caf50,#8bc34a)}
.progress-fill.yellow{background:linear-gradient(90deg,#ffc107,#ffeb3b)}
.progress-fill.red{background:linear-gradient(90deg,#f44336,#e91e63)}
.progress-fill.blue{background:linear-gradient(90deg,#2196f3,#03a9f4)}
.accordion{background:var(--card);border-radius:14px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden}
.accordion-head{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.8em}
.accordion-arrow{transition:transform .3s;color:var(--muted)}
.accordion.open .accordion-arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .4s,padding .3s;padding:0 12px}
.accordion.open .accordion-body{max-height:3000px;padding:0 12px 12px}
.quick-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding:4px;background:var(--card2);border-radius:10px}
.quick-tabs::-webkit-scrollbar{display:none}
.quick-tab{padding:6px 12px;border-radius:8px;font-size:.7em;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:inherit}
.quick-tab.active{background:var(--green);color:#fff}
.search-wrap{position:relative;margin-bottom:8px}
.search-input{width:100%;padding:10px 12px 10px 36px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.8em;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--green)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.fab{position:fixed;bottom:100px;right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;border:none;font-size:1.5em;cursor:pointer;box-shadow:0 6px 20px rgba(76,175,80,.6);z-index:45;display:flex;align-items:center;justify-content:center}
.toast-upgraded{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;font-size:.85em;font-weight:700;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.7);max-width:340px;text-align:center;display:flex;align-items:center;gap:10px;animation:slideUp .4s}
.toast-upgraded.success{background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff}
.toast-upgraded.error{background:linear-gradient(135deg,#c62828,#f44336);color:#fff}
.toast-upgraded.warn{background:linear-gradient(135deg,#ef6c00,#ff9800);color:#fff}
.toast-upgraded.info{background:linear-gradient(135deg,#1565c0,#2196f3);color:#fff}
/* Погодные эффекты */
.weather-fx{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.rain-drop{position:absolute;width:2px;height:20px;background:linear-gradient(180deg,transparent,#4fc3f7);animation:rainFall linear infinite;opacity:.6}
@keyframes rainFall{from{transform:translateY(-100vh)}to{transform:translateY(100vh)}}
.snow-flake{position:absolute;color:#fff;font-size:1em;animation:snowFall linear infinite;opacity:.7}
@keyframes snowFall{from{transform:translateY(-100vh) rotate(0)}to{transform:translateY(100vh) rotate(360deg)}}
.sun-ray{position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(255,235,59,.15),transparent 70%);border-radius:50%;animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.3);opacity:.5}}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
</style>

function goalProb(){
  const base=Math.min(.75,p.ovr/180);
  const formMult=1+p.form*.10;
  const pm=POSITION_MULT[p.pos]||{goals:0.5};
  const injuryMult=p.injury?.4:1;
  const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:p.ovr<88?0.9:1;
  const styleBoost=p._styleBoost||1;
  let prob=Math.min(.6,base*formMult*pm.goals*injuryMult*ovrPenalty*styleBoost);
  // Языковой барьер
  if(p.languageBarrier>0)prob*=0.9;
  return prob;
}
function assistProb(){
  const base=Math.min(.6,p.ovr/200);
  const pm=POSITION_MULT[p.pos]||{assists:0.5};
  const ovrPenalty=p.ovr<70?0.5:p.ovr<80?0.75:1;
  return Math.min(.65,base*pm.assists*ovrPenalty*(1+p.form*.08));
}
function cardProb(){let b=.04;if(p.pos==='CB'||p.pos==='CDM')b=.09;if(p.def>85)b+=.02;return b}

function tryInjury(){
  if(p.injuryShield)return null;
  let chance=.05;
  if(p.form<=-2)chance+=.02;
  if(p.phy<60)chance+=.015;
  if(p.morale<40)chance+=.01;
  const chronic=p.chronicInjuries||[];
  if(chronic.length)chance+=chronic.length*0.02;
  if(Math.random()>chance)return null;
  const roll=Math.random();
  const stat=pick(['pac','sho','dri','phy']);
  const isChronic=chronic.includes(stat);
  let injury;
  if(roll<.6)injury={name:'Лёгкая',matchesLeft:ri(1,2),stat,penalty:ri(1,3),perm:false};
  else if(roll<.9)injury={name:'Средняя',matchesLeft:ri(3,5),stat,penalty:ri(3,6),perm:false};
  else injury={name:'Тяжёлая',matchesLeft:ri(5,9),stat,penalty:ri(3,8),perm:true};
  if(isChronic){injury.penalty+=3;injury.chronic=true}
  return injury;
}
function applyInjury(inj){
  p[inj.stat]=cl(p[inj.stat]-inj.penalty);
  p.injury={...inj};
  p.morale=cm(p.morale-15);
  p.ovr=calcOvr();
  if(inj.perm){
    p.chronicInjuries=p.chronicInjuries||[];
    if(!p.chronicInjuries.includes(inj.stat))p.chronicInjuries.push(inj.stat);
  }
}
function recoverInjury(){if(!p.injury)return;if(!p.injury.perm)p[p.injury.stat]=cl(p[p.injury.stat]+p.injury.penalty);p.injury=null;p.ovr=calcOvr()}

function simMatch(opp,comp){
  const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false,comment:'',derby:false};
  if(p.injury&&p.injury.matchesLeft>0){p.injury.matchesLeft--;r.missed=true;if(p.injury.matchesLeft<=0)recoverInjury();return r}
  const derby=DERBIES.find(d=>(d.home===p.club.name&&d.away===opp.name)||(d.away===p.club.name&&d.home===opp.name));
  r.derby=!!derby;const bonus=derby?0.15:0;
  const baseT=Math.max(0,Math.round((p.club.str-opp.str)/22+1.4+ri(-1,1)));
  let prob=goalProb()+weatherBonus()*0.01+bonus;
  if(p._benched)prob*=0.5;
  if(p._scoutBonus)prob+=p._scoutBonus;
  // Бонус от друзей
  if(p.friends&&p.friends.length)prob*=1.03;
  let pg=0;
  const secondGoal=prob*0.25,hatTrick=prob*0.04;
  if(Math.random()<prob)pg++;
  if(Math.random()<secondGoal)pg++;
  if(Math.random()<hatTrick)pg++;
  if(pg>0&&Math.random()<0.18){pg=0;r.comment='📺 VAR отменил гол!';r.varCancelled=true}
  else if(pg>0)r.comment=pick(['⚽ ГОЛ!','⚡ Что за удар!','🎯 В девятку!','💥 С 25 метров!','🔥 Стадион взорвался!']);
  else if(Math.random()<0.3)r.comment=pick(['😢 В штангу!','❌ Мимо!','😤 Выше ворот!']);
  const ap=assistProb();let a=0;if(Math.random()<ap)a++;
  const tg=baseT+pg;const og=Math.max(0,Math.round((opp.str-p.club.str)/22+1.4+ri(-1,1)));
  r.tg=tg;r.og=og;r.pg=pg;r.assist=a;
  if(Math.random()<cardProb())r.yellow=1;
  if(!p.injury){const inj=tryInjury();if(inj)applyInjury(inj)}
  if(pg>=2)p.form=Math.min(3,p.form+1);else if(pg===1)p.form=Math.min(3,p.form+.5);else if(tg<og)p.form=Math.max(-3,p.form-.5);
  if(pg>=3)p._hatTricks=(p._hatTricks||0)+1;
  if(derby&&pg>0)p._derbyGoals=(p._derbyGoals||0)+pg;
  return r;
}
function recordMatch(comp,res){
  if(!p.career[comp])p.career[comp]={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  p.career[comp].matches++;p.career[comp].goals+=res.pg;p.career[comp].assists+=res.assist;
  p.careerTotal.matches++;p.careerTotal.goals+=res.pg;p.careerTotal.assists+=res.assist;
  if(p.objectives){p.objectives.forEach(o=>{if(o.id==='goals')o.current+=res.pg;else if(o.id==='assists')o.current+=res.assist;else if(o.id==='matches')o.current++})}
  if(comp==='league'&&res.pg>0){p._leaguesPlayed=p._leaguesPlayed||[];const k=getPlayerLeague(p.club.name);if(!p._leaguesPlayed.includes(k))p._leaguesPlayed.push(k)}
}
function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}return m}
function simCup(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key]||[];const pool=clubs.filter(c=>c.name!==p.club.name);for(let i=0;i<5;i++){const o=pick(pool.length?pool:clubs);const r=simMatch(o,['1/16','1/8','1/4','1/2','Финал'][i]);m.push(r);recordMatch('cup',r);if(r.missed)continue;if(r.tg<r.og&&i<4)break}const last=m[m.length-1];if(last&&last.tg>last.og&&m.length===5)p.trophies.push({name:'Кубок',season:p.season});return m}
function simCL(){const m=[];const top=Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=85&&c.name!==p.club.name);for(let i=0;i<3;i++){const r=simMatch(pick(top),'ЛЧ Группа');m.push(r);recordMatch('cl',r)}const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;if(wins>=2){for(const st of['1/8','1/4','1/2','Финал']){const r=simMatch(pick(top),'ЛЧ '+st);m.push(r);recordMatch('cl',r);if(r.missed)continue;if(r.tg<r.og)break;if(st==='Финал'){p.trophies.push({name:'ЛЧ',season:p.season});p.clWins=(p.clWins||0)+1;p.morale=cm(p.morale+20)}}}return m}

function simTournament(name,key){
  const m=[];const pool=NTS.filter(n=>n.name!==p.ntName);
  for(let i=0;i<3;i++){const o=pick(pool);const r=simMatch(o,name+' Группа');m.push(r);recordMatch(key,r)}
  const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;
  if(wins>=1){for(const st of['1/8','1/4','1/2','Финал']){const o=pick(pool);const r=simMatch(o,name+' '+st);m.push(r);recordMatch(key,r);if(r.missed)continue;if(r.tg<r.og)break}}
  return m;
}
function simNewTournaments(){
  const res={newTrophies:[]};const y=getYear();
  const isAfrican=AFRICAN_NTS.some(n=>n.name===p.ntName);
  const isAsian=ASIAN_NTS.some(n=>n.name===p.ntName);
  const isConcacaf=CONCACAF_NTS.some(n=>n.name===p.ntName);
  if(['eng_prem','esp_laliga','ita_seriea','ger_bundes','fra_ligue1','por_primeira','ned_eredivisie'].includes(getPlayerLeague(p.club.name))&&p.club.str>=75&&p.club.str<85){
    const matches=[];for(let i=0;i<6;i++){const opp=pick(Object.values(LEAGUE_CLUBS).flat().filter(c=>c.str>=72&&c.str<88));const r=simMatch(opp,'Лига Европы');matches.push(r);recordMatch('league',r)}
    const wins=matches.filter(m=>m.tg>m.og&&!m.missed).length;
    if(wins>=4&&Math.random()>0.5){p.trophies.push({name:'Лига Европы',season:p.season});res.newTrophies.push('Лига Европы')}
  }
  if(p.club.flag==='br'||p.club.flag==='ar'||p.club.flag==='uy'){if(Math.random()>0.4){p.trophies.push({name:'Кубок Либертадорес',season:p.season});res.newTrophies.push('Кубок Либертадорес')}}
  if(isAfrican&&p.ovr>=76&&y%2===0&&y>=2024){const matches=simTournament('Кубок Африки','copa_africa');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Кубок Африки',season:p.season});res.newTrophies.push('Кубок Африки')}}
  if(isAsian&&p.ovr>=76&&y%4===0&&y>=2027){const matches=simTournament('Кубок Азии','copa_asia');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Кубок Азии',season:p.season});res.newTrophies.push('Кубок Азии')}}
  if(isConcacaf&&p.ovr>=76&&y%2===1&&y>=2025){const matches=simTournament('Золотой Кубок','gold_cup');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Золотой Кубок',season:p.season});res.newTrophies.push('Золотой Кубок')}}
  if(p.ntRegion==='eu'&&p.ovr>=76&&y%2===1&&y>=2024){const matches=simTournament('Лига наций','nations_league');if(matches.some(m=>m.comp.includes('Финал')&&m.tg>m.og)){p.trophies.push({name:'Лига наций УЕФА',season:p.season});res.newTrophies.push('Лига наций УЕФА')}}
  return res;
}
function simConfederations(){
  const y=getYear();
  if(y%4!==0||y<2026)return null;
  if(p.ovr<85)return null;
  const m=[];
  for(let i=0;i<3;i++){
    const opp=pick(NTS);
    const r=simMatch(opp,'Кубок Конфедераций');
    m.push(r);recordMatch('euro',r);
  }
  const wins=m.filter(x=>x.tg>x.og&&!x.missed).length;

    p.trophies.push({name:'Кубок Конфедераций',season:p.season});
    showToast('🏆 Кубок Конфедераций выигран!','success');

}

function simSeason(){
  const res={league:[],cup:[],cl:[]};
  res.league=simLeague();res.cup=simCup();
  if(p.club.str>=80&&p.ovr>=72)res.cl=simCL();
  simConfederations();
  checkWorldXI();
  simAllStarMatch();
  simBeachWorldCup();
  simThreeVsThree();
  const newRes=simNewTournaments();
  if(newRes.newTrophies.length)p._newTrophies=newRes.newTrophies;
  const lw=res.league.filter(m=>m.tg>m.og&&!m.missed).length;
  const winRate=lw/res.league.length;
  const topClubs=Object.values(LEAGUE_CLUBS).flat().sort((a,b)=>b.str-a.str).slice(0,5);
  const isTopClub=topClubs.some(c=>c.name===p.club.name);
  if(winRate>=0.75&&isTopClub&&Math.random()<0.5){p.trophies.push({name:'Чемпионат',season:p.season})}
  return res;
}
function getRivalStriker(){
  if(!p._rivalStriker||p.season%3===0){p._rivalStriker=pick(RIVAL_STRIKERS)}
  p._rivalStriker.goals+=(p.ovr>85?ri(1,3):ri(0,2));
  return p._rivalStriker;
}
function checkSeasonAwards(stats){
  const rival=getRivalStriker();
  if(stats.goals<rival.goals)stats.goals=Math.min(stats.goals,rival.goals-1);
  const na=[];
  AWARD_DEFS.forEach(a=>{
    if(a.cat==='career'&&(p.awards||[]).some(x=>x.id===a.id))return;
    if(a.check(stats)){
      const aw={id:a.id,n:a.n,icon:a.icon,cat:a.cat,season:p.season,year:getYear()};
      p.awards=p.awards||[];p.awards.push(aw);na.push(aw);
      if(a.id==='ballon'){p.ballonDors=(p.ballonDors||0)+1;p.morale=cm(p.morale+25);p.fans=cm(p.fans+20)}
      else{p.morale=cm(p.morale+8);p.fans=cm(p.fans+5)}
    }
  });
  return na;
}
function convertTPtoMoney(){
  if(p.tp<=0){showToast('⚠️ Нет очков','warn');return}
  const bonus=p.tp*200000;const old=p.tp;
  p.money+=bonus;p.tp=0;
  addDiary(`Сбросил ${old} очков в €${fmt(bonus)}`);
  showToast(`💰 ${old} очков → €${fmt(bonus)}`,'success');
  save();showHomeTab();
}
function doTrain(stat){
  if(p.tp<=0)return;
  if(p[stat]>=99){showToast('⚠️ Уже MAX','warn');return}
  const gain=ri(1,3);p[stat]=cl(p[stat]+gain);
  p.tp--;p._tpSpent=(p._tpSpent||0)+1;
  p.ovr=calcOvr();p.salary=calcSalary(p.ovr,p.club.tier||1);
  haptic(15);
  if(['pac','sho','pas','dri','def','phy'].every(s=>p[s]>=99)&&p.tp>0){
    const bonus=p.tp*200000;p.money+=bonus;
    const old=p.tp;p.tp=0;
    showToast(`🏆 Все статы MAX! ${old} очков → €${fmt(bonus)}`,'success');
  }
  save();showHomeTab();
}

function showFamily(){
  if(!p.family||Array.isArray(p.family))p.family={status:'single',partner:null,children:[],history:[],weddingYear:null};
  const f=p.family;
  const statusText={single:'💔 Холост(а)',dating:'💕 В отношениях',married:'💍 Женат(а)',divorced:'💔 В разводе'};
  let html=`<div class="tab-title">👨‍👩‍👧 СЕМЬЯ</div>
  <div class="card" style="text-align:center"><div style="font-size:.7em;color:var(--muted)">СТАТУС</div><div style="font-size:1.2em;font-weight:800;color:var(--yellow);margin-top:4px">${statusText[f.status]||'💔 Холост'}</div></div>`;
  if(f.partner){
    html+=`<div class="card" style="background:linear-gradient(135deg,#2a0a2a,#1a051a);border:1px solid #d81b60">
    <div class="card-title" style="color:#f06292">💕 ${f.partner.name}</div>
    <div class="detail-row"><span class="nm">Род деятельности</span><span class="val" style="color:#f06292">${f.partner.trait}</span></div>
    <div class="detail-row"><span class="nm">Вместе с</span><span class="val">${f.partner.since} года</span></div>
    <div class="detail-row"><span class="nm">Бонус</span><span class="val" style="color:var(--green)">+${f.partner.morale} морали/сезон</span></div></div>`;
  }
  if(f.children&&f.children.length){
    html+=`<div class="card"><div class="card-title">👶 ДЕТИ (${f.children.length})</div>`;
    f.children.forEach(c=>{html+=`<div class="detail-row"><span class="nm">${c.name} · ${c.age} лет</span><span class="val">${c.born}</span></div>`});
    html+=`</div>`;
  }
  html+=`<div class="card"><div class="card-title">🎬 ДЕЙСТВИЯ</div>`;
  if(f.status==='single'||f.status==='divorced'){
    if(p.age<20)html+=`<div class="muted text-center" style="font-size:.75em;padding:10px">Поиск доступен с 20 лет</div>`;
    else html+=`<button class="btn" style="background:linear-gradient(135deg,#d81b60,#ad1457)" onclick="findPartner()">💕 Найти вторую половинку</button>`;
  }
  if(f.status==='dating'&&f.partner){
    const yearsTogether=p.season-(f.partner.sinceSeason||p.season);
    if(yearsTogether>=1)html+=`<button class="btn" style="background:linear-gradient(135deg,#d81b60,#ad1457)" onclick="marryPartner()">💍 Жениться на ${f.partner.name}</button>`;
    else html+=`<div class="muted text-center" style="font-size:.75em;padding:10px">Можно жениться через год</div>`;
    html+=`<button class="btn btn-gray" onclick="breakUpPartner()">💔 Расстаться</button>`;
  }
  if(f.status==='married'){
    if((f.children||[]).length<4)html+=`<button class="btn btn-blue" onclick="haveChild()">👶 Завести ребёнка</button>`;
    html+=`<button class="btn btn-red" onclick="divorcePartner()">💔 Развестись</button>`;
  }
  html+=`</div>`;
  if(f.history&&f.history.length){
    html+=`<div class="card"><div class="card-title">📖 ИСТОРИЯ</div>`;
    f.history.slice(-8).reverse().forEach(h=>{html+=`<div class="detail-row"><span class="nm">${h.year} (${h.age} лет)</span><span class="val" style="font-size:.85em;text-align:right;color:var(--text)">${h.text}</span></div>`});
    html+=`</div>`;
  }
  // Сын-футболист
  if(f.children&&f.children.some(c=>c.age>=18)&&!p.sonCareer){
    const son=f.children.find(c=>c.age>=18);
    html+=`<div class="card" style="border:2px solid gold;background:linear-gradient(135deg,#2a2a0a,#1a1a05)">
      <div class="card-title" style="color:var(--yellow)">⚽ НАСЛЕДИЕ</div>
      <div class="muted" style="font-size:.75em;margin-bottom:8px">Сын ${son.name} (18 лет) готов начать карьеру!</div>
      <button class="btn btn-gold" onclick="startSonCareer('${son.name}')">🚀 Начать карьеру сына</button>
    </div>`;
  }
  html+=`<button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
  content.innerHTML=html;
}
function findPartner(){
  const f=p.family;
  const gender=p.gender||'m';
  const nationNames=PARTNER_NAMES_BY_NATION[p.ntFlag]||PARTNER_NAMES_BY_NATION.es;
  const namePool=gender==='m'?nationNames.f:nationNames.m;
  const name=pick(namePool);
  const trait=pick(PARTNER_TRAITS);
  if(trait.cost>p.money/1e6){showToast(`⚠️ Нужно €${trait.cost}M`,'error');return}
  const isCelebrity=trait.cost>=5;
  const weddingCost=isCelebrity?Math.round(trait.cost*3):trait.cost;
  if(!confirm(`Найти ${trait.n.toLowerCase()} по имени ${name}?${isCelebrity?'\n💒 Свадьба на 1000 гостей!':''}\nБонус: +${trait.morale} морали, +${trait.press} прессы, +${trait.fans} фанатов\nСтоимость: €${weddingCost}M`))return;
  p.money-=weddingCost*1e6;
  f.partner={name,trait:trait.n,morale:trait.morale,press:trait.press,fans:trait.fans,since:getYear(),sinceSeason:p.season,celebrity:isCelebrity};
  f.status='dating';
  f.history.push({year:getYear(),age:p.age,text:`💕 Познакомился с ${name} (${trait.n})`});
  if(isCelebrity){addTweet('Gossip',`📸 ${p.name} с ${trait.n.toLowerCase()} ${name}!`);p.press=cm(p.press+30);p.fans=cm(p.fans+20);showToast(`💕💒 Свадьба на 1000 гостей! -€${weddingCost}M`,'success')}
  else{addTweet('Gossip',`${p.name} с ${name}`);showToast(`💕 Встречаешься с ${name}!`,'success')}
  p.morale=cm(p.morale+trait.morale*0.5);
  save();showFamily();
}
function marryPartner(){
  const f=p.family;if(!f.partner)return;
  const cost=ri(3,15);
  if(p.money<cost*1e6){showToast('⚠️ €'+cost+'M нужно','error');return}
  if(!confirm(`Свадьба с ${f.partner.name}!\nСтоимость: €${cost}M`))return;
  p.money-=cost*1e6;f.status='married';f.weddingYear=getYear();
  f.history.push({year:getYear(),age:p.age,text:`💍 Женился на ${f.partner.name}!`});
  addTweet('News',`${p.name} женился на ${f.partner.name}!`);
  addDiary(`💍 Свадьба с ${f.partner.name}!`);
  p.morale=cm(p.morale+20);p.fans=cm(p.fans+15);p.press=cm(p.press+20);
  showToast('💍 Поздравляем!','success');save();showFamily();
}
function breakUpPartner(){
  if(!confirm('Точно расстаться?'))return;
  const f=p.family;
  f.history.push({year:getYear(),age:p.age,text:`💔 Расстался с ${f.partner.name}`});
  f.partner=null;f.status='divorced';p.morale=cm(p.morale-10);p.press=cm(p.press-5);
  showToast('💔 Расстались','warn');save();showFamily();
}
function haveChild(){
  const f=p.family;if(!f.partner){showToast('⚠️ Нужен партнёр','error');return}
  if((f.children||[]).length>=4){showToast('⚠️ Максимум 4','warn');return}
  const cost=ri(1,5);
  if(p.money<cost*1e6){showToast('⚠️ €'+cost+'M','error');return}
  const kidsPool=KIDS_NAMES_BY_NATION[p.ntFlag]||KIDS_NAMES_BY_NATION.es;
  const name=pick(kidsPool);
  if(!confirm(`Завести ребёнка по имени ${name}?\nСтоимость: €${cost}M`))return;
  p.money-=cost*1e6;
  f.children=f.children||[];
  f.children.push({name,age:0,born:getYear()});
  f.history.push({year:getYear(),age:p.age,text:`👶 Родился ${name}!`});
  addDiary(`👶 Родился ${name}!`);
  addTweet('News',`${p.name} стал отцом! Ребёнка зовут ${name}.`);
  p.morale=cm(p.morale+20);p.trust=cm(p.trust+5);
  showToast(`👶 Поздравляем с ${name}!`,'success');
  save();showFamily();
}
function divorcePartner(){
  if(!confirm('Развестись? Потеряешь €10M'))return;
  const f=p.family;
  f.history.push({year:getYear(),age:p.age,text:`💔 Развод с ${f.partner.name}`});
  f.partner=null;f.status='divorced';
  p.money-=10e6;p.morale=cm(p.morale-30);p.press=cm(p.press+15);p.fans=cm(p.fans-10);
  showToast('💔 Развелись','error');save();showFamily();
}
function updateFamilyYearly(){
  if(!p.family||Array.isArray(p.family))return;
  const f=p.family;
  if(f.children)f.children.forEach(c=>{c.age++});
  if(f.partner){p.morale=cm(p.morale+Math.round(f.partner.morale*0.3));p.fans=cm(p.fans+Math.round(f.partner.fans*0.2))}
}
function rollFamilyEvent(){
  if(!p.family||!p.family.partner)return null;
  if(Math.random()>0.15)return null;
  const events=[
    {t:'📸 Папарацци засняли вас',eff:()=>{p.press=cm(p.press+5);p.fans=cm(p.fans+3)}},
    {t:'💔 Ссора с партнёром',eff:()=>{p.morale=cm(p.morale-8)}},
    {t:'🎁 Партнёр сделал подарок',eff:()=>{p.morale=cm(p.morale+8)}},

function makeFriend(){
  if(p.friends.length>=5){showToast('⚠️ Максимум 5','warn');return}
  if(p.money<1e6){showToast('⚠️ Нужно €1M','error');return}
  p.money-=1e6;
  const name=pick(FRIEND_NAMES);const reason=pick(FRIEND_REASONS);const bonus=ri(1,3);
  p.friends.push({name,club:p.club.name,reason,bonus});
  p.partners=cm(p.partners+5);
  addDiary(`🤝 Подружился с ${name}`);
  showToast(`🤝 ${name}! +${bonus} ассистов`,'success');
  save();showFriends();
}
function resolveEnemy(){
  if(!p.enemies.length)return;
  const e=p.enemies[0];
  const roll=Math.random();
  if(roll<0.5){p.enemies.shift();p.morale=cm(p.morale+10);showToast(`🤝 Помирились с ${e.name}!`,'success')}
  else{p.morale=cm(p.morale-5);showToast(`💥 Конфликт с ${e.name} усилился`,'error')}
  save();showFriends();
}
function generateEnemy(){
  if(!p.enemies)p.enemies=[];
  if(p.enemies.length>=2)return;
  if(Math.random()>0.3)return;
  const name=pick(['Роналду','Месси','Мбаппе','Холанд','Неймар','Салах'].filter(n=>n!==p.name));
  p.enemies.push({name,reason:'борьба за место в составе',dmg:2});
  addDiary(`⚔️ Конфликт с ${name}`);
}

/* ============ БИЗНЕС ============ */
function buyBusiness(id){
  const b=BUSINESS_TYPES.find(x=>x.id===id);if(!b)return;
  if(p.ovr<b.reqOvr){showToast(`🔒 Нужен OVR ${b.reqOvr}+`,'error');return}
  if(p.money<b.cost){showToast(`💰 Нужно €${fmt(b.cost)}`,'error');return}
  p.money-=b.cost;
  if(!p.businesses)p.businesses=[];
  if(b.id==='crypto'){
    const roll=Math.random();
    if(roll<0.4){const profit=ri(2,10)*b.cost;p.money+=profit;showToast(`₿ Крипта ×${Math.round(profit/b.cost)}! +€${fmt(profit)}`,'success')}
    else if(roll<0.7){p.money+=b.cost;showToast('₿ Крипта без изменений','info')}
    else{showToast(`₿ Крипта рухнула! -€${fmt(b.cost)}`,'error')}
    save();showMediaEmpire();return;
  }
  if(b.id==='betshop'&&Math.random()<0.1){
    p.finished=true;p.endType='ban';p.endCause='Незаконная букмекерская деятельность';
    showToast('🚔 Тебя поймали! Дисквалификация','error');
    save();showEnd();return;
  }
  if(b.id==='startup'){
    p._startupYear=getYear();p._startupInvested=b.cost;
    showToast('🚀 Стартап запущен!','info');save();showMediaEmpire();return;
  }
  if(b.id==='michelin'){
    p._michelinYear=getYear();p.passive=(p.passive||0)+8;
    showToast('🍽️ Ресторан открыт!','success');save();showMediaEmpire();return;
  }
  p.businesses.push({id:b.id,n:b.n,income:b.income});
  p.passive=(p.passive||0)+b.income;
  addDiary(`💼 Открыл ${b.n} за €${fmt(b.cost)}`);
  showToast(`✅ ${b.n}!`,'success');
  save();showMediaEmpire();
}

function buyMedia(id){
  const m=MEDIA_TYPES.find(x=>x.id===id);if(!m)return;
  if(p.ovr<m.reqOvr){showToast(`🔒 Нужен OVR ${m.reqOvr}+`,'error');return}
  if(m.reqFans&&p.fans<m.reqFans){showToast(`🔒 Фанатов ${m.reqFans}+`,'error');return}
  if(m.reqRep&&p.press<m.reqRep){showToast(`🔒 Пресса ${m.reqRep}+`,'error');return}
  if(m.reqSeason&&p.season<m.reqSeason){showToast(`🔒 Сезонов ${m.reqSeason}+`,'error');return}
  if(p.money<m.cost){showToast(`💰 €${fmt(m.cost)}`,'error');return}
  p.money-=m.cost;p.media=p.media||[];
  p.media.push({id:m.id,n:m.n,income:m.income,cost:m.cost,purchasedAt:getYear()});
  p.passive=(p.passive||0)+m.income;
  addDiary(`📹 Открыл ${m.n} за €${fmt(m.cost)}`);
  addTweet('Business',`${p.name} запускает ${m.n}!`);
  showToast(`✅ ${m.n}! -€${fmt(m.cost)}`,'success');
  save();showMediaEmpire();
}

function makePost(platform){const types={instagram:'photo',tiktok:'goal',twitter:'opinion',youtube:'vlog'};makePostCustom(platform,types[platform])}
function makePostCustom(platform,type){
  const costs={instagram:1e5,tiktok:1e5,twitter:5e4,youtube:2e5};
  const cost=costs[platform]||1e5;
  if(p.money<cost){showToast(`⚠️ Нужно €${fmt(cost)}`,'error');return}
  const texts=POST_TEXTS[platform][type]||POST_TEXTS[platform][Object.keys(POST_TEXTS[platform])[0]];
  const text=pick(texts);
  p.money-=cost;
  const baseGain=ri(50000,500000);
  const fanMult=1+p.fans/100;
  const ovrMult=1+(p.ovr-70)/100;
  const gain=Math.round(baseGain*fanMult*ovrMult);
  p.socialMedia[platform]=(p.socialMedia[platform]||0)+gain;
  const likes=Math.round(gain*ri(3,8));
  const views=Math.round(gain*ri(5,15));
  const comments=generateComments(platform,likes);
  p.socialFeed=p.socialFeed||[];
  p.socialFeed.unshift({platform,type,text,likes,views,comments,year:getYear(),timestamp:Date.now()});
  if(p.socialFeed.length>30)p.socialFeed.pop();
  p.fans=cm(p.fans+ri(1,3));
  p.morale=cm(p.morale+ri(0,2));
  showToast(`📱 +${fmt(gain)} подписчиков! -€${fmt(cost)}`,'success');
  haptic(20);save();switchSocialTab('feed');
}
function generateComments(platform,likes){
  const users=['football_fan','goal_machine','soccer_lover','⚽GOD⚽','ultras_brigade','messi_10','cr7_forever','tiki_taka','ana_maria','pedro_90','kate_the_goat','nordic_lad','samba_king'];
  const good=['Это было эпично! 🔥','Ты лучший!','ЛЕГЕНДА!!!','Невероятно 😍','Так держать!','Гоат 🐐','Удачи!','Спасибо за победу!','Лучший!','ГОООООЛ!','Мой кумир ❤️','Огонь 🔥🔥🔥'];
  const bad=['Слабо 😏','Тренируйся лучше','Не твой день','Мало голов','Ожидал большего','Работай больше'];
  const negative=Math.random()<0.15;
  const num=ri(2,6);
  const result=[];
  for(let i=0;i<num;i++)result.push({user:pick(users),text:negative&&Math.random()<0.4?pick(bad):pick(good)});
  return result;
}

function generateTransferPlayer(baseStr=75,minOvr=null,maxOvr=null){
  const nation=pick(TRANSFER_NATIONS);
  const firstName=pick(TRANSFER_FIRST_NAMES[nation.code]||TRANSFER_FIRST_NAMES.en);
  const lastName=pick(TRANSFER_LAST_NAMES[nation.code]||TRANSFER_LAST_NAMES.en);
  const pos=pick(POSITIONS_LIST);
  const age=ri(17,35);
  let ovr;
  if(minOvr!==null&&maxOvr!==null)ovr=ri(minOvr,maxOvr);
  else{let mod=0;if(age<20)mod=-10;else if(age<24)mod=-3;else if(age<28)mod=5;else if(age<32)mod=0;else mod=-8;ovr=cl(baseStr+mod+ri(-8,10))}
  let value=Math.round(Math.pow(ovr/10,3.5)*0.3);
  if(age<23)value=Math.round(value*1.5);else if(age>30)value=Math.round(value*0.6);
  const wage=Math.max(1,Math.round(ovr/8));
  return{id:Date.now()+Math.random(),name:firstName+' '+lastName,pos,age,ovr,value,wage,flag:nation.flag,nation:nation.name,injured:0,young:age<23};
}

      html+=`<div class="card" style="background:var(--card2);border-left:3px solid var(--green);margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:8px"><img id="${safeId}" src="${logo}" style="width:30px;height:30px;object-fit:contain" onerror="this.src='${svgBadge(c.name)}'">

      <button class="btn" onclick="acceptTransferPre('${c.name}',${price})">✍️ Подписать</button>`;
    });
  } else html+=`<div class="card text-center muted">Предложений нет</div>`;
  html+=`<button class="btn btn-gray" onclick="skipTransferAndPlay()" style="margin-top:10px">🏠 Остаться в ${p.club.name}</button>`;
  content.innerHTML=html;
}
function acceptTransferPre(name,price){
  const all=Object.values(LEAGUE_CLUBS).flat();
  const c=all.find(x=>x.name===name);
  if(c){
    p.club=c;p.money+=price*1e6;p.salary=calcSalary(p.ovr,c.tier||2);
    p.trust=cm(p.trust+5);p.morale=cm(p.morale+5);
    // Языковой барьер при смене страны
    const newLang=COUNTRY_LANG[getPlayerLeague(c.name)]||'en';
    if(p.language&&p.language.known!==newLang){
      p.languageBarrier=2;p.language.club=newLang;
      showToast(`🌍 Языковой барьер! Штраф 2 сезона`,'warn');
    }
    addDiary(`Перешёл в ${c.name}`);showToast(`✅ ${c.name}!`,'success');
  }
  runSeasonSimulation();
}

  <button class="btn btn-gray" onclick="showMainMenu()">← Назад</button>`;
}
function startDraft(){
  let myTeam=[],aiTeam=[],pool=[...DRAFT_LEGENDS].sort(()=>Math.random()-.5);
  function draftTurn(){
    if(myTeam.length>=11||pool.length===0){finishDraft(myTeam,aiTeam);return}
    let html=`<div class="tab-title">⚔️ ДРАФТ (${myTeam.length}/11)</div>
    <div class="card"><div class="card-title">ТВОЯ КОМАНДА</div><div style="font-size:.7em">${myTeam.map(l=>`${l.country} ${l.n}`).join(', ')||'Пусто'}</div></div>
    <div class="card-title">📋 ВЫБЕРИ ЛЕГЕНДУ</div>`;
    pool.slice(0,4).forEach((l)=>{html+=`<div class="story-card" onclick="pickLegend(${DRAFT_LEGENDS.indexOf(l)})"><div class="ttl">${l.country} ${l.n}</div><div class="desc">${l.pos} · OVR ${l.ovr}</div></div>`});
    content.innerHTML=html;
  }
  window.pickLegend=(idx)=>{const l=DRAFT_LEGENDS[idx];if(!l)return;myTeam.push(l);const poolIdx=pool.indexOf(l);if(poolIdx>=0)pool.splice(poolIdx,1);if(pool.length){const aiPick=pool.splice(ri(0,pool.length-1),1)[0];aiTeam.push(aiPick)}haptic(20);draftTurn()};
  window.finishDraft=(my,ai)=>{
    const mySum=my.reduce((s,l)=>s+l.ovr,0);const aiSum=ai.reduce((s,l)=>s+l.ovr,0);const win=mySum>aiSum;
    content.innerHTML=`<div class="tab-title">🏆 РЕЗУЛЬТАТ</div>
    <div class="card" style="text-align:center;background:linear-gradient(135deg,${win?'#2e7d32,#4caf50':'#c62828,#f44336'},#0a0a0a)">
      <div style="font-size:3em">${win?'🏆':'😢'}</div>
      <div style="font-size:1.5em;font-weight:900;color:#fff;margin-top:8px">${win?'ПОБЕДА!':'ПОРАЖЕНИЕ'}</div>
      <div style="font-size:.85em;color:#fff;margin-top:8px">Ты: ${mySum} · ИИ: ${aiSum}</div>
    </div>
    <button class="btn btn-gray" onclick="showMainMenu()">← В меню</button>`;
    if(win)playGoalSound();haptic(50);
  };
  draftTurn();
}

function godAddAll(){p.money=9999e6;p.pac=99;p.sho=99;p.pas=99;p.dri=99;p.def=99;p.phy=99;p.ovr=99;p.morale=100;p.fans=100;p.salary=50000000;save();showToast('👑 ВСЁ!','warn');showHomeTab()}
function transferRequest(){
  if(p._transferRequested){showToast('⚠️ Уже запрашивал','warn');return}
  if(!confirm('Запросить трансфер? Клуб может отказать.'))return;
  p._transferRequested=true;
  if(Math.random()<0.6){p._forcedTransfer=true;showToast('📤 Клуб согласился!','success');addDiary('Запросил трансфер')}
  else{p.trust=cm(p.trust-30);p._benched=true;showToast('❌ Отказали! Ты на лавке','error')}
  save();showHomeTab();
}
function talkToPresident(){
  if(p._talkedPresident&&p.season===p._lastTalkSeason){showToast('⚠️ Раз в сезон','warn');return}
  p._talkedPresident=true;p._lastTalkSeason=p.season;
  if(Math.random()<0.5){p.salary=Math.round(p.salary*1.3);showToast(`💰 ЗП → €${fmt(p.salary)}/год`,'success');addDiary('Повышение от президента')}
  else{p.trust=cm(p.trust-10);showToast('😠 Президент отказал','error')}
  save();showHomeTab();
}

/* ============ МЕНЕДЖЕРЫ ============ */
function showManagers(){
  const current=p.manager?.id||0;
  content.innerHTML=`<div class="tab-title">👔 МЕНЕДЖЕРЫ</div>
  <div class="card" style="text-align:center"><div style="font-weight:800;color:var(--yellow)">💰 €${fmt(p.money)}</div></div>
  <div class="search-wrap"><input class="search-input" id="mgrSearch" placeholder="Поиск..." oninput="renderManagers()"></div>
  <div class="quick-tabs" id="mgrTabs">
    <button class="quick-tab active" data-tier="all" onclick="filterManagerTier('all')">Все</button>
    <button class="quick-tab" data-tier="1" onclick="filterManagerTier(1)">T1</button>
    <button class="quick-tab" data-tier="2" onclick="filterManagerTier(2)">T2</button>
    <button class="quick-tab" data-tier="3" onclick="filterManagerTier(3)">T3</button>
    <button class="quick-tab" data-tier="4" onclick="filterManagerTier(4)">T4</button>
    <button class="quick-tab" data-tier="5" onclick="filterManagerTier(5)">T5</button>
  </div>
  <div id="mgrList"></div>
  <button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
  window._mgrFilter={tier:'all',search:''};renderManagers();
}
function filterManagerTier(t){window._mgrFilter.tier=t;document.querySelectorAll('#mgrTabs .quick-tab').forEach(b=>b.classList.toggle('active',b.dataset.tier==String(t)));renderManagers()}
function renderManagers(){
  const f=window._mgrFilter||{tier:'all',search:''};
  f.search=($('mgrSearch')?.value||'').toLowerCase();
  let list=MANAGERS;
  if(f.tier!=='all')list=list.filter(m=>String(m.tier)===String(f.tier));
  if(f.search)list=list.filter(m=>m.n.toLowerCase().includes(f.search));
  const current=p.manager?.id||0;
  const myOvr=p.ovr||60;
  const listDiv=$('mgrList');if(!listDiv)return;
  listDiv.innerHTML=list.map(m=>{
    const owned=current===m.id;const canAfford=p.money>=m.cost;const ovrOk=myOvr>=m.reqOvr;
    const available=canAfford&&ovrOk;
    let clazz=owned?'owned':(available?'':'locked');
    let click='';
    if(!owned&&available)click=`onclick="hireManager(${m.id})"`;
    let reason='';
    if(!ovrOk)reason=`<div style="color:var(--red);font-size:.65em;text-align:center;margin-top:4px">🔒 Нужен OVR ${m.reqOvr}+ (у тебя ${myOvr})</div>`;
    else if(!canAfford)reason=`<div style="color:var(--red);font-size:.65em;text-align:center;margin-top:4px">💰 Не хватает €${fmt(m.cost-p.money)}</div>`;
    return `<div class="manager-card ${clazz}" ${click}>
      <div class="mc-head"><div class="mc-avatar">${m.avatar}</div><div class="mc-info"><div class="mc-name">${m.n} ${owned?'✅':''}</div><div class="mc-tier">${m.desc}</div></div></div>
      <div class="mc-stats"><div>Опыт<b>${m.exp}</b></div><div>Комис<b>${m.com}%</b></div><div>Цена<b style="color:${canAfford?'#4caf50':'#f44336'}">€${fmt(m.cost)}</b></div></div>${reason}</div>`;
  }).join('');
}
function hireManager(id){
  const m=MANAGERS.find(x=>x.id===id);if(!m)return;
  if(p.manager&&p.manager.id===m.id)return;
  if(p.ovr<m.reqOvr){showToast(`🔒 Нужен OVR ${m.reqOvr}+`,'error');return}
  if(p.money<m.cost){showToast(`💰 Нужно €${fmt(m.cost)}`,'error');return}
  p.money-=m.cost;
  if(p.manager)p.salary=Math.round(p.salary/(1+p.manager.com/100));
  p.manager=m;p.salary=Math.round(p.salary*(1+m.com/100));
  addDiary(`Нанял ${m.n} за €${fmt(m.cost)}`);save();
  showToast(`✅ ${m.n}! -€${fmt(m.cost)}`,'success');showManagers();
}

/* ============ ТРАНСФЕРЫ ============ */
function showTransfers(){
  const sg=(p.lastSeasonStats?.goals||0)+(p.lastSeasonStats?.assists||0);
  const mb=(p.manager?.tier||1)*2;
  const perf=p.ovr+sg*0.3+mb;
  let maxTier=1;if(perf>95)maxTier=5;else if(perf>88)maxTier=4;else if(perf>80)maxTier=3;else if(perf>72)maxTier=2;
  maxTier=Math.min(5,maxTier+((p.manager?.tier||1)-1));
  const avail=[];
  for(const[key,clubs]of Object.entries(LEAGUE_CLUBS)){const lt=LEAGUES[key]?.tier||2;if(lt<=maxTier){clubs.forEach(c=>{if(c.name!==p.club.name&&(c.tier||2)<=maxTier)avail.push({...c,leagueKey:key})})}}
  let html=`<div class="tab-title">📩 ПРЕДЛОЖЕНИЯ</div>`;
  html+=`<div class="card"><div class="card-title">🔍 ИЛИ ВЫБЕРИ САМ</div><button class="btn btn-blue" onclick="showClubPicker('Твой новый клуб',(name)=>{acceptTransfer(name,0)})">🏆 Все лиги и клубы</button></div>`;
  if(avail.length){
    const num=Math.min(4,1+Math.floor((p.manager?.tier||1)/2)+Math.floor(p.ovr/28));
    const sh=avail.sort(()=>Math.random()-.5).slice(0,num);
    html+=`<div class="card-title">📨 ОТ АГЕНТА</div>`;
    sh.forEach(c=>{const price=Math.round(p.ovr*ri(3,8)/10);const ns=calcSalary(p.ovr,c.tier||2);const ln=LEAGUES[c.leagueKey]?.name||'';const logo=logoCache[c.name]||svgBadge(c.name);
      const safeId='tr_'+c.name.replace(/[^a-zA-Z0-9]/g,'_');
      setTimeout(()=>{getLogo(c.name).then(u=>{const el=document.getElementById(safeId);if(el)el.src=u})},10);
      html+=`<div class="card" style="background:var(--card2);border-left:3px solid var(--green)"><div style="display:flex;align-items:center;gap:8px"><img id="${safeId}" src="${logo}" style="width:30px;height:30px;object-fit:contain" onerror="this.src='${svgBadge(c.name)}'"><div><div style="font-weight:800;font-size:.85em">${c.name}</div><div style="font-size:.65em;color:var(--muted)">${ln} · Сила ${c.str}</div></div></div><div style="font-size:.7em;color:var(--green);margin-top:4px">💰 €${fmt(ns)}/год · €${price}M</div></div><button class="btn" onclick="acceptTransfer('${c.name}',${price})">✍️ Подписать</button>`});
  }
  html+=`<button class="btn btn-gray" onclick="switchTab('home')">🏠 Остаться</button>`;
  content.innerHTML=html;
}
function acceptTransfer(name,price){
  const all=Object.values(LEAGUE_CLUBS).flat();
  const c=all.find(x=>x.name===name);
  if(c){
    p.club=c;p.money+=price*1e6;p.trust=cm(p.trust+10);p.morale=cm(p.morale+10);
    p.salary=calcSalary(p.ovr,c.tier||2);
    const newLang=COUNTRY_LANG[getPlayerLeague(c.name)]||'en';
    if(p.language&&p.language.known!==newLang){p.languageBarrier=2;p.language.club=newLang;showToast(`🌍 Языковой барьер!`,'warn')}
    addDiary(`Перешёл в ${c.name}`);
  }
  save();showToast(`✅ ${name}!`,'success');switchTab('home');
}

let clubPickerState={league:null,callback:null,title:'Выбор клуба',filterFn:null};
function showClubPicker(title,callback,filterFn){clubPickerState.title=title||'Выбор клуба';clubPickerState.callback=callback;clubPickerState.filterFn=filterFn||null;renderLeagueList()}
function renderLeagueList(){

  Object.keys(LEAGUE_IDS).forEach(key=>{

    const logo=leagueLogoCache[key]||'';

  });

function pickLeague(key){
  const clubs=LEAGUE_CLUBS[key]||[];

  let html=`<div class="tab-title">🏆 ${LEAGUE_IDS[key].ru}</div><div class="card-title">📋 ВЫБЕРИ КЛУБ (${filtered.length})</div>`;
  filtered.forEach(c=>{
    const logo=logoCache[c.name]||svgBadge(c.name);
    const safeId='club_'+c.name.replace(/[^a-zA-Z0-9]/g,'_');
    html+=`<button class="btn" onclick="pickClub('${c.name}')" style="background:var(--card2);border:1px solid var(--border);font-size:.75em;padding:10px;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <img id="${safeId}" src="${logo}" style="width:32px;height:32px;object-fit:contain" onerror="this.src='${svgBadge(c.name)}'">
      <div style="flex:1"><div style="font-weight:800">${c.name}</div><div style="font-size:.75em;color:var(--muted)">Сила ${c.str} · Tier ${c.tier||2}</div></div></button>`;

  html+=`<button class="btn btn-gray" onclick="renderLeagueList()">← К лигам</button>`;

/* ============ СИМУЛЯЦИЯ СЕЗОНА ============ */
function runSeasonSimulation(){
  // Рост статов
  let gm=1;
  if(p.age<=18)gm=2.0;else if(p.age<=20)gm=1.6;else if(p.age<=24)gm=1.2;else if(p.age<=28)gm=0.7;else gm=0.3;
  p.pac=cl(p.pac+Math.round(ri(0,4)*gm));
  p.sho=cl(p.sho+Math.round(ri(0,5)*gm));
  p.pas=cl(p.pas+Math.round(ri(0,4)*gm));
  p.dri=cl(p.dri+Math.round(ri(0,4)*gm));
  p.def=cl(p.def+Math.round(ri(-1,3)*gm));
  p.phy=cl(p.phy+Math.round(ri(0,3)*gm));
  p.ovr=calcOvr();p.form*=.6;
  const tpBase=p.age<=20?ri(8,20):p.age<=24?ri(6,15):p.age<=28?ri(4,10):ri(2,6);
  p.tp=tpBase;
  // Доходы
  const mediaIncome=(p.passive||0)*1e6;
  const adIncome=(p.adBrands||[]).reduce((s,b)=>s+b.pay,0)*1e6;
  const socialIncome=updateSocialMedia()*1e6;
  const salaryIncome=p.salary||0;
  const sponsorIncome=p.sponsorValue||0;
  const grossIncome=salaryIncome+sponsorIncome+socialIncome;
  const taxRate=(TAX_RATES[p.ntFlag]||35)/100;
  let tax=grossIncome*taxRate;
  if(p.hasTaxAdvisor)tax*=0.7;
  const totalIncome=salaryIncome+sponsorIncome+socialIncome+mediaIncome+adIncome-tax;
  p.money+=totalIncome;
  p._lastIncome={salary:salaryIncome,sponsor:sponsorIncome,media:mediaIncome,ads:adIncome,social:socialIncome,tax:tax,total:totalIncome};
  p._lastTax=tax;
  p.salary=calcSalary(p.ovr,p.club.tier||1);
  p.injuryShield=false;p.weather=getWeather();
  // Семья, соцсети, друзья
  updateFamilyYearly();
  generateFanPosts();
  generateEnemy();
  // Бонус от друзей
  if(p.friends&&p.friends.length){const friendBonus=p.friends.reduce((s,f)=>s+f.bonus,0);p.careerTotal.assists+=friendBonus}
  // Симуляция матчей
  const before=JSON.parse(JSON.stringify(p.career));
  const season=simSeason();
  const sStats={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  COMPS.forEach(c=>{
    if(!before[c])before[c]={matches:0,goals:0,assists:0};
    sStats.matches+=p.career[c].matches-before[c].matches;
    sStats.goals+=p.career[c].goals-before[c].goals;
    sStats.assists+=p.career[c].assists-before[c].assists;
  });
  checkObjectives();
  // Награды за цели
  let objReward=0,objDone=0;
  (p.objectives||[]).forEach(o=>{if(o.done){objDone++;objReward+=(o.reward||2)}});
  if(objReward>0){p.money+=objReward*1e6;setTimeout(()=>showToast(`🎯 Цели: ${objDone}/${(p.objectives||[]).length} · +€${objReward}M`,'success'),600)}
  const newObjectives=genObjectives();
  const famEv=rollFamilyEvent();
  checkChallenges();
  if(!p.injury)p._noInjurySeason=true;else p._noInjurySeason=false;
  // Стартап
  if(p._startupInvested&&getYear()-p._startupYear>=5){
    if(Math.random()<0.4){p.money+=p._startupInvested*5;showToast('🚀 Стартап ×5! +€'+fmt(p._startupInvested*5),'success')}
    else if(Math.random()<0.6){p.money+=p._startupInvested;showToast('🚀 Стартап вернул вложения','info')}
    else{showToast('🚀 Стартап прогорел','error')}
    p._startupInvested=null;p._startupYear=null;
  }
  if(p._michelinYear&&getYear()-p._michelinYear>=3&&!p._michelinStar){p._michelinStar=true;p.passive+=10;showToast('⭐ Michelin звезда! +€10M/сезон','warn')}
  // Языковой барьер
  if(p.languageBarrier&&p.languageBarrier>0){
    p.languageBarrier--;
    if(p.languageBarrier===0){p.language.known=p.language.club;showToast('🌍 Ты выучил язык!','success')}
  }
  const newAwards=checkSeasonAwards({...sStats,...season});
  p.history.push({age:p.age,year:getYear(),club:p.club.name,salary:p.salary,...sStats});
  p.seasonCards=p.seasonCards||[];
  p.seasonCards.push({year:getYear()-1,ovr:p.ovr,club:p.club.name,goals:sStats.goals,assists:sStats.assists,matches:sStats.matches});
  ACHIEVEMENTS.forEach(a=>{if(!(p.achievements||[]).includes(a.id)&&a.check()){p.achievements=p.achievements||[];p.achievements.push(a.id)}});
  addDiary(`Сезон ${getYear()-1}/${getYear()}. ${p.club.name}. ${sStats.goals} голов.`);
  if(Math.random()<.5)genTweet();
  p.lastSeasonStats=sStats;p.objectives=newObjectives;
  if(sStats.goals>=3)setTimeout(()=>speak(`Гол! ${p.name}`),800);
  const ev=p._pendingEvent||{text:'Сезон прошёл без событий'};
  p._pendingEvent=null;
  save();render();
  if(p._newTrophies&&p._newTrophies.length){
    setTimeout(()=>{openModal(`<div class="modal-title">🏆 НОВЫЕ ТРОФЕИ!</div>${p._newTrophies.map(t=>`<div style="text-align:center;padding:10px;font-weight:800;color:var(--yellow)">🏆 ${t}</div>`).join('')}<button class="modal-close" onclick="closeModal()">Забрать</button>`);p._newTrophies=null},800);
  }
  if(famEv)setTimeout(()=>showToast(famEv.t,'success'),1200);
  showSeasonRecap(season,ev,sStats,newAwards);
}

/* ============ ОТЧЁТ СЕЗОНА ============ */
function showSeasonRecap(s,ev,stats,newAwards){
  const year=getYear();
  let html=`<div class="card" style="background:linear-gradient(135deg,#2a1a4a,#4a1a6a);text-align:center">
    <div style="font-size:.7em;color:#ccc">СЕЗОН</div>
    <div style="font-size:1.3em;font-weight:800;color:var(--yellow)">${year-1}/${year}</div>
    <div style="font-size:.7em;color:#fff;margin-top:4px">${p.club.name}</div></div>`;
  if(s.league.length){
    const wins=s.league.filter(m=>m.tg>m.og&&!m.missed).length;
    const draws=s.league.filter(m=>m.tg===m.og&&!m.missed).length;
    const losses=s.league.filter(m=>m.tg<m.og&&!m.missed).length;
    html+=`<div class="card"><div class="card-title">🏟️ ЧЕМПИОНАТ</div>
      <div class="summary-bar"><div>Победы<b style="color:var(--green)">${wins}</b></div><div>Ничьи<b style="color:var(--orange)">${draws}</b></div><div>Поражения<b style="color:var(--red)">${losses}</b></div></div>

function genCoachSquad(clubStr){
  const squad=[];
  const positions=['GK','GK','CB','CB','CB','CB','LB','LB','RB','RB','CDM','CDM','CM','CM','CM','CAM','LW','RW','ST','ST'];
  positions.forEach((pos,i)=>{
    const base=clubStr+ri(-15,5);
    squad.push({
      id:i,name:randomName('es').split(' ')[1]+' '+ri(1,99),pos,
      age:ri(18,35),ovr:cl(base+ri(-8,8)),value:ri(1,80),wage:ri(1,15),
      injured:0,young:Math.random()<0.2
    });
  });
  return squad;
}
function genCoachTasks(){
  const pool=[
    {id:'top3',t:'Финишировать в топ-3',check:(r)=>r.position<=3},
    {id:'top8',t:'Финишировать в топ-8',check:(r)=>r.position<=8},
    {id:'wins15',t:'Выиграть 15+ матчей',check:(r)=>r.wins>=15},
    {id:'cup',t:'Дойти до 1/4 Кубка',check:(r)=>r.cupStage>=2},
    {id:'goals60',t:'Забить 60+ голов',check:(r)=>r.gf>=60}
  ].sort(()=>Math.random()-.5);
  return pool.slice(0,3).map(t=>({...t,done:false}));
}

function nextSeason(){
  if(p.god){godSkipSeason();return}
  const _st=['pac','sho','pas','dri','def','phy'];
  if(_st.every(s=>p[s]>=99)&&p.tp>0){
    const bonus=p.tp*200000;
    p.money+=bonus;
    showToast(`💰 Автосброс: ${p.tp} очков → €${fmt(bonus)}`,'success');
    p.tp=0;
  }
  p.season++;p.age++;
  if(Math.random()<.006){
    const crit=pick(CRITICAL);
    p.finished=true;p.endType=crit.type;p.endCause=crit.cause;
    save();showCriticalEvent(crit);return;
  }
  const ev=pick(EVENTS);
  p._pendingEvent=ev;
  showEventPreviewForNewSeason(ev);
}
function godSkipSeason(){
  for(let i=0;i<10;i++){
    p.season++;p.age++;p.money+=50000000;

    p.trophies.push({name:'ЛЧ',season:p.season});

}

function coachNextSeason(){
  const cd=p.coachData;cd.seasons++;p.age++;
  const tactic=TACTICS[cd.tactic]||TACTICS['4-2-3-1'];
  const squadStr=cd.squad.reduce((s,x)=>s+x.ovr,0)/cd.squad.length;
  const staffBonus=Object.keys(cd.staff).length*1.5;
  const teamStr=squadStr+tactic.atk*12+tactic.def*8+staffBonus+cd.reputation*0.10+(cd.budget/1e6)*0.03;
  const leagueKey=getPlayerLeague(cd.club.name);
  const leagueTier=LEAGUES[leagueKey]?.tier||2;
  const baseDifficulty=leagueTier===5?88:leagueTier===4?80:leagueTier===3?74:68;
  const numMatches=(leagueKey==='eng_prem'||leagueKey==='esp_laliga'||leagueKey==='ita_seriea')?38:34;
  let w=0,d=0,l=0,gf=0,ga=0;
  for(let i=0;i<numMatches;i++){
    const oppStr=baseDifficulty+ri(-12,12);
    const myStrength=teamStr+ri(-8,8);
    const myGoals=Math.max(0,Math.round((myStrength-oppStr)/12+1.2+ri(-1,1)));
    const oppGoals=Math.max(0,Math.round((oppStr-myStrength)/12+1.2+ri(-1,1)));
    gf+=myGoals;ga+=oppGoals;
    if(myGoals>oppGoals)w++;else if(myGoals<oppGoals)l++;else d++;
  }
  const pts=w*3+d;
  cd.matches+=numMatches;cd.wins+=w;cd.draws+=d;cd.losses+=l;cd.gf+=gf;cd.ga+=ga;
  const winRate=w/numMatches;
  let position;
  if(winRate>=0.75)position=ri(1,2);
  else if(winRate>=0.6)position=ri(2,5);
  else if(winRate>=0.45)position=ri(5,10);
  else if(winRate>=0.3)position=ri(10,15);
  else position=ri(15,20);
  cd.position=position;
  if(position===1&&winRate>=0.72){cd.trophies.push({name:'Чемпионат',season:cd.seasons});p.money+=ri(15,40)*1e6}
  if(Math.random()<0.15&&position<=8){cd.trophies.push({name:'Кубок',season:cd.seasons});p.money+=ri(5,15)*1e6}
  const delta=Math.round((winRate-0.45)*40);
  cd.reputation=cm(cd.reputation+delta);
  cd.boardRating=cm(cd.boardRating+Math.round(delta*0.8));
  cd.fanRating=cm(cd.fanRating+Math.round(delta*0.6));
  cd.budget+=Math.round((winRate-0.4)*30)*1e6;
  if(winRate>=0.7&&Math.random()<0.3){cd.awards=cd.awards||[];cd.awards.push({id:'best_league',n:'🥇 Тренер года',season:cd.seasons})}
  if(position===1&&Math.random()<0.15){cd.awards=cd.awards||[];cd.awards.push({id:'best_world',n:'👑 Лучший тренер мира',season:cd.seasons})}
  p.money+=ri(1,5)*1e6;
  cd.squad.forEach(s=>{if(s.injured>0)s.injured--;if(s.age<24)s.ovr=cl(s.ovr+ri(0,1));else if(s.age>30)s.ovr=cl(s.ovr-ri(0,1));s.age++});
  if(cd.boardRating<20||(position>=17&&Math.random()>0.6)){save();showCoachFired();return}
  cd.history=cd.history||[];
  cd.history.push({season:cd.seasons,club:cd.club.name,wins:w,draws:d,losses:l,gf,ga,pts,position,tactic:cd.tactic});
  save();render();showCoachSeasonRecap({wins:w,draws:d,losses:l,gf,ga,position});
}

  let html=`<div class="card" style="background:linear-gradient(135deg,#2a1a4a,#4a1a6a);text-align:center;color:#fff">

function findNewCoachClub(){
  const cd=p.coachData;
  const av=Object.values(LEAGUE_CLUBS).flat().filter(c=>(c.tier||2)<=(cd.club.tier||3));
  if(!av.length){p.coachMode=false;showEnd();return}
  const nc=pick(av);cd.club=nc;cd.reputation=cm(cd.reputation-15);cd.budget=ri(2,15)*1e6;cd.squad=genCoachSquad(nc.str-5);p.club=nc;
  addDiary(`Возглавил ${nc.name}`);save();showToast(`✅ ${nc.name}!`,'success');switchTab('home');
}
function coachMoveUp(){
  const cd=p.coachData;
  const b=Object.values(LEAGUE_CLUBS).flat().filter(c=>(c.tier||2)>(cd.club.tier||2));
  if(!b.length)return;
  const nc=pick(b);cd.club=nc;cd.budget+=ri(20,80)*1e6;cd.reputation=cm(cd.reputation-5);cd.squad=genCoachSquad(nc.str);p.club=nc;
  addDiary(`Перешёл в ${nc.name}`);save();showToast(`📈 ${nc.name}!`,'success');switchTab('home');
}
function startCoachMode(){
  p.coachMode=true;p.wasCoach=true;
  p.coachData={
    club:p.club,seasons:0,matches:0,wins:0,draws:0,losses:0,gf:0,ga:0,
    trophies:[],reputation:60,budget:0,tactic:'4-2-3-1',
    squad:genCoachSquad(p.club.str||70),staff:{},tasks:genCoachTasks(),
    history:[],awards:[],position:10,boardRating:60,fanRating:60,
    uclStage:0,cupStage:0,uclWin:false
  };
  save();showCoachScreen();
}

/* ============ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.awards)p.awards=[];
  if(!p.diary)p.diary=[];
  if(!p.twitter)p.twitter=[];
  if(!p.objectives)p.objectives=genObjectives();
  if(!p.manager)p.manager=MANAGERS[0];
  if(!p._leaguesPlayed)p._leaguesPlayed=[];
  if(!p._clClubs)p._clClubs=[];
  if(p._hatTricks===undefined)p._hatTricks=0;
  if(p._derbyGoals===undefined)p._derbyGoals=0;
  if(!p.socialMedia)p.socialMedia={instagram:0,tiktok:0,twitter:0,youtube:0};
  if(!p.socialFeed)p.socialFeed=[];
  if(!p.adBrands)p.adBrands=[];
  if(!p.family||Array.isArray(p.family))p.family={status:'single',partner:null,children:[],history:[],weddingYear:null};
  if(!p.media)p.media=[];
  if(!p.challenges)p.challenges=[];
  if(!p.businesses)p.businesses=[];
  if(!p.chronicInjuries)p.chronicInjuries=[];
  if(!p.friends)p.friends=[];
  if(!p.enemies)p.enemies=[];
  if(!p.avatar)p.avatar={skin:'🏼',hair:'Короткие',hairColor:'Коричневые',beard:'Нет',tattoo:'Нет'};
  if(p.playStyle===undefined)p.playStyle='balanced';
  if(p._styleBoost===undefined)p._styleBoost=1;
  if(!p.language)p.language={known:'ru',club:'en'};
  if(p.languageBarrier===undefined)p.languageBarrier=0;
  if(p.bootsContract===undefined)p.bootsContract=null;
  if(p.onBoard===undefined)p.onBoard=false;
  if(p.boardYears===undefined)p.boardYears=0;
  if(p.hasTaxAdvisor===undefined)p.hasTaxAdvisor=false;
  if(p._playedPenalty===undefined)p._playedPenalty=false;
  if(p._scoutBonus===undefined)p._scoutBonus=0;
  if(p._transferRequested===undefined)p._transferRequested=false;
  if(p._forcedTransfer===undefined)p._forcedTransfer=false;
  if(p._talkedPresident===undefined)p._talkedPresident=false;
  if(p._lastTalkSeason===undefined)p._lastTalkSeason=0;
  if(p.sonCareer===undefined)p.sonCareer=false;
  if(p.father===undefined)p.father=null;
  if(p._lastIncome===undefined)p._lastIncome=null;
  if(p.soundOn===undefined)p.soundOn=true;
  if(p.voiceOn===undefined)p.voiceOn=false;
  if(p.hapticOn===undefined)p.hapticOn=true;
  if(p.pushOn===undefined)p.pushOn=false;
  if(p.isCaptain===undefined)p.isCaptain=false;
  if(p._benched===undefined)p._benched=false;
  if(p.number===undefined)p.number=ri(5,99);
  if(p.gender===undefined)p.gender='m';
  if(p.coachData){
    if(!p.coachData.squad)p.coachData.squad=genCoachSquad(p.coachData.club?.str||70);
    if(!p.coachData.tactic)p.coachData.tactic='4-2-3-1';
    if(!p.coachData.tasks)p.coachData.tasks=genCoachTasks();
    if(!p.coachData.staff)p.coachData.staff={};
    if(!p.coachData.awards)p.coachData.awards=[];
    if(p.coachData.boardRating===undefined)p.coachData.boardRating=60;
    if(p.coachData.fanRating===undefined)p.coachData.fanRating=60;
    if(p.coachData.budget===undefined)p.coachData.budget=0;
  }
  document.documentElement.setAttribute('data-theme',p.theme==='light'?'light':'');
  $('statusBar').style.display='grid';
  $('statsBar').style.display='grid';
  $('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos||'—'} · ${p.ntName||'—'}</small>`;
  render();switchTab('home');
}else{
  if(!localStorage.getItem('mfc6_onboarded')){
    showOnboarding();
  } else {
    showMainMenu();
  }
}
</script>
</body>
</html>
