*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;overflow:hidden}

.hdr{background:linear-gradient(135deg,#4a148c,#7b1fa2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-weight:800;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:#fff}

.status>div{text-align:center;color:var(--muted);text-transform:uppercase}

.stats{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(180deg,#6a1b9a,#4a148c);padding:6px 2px;flex-shrink:0}

@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px;scrollbar-width:thin;scrollbar-color:#333 transparent}

.bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;background:var(--nav-bg);backdrop-filter:blur(20px);border-radius:28px;padding:8px 6px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.06);z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.55em;font-weight:600;cursor:pointer;transition:all .25s;padding:6px 10px;border-radius:20px;min-width:56px}
.nav-item.active{background:var(--nav-active);color:var(--blue)}
.nav-icon{font-size:1.6em;margin-bottom:2px;line-height:1}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--border);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.card-title{font-size:.65em;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between}
.card-title .hint{font-size:.85em;color:var(--muted);font-weight:500;text-transform:none}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:.82em;cursor:pointer;margin-top:6px;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-gray{background:#333}.btn-red{background:var(--red);font-size:.7em;padding:8px}
.btn-purple{background:var(--purple)}.btn-yellow{background:var(--orange);color:#000}
.btn-gold{background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000;font-weight:800}
.menu-btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:.9em;cursor:pointer;margin-bottom:8px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;animation:slideUp .5s ease}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu-btn .mb-icon{font-size:2em}.menu-btn .mb-info{flex:1}
.menu-btn .mb-title{font-size:1em;font-weight:800;margin-bottom:3px}
.menu-btn .mb-desc{font-size:.65em;opacity:.85;font-weight:500}
.mb-p1{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.mb-p2{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff}
.mb-p3{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff}
.mb-p4{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}
.mb-p5{background:linear-gradient(135deg,#ffeb3b,#fbc02d);color:#000}
.mb-p6{background:linear-gradient(135deg,#f44336,#b71c1c);color:#fff}
.event-box{background:linear-gradient(135deg,#2a1a0a,#3a2010);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;font-size:.78em;line-height:1.4;margin-bottom:10px}
.event-box b{color:var(--orange);font-size:.85em;display:block;margin-bottom:3px}
.dilemma-box{background:linear-gradient(135deg,#1a1a3a,#0f0f25);border:1px solid #3a3a7a;border-radius:12px;padding:14px;margin-bottom:10px}
.choice-btn{background:#2a2a4a;border:1.5px solid #4a4a7a;color:#e8e8e8;padding:11px;border-radius:9px;font-size:.78em;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;text-align:left;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:#3a3a6a;transform:translateX(3px)}
.relations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}

.text-center{text-align:center}.mb-8{margin-bottom:8px}
.muted{color:var(--muted);font-size:.7em}

.modal-title{font-size:.85em;font-weight:800;color:var(--yellow);margin-bottom:10px}

.tab-title{font-size:1.1em;font-weight:800;color:var(--yellow);margin-bottom:12px}
.input-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:100%;font-family:inherit;font-size:.85em}

.obj-card .prog{color:var(--muted);font-size:.85em}
.theme-toggle{display:flex;gap:6px;margin-bottom:10px}

.theme-btn.active{border-color:var(--green);background:var(--green);color:#fff}

.accordion-arrow{transition:transform .3s;color:var(--muted)}
.accordion.open .accordion-arrow{transform:rotate(180deg)}

function startDraft(){
  let myTeam=[],aiTeam=[],pool=[...DRAFT_LEGENDS].sort(()=>Math.random()-.5);
  function draftTurn(){
    if(myTeam.length>=11||pool.length===0){finishDraft(myTeam,aiTeam);return}
    let html=`<div class="tab-title">⚔️ ДРАФТ (${myTeam.length}/11)</div>
    <div class="card"><div class="card-title">ТВОЯ КОМАНДА</div><div style="font-size:.7em">${myTeam.map(l=>`${l.country} ${l.n}`).join(', ')||'Пусто'}</div></div>
    <div class="card-title">📋 ВЫБЕРИ ЛЕГЕНДУ</div>`;
    pool.slice(0,4).forEach((l,i)=>{html+=`<div class="story-card" onclick="pickLegend(${DRAFT_LEGENDS.indexOf(l)})"><div class="ttl">${l.country} ${l.n}</div><div class="desc">${l.pos} · OVR ${l.ovr}</div></div>`});
    content.innerHTML=html;
  }
  window.pickLegend=(idx)=>{
    const l=DRAFT_LEGENDS[idx];if(!l)return;
    myTeam.push(l);
    const poolIdx=pool.indexOf(l);if(poolIdx>=0)pool.splice(poolIdx,1);
    if(pool.length){const aiPick=pool.splice(ri(0,pool.length-1),1)[0];aiTeam.push(aiPick)}
    haptic(20);draftTurn();
  };
  window.finishDraft=(my,ai)=>{
    const mySum=my.reduce((s,l)=>s+l.ovr,0);const aiSum=ai.reduce((s,l)=>s+l.ovr,0);const win=mySum>aiSum;
    content.innerHTML=`<div class="tab-title">🏆 РЕЗУЛЬТАТ</div>
    <div class="card" style="text-align:center;background:linear-gradient(135deg,${win?'#2e7d32,#4caf50':'#c62828,#f44336'},#0a0a0a)">
      <div style="font-size:3em">${win?'🏆':'😢'}</div>
      <div style="font-size:1.5em;font-weight:900;color:#fff;margin-top:8px">${win?'ПОБЕДА!':'ПОРАЖЕНИЕ'}</div>
      <div style="font-size:.85em;color:#fff;margin-top:8px">Ты: ${mySum} · ИИ: ${aiSum}</div>
    </div>
    <button class="btn btn-gray" onclick="showMainMenu()">← В меню</button>`;
    if(win)playGoalSound();haptic(50);
  };
  draftTurn();
}

function goalProb(){const base=Math.min(.92,p.ovr/110);const formMult=1+p.form*.13;const posMult=p.pos==='GK'?.03:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?.12:p.pos==='CDM'?.22:p.pos==='CM'?.35:p.pos==='CAM'?.7:p.pos==='LW'||p.pos==='RW'||p.pos==='SS'?.75:1;return Math.min(.95,base*formMult*posMult*(p.injury?.5:1))}

function simMatch(opp,comp){
  const r={opp:opp.name,oppFlag:opp.flag,comp,tg:0,og:0,pg:0,assist:0,yellow:0,red:0,missed:false,comment:''};

  r.derby=!!derby;const bonus=derby?0.15:0;

function simLeague(){const m=[];const key=getPlayerLeague(p.club.name);const clubs=LEAGUE_CLUBS[key];const num=(key==='eng_prem'||key==='esp_laliga'||key==='ita_seriea')?38:34;for(let i=0;i<num;i++){let o;do{o=pick(clubs)}while(o.name===p.club.name);const r=simMatch(o,'Чемпионат');m.push(r);recordMatch('league',r)}return m}

  content.innerHTML=`<div class="tab-title">🛒 МАГАЗИН</div>
  <div class="card"><div class="card-title">💰 Баланс: €${fmt(p.money)}</div></div>
  <div class="card"><div class="card-title">🛍️ ТОВАРЫ</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">${SHOP.map(item=>{const h=(p.shopOwned||[]).includes(item.id);return`<button class="btn" ${h||p.money<item.p?'disabled':''} onclick="buyShop('${item.id}')" style="background:${h?'#4caf50':'#2a2a2a'};font-size:.6em;text-align:left;padding:8px"><b>${item.n}</b><br><small style="color:#ffeb3b">€${fmt(item.p)}</small><br><small style="color:#4caf50">${item.e}</small></button>`}).join('')}</div></div>
  <div class="card"><div class="card-title">👔 СПОНСОР</div>${p.sponsor?`<div class="detail-row"><span class="nm">${p.sponsor.name}</span><span class="val">€${fmt(p.sponsorValue)}/год</span></div>`:`<button class="btn btn-purple" onclick="offerSponsors()">🔍 Найти</button>`}</div>
  <div class="card"><div class="card-title">🎯 МИНИ-ИГРА</div><button class="btn btn-yellow" onclick="playPenalty((s)=>{showToast(s?'⚽ ГОЛ!':'❌ Мимо!',s?'#4caf50':'#f44336');if(s){p.money+=1;p.morale=cm(p.morale+5)}})">🎯 Пенальти (€1M)</button></div>`;
}
function buyShop(id){const item=SHOP.find(x=>x.id===id);if(!item)return;const o=p.shopOwned||[];if(o.includes(id)||p.money<item.p)return;p.money-=item.p;item.fn();if(id!=='crypto'&&id!=='transfer'&&id!=='extraTP')o.push(id);p.shopOwned=o;p.ovr=calcOvr();save();showToast('✅ Куплено!','success');showShopTab()}
function offerSponsors(){const sh=[...SPONSORS].sort(()=>Math.random()-.5).slice(0,3);let html=`<div class="modal-title">👔 Спонсоры</div>`;sh.forEach(s=>{const v=Math.round(p.salary*s.rate*(.7+Math.random()*.6));html+=`<div class="detail-row"><span class="nm">${s.name}</span><span class="val">€${fmt(v)}/год</span></div><button class="btn" onclick="signSponsor('${s.name}',${v})">Подписать</button>`});html+=`<button class="modal-close" onclick="closeModal()">Отмена</button>`;openModal(html)}
function signSponsor(n,v){const s=SPONSORS.find(x=>x.name===n);if(s){p.sponsor=s;p.sponsorValue=v}save();closeModal();showShopTab()}
/* ============ НОВЫЕ ФУНКЦИИ ============ */
function showSocialMedia(){
  if(!p.socialMedia)p.socialMedia={instagram:0,tiktok:0,twitter:0,youtube:0};
  const sm=p.socialMedia;const total=Object.values(sm).reduce((a,b)=>a+b,0);const income=Math.round(total/1000000*ri(1,3));
  content.innerHTML=`<div class="tab-title">📱 СОЦСЕТИ</div>
  <div class="card"><div class="card-title">📊 ПОДПИСЧИКИ</div>
    <div class="detail-row"><span class="nm">📷 Instagram</span><span class="val">${fmt(sm.instagram)}</span></div>
    <div class="detail-row"><span class="nm">🎵 TikTok</span><span class="val">${fmt(sm.tiktok)}</span></div>
    <div class="detail-row"><span class="nm">🐦 Twitter/X</span><span class="val">${fmt(sm.twitter)}</span></div>
    <div class="detail-row"><span class="nm">📹 YouTube</span><span class="val">${fmt(sm.youtube)}</span></div>
    <div class="detail-row" style="border-left:3px solid var(--green)"><span class="nm">💰 Доход</span><span class="val">€${income}M/год</span></div>
  </div>
  <div class="card"><div class="card-title">📣 ДЕЙСТВИЯ</div>
    <button class="btn" onclick="postSocial('instagram')">📷 Пост Instagram (€0.1M)</button>
    <button class="btn" onclick="postSocial('tiktok')">🎵 Видео TikTok (€0.1M)</button>
    <button class="btn" onclick="postSocial('twitter')">🐦 Твит (€0.05M)</button>
  </div>
  <button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
}
function postSocial(platform){const cost=platform==='twitter'?0.05:0.1;if(p.money<cost){showToast('⚠️','error');return}p.money-=cost;const gain=ri(10000,500000)*(1+p.fans/100);p.socialMedia[platform]+=Math.round(gain);p.fans=cm(p.fans+ri(1,3));showToast(`📱 +${fmt(gain)} подписчиков!`,'success');save();showSocialMedia()}
function showFamily(){
  if(!p.family)p.family=[];
  content.innerHTML=`<div class="tab-title">👨‍👩‍👧 СЕМЬЯ</div>
  <div class="card"><div class="card-title">📖 ИСТОРИЯ</div>${p.family.length?p.family.map(f=>`<div class="detail-row"><span class="nm">${f.year} · ${f.age} лет</span><span class="val" style="font-size:.85em;text-align:right;color:var(--text)">${f.t}</span></div>`).join(''):'<div class="muted text-center">Пока ничего</div>'}</div>
  <button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
}
function rollFamilyEvent(){
  if(!p.family)p.family=[];
  const EVENTS=[{y:22,t:"💕 Первая любовь",eff:()=>{p.morale=cm(p.morale+10)}},{y:25,t:"💍 Свадьба",eff:()=>{p.morale=cm(p.morale+15);p.money-=3}},{y:27,t:"👶 Первый ребёнок",eff:()=>{p.morale=cm(p.morale+20)}},{y:30,t:"👶 Второй ребёнок",eff:()=>{p.morale=cm(p.morale+15)}},{y:33,t:"💔 Развод",eff:()=>{p.morale=cm(p.morale-25);p.money-=10}}];
  const eligible=EVENTS.filter(e=>e.y<=p.age&&!p.family.some(f=>f.t===e.t));
  if(!eligible.length)return null;
  if(Math.random()>0.4)return null;
  const ev=pick(eligible);ev.eff();p.family.push({year:getYear(),age:p.age,t:ev.t});addDiary(ev.t);return ev;
}
function showAdBrands(){
  if(!p.adBrands)p.adBrands=[];
  let html=`<div class="tab-title">💼 РЕКЛАМА</div>
  <div class="card"><div class="card-title">✅ АКТИВНЫЕ</div>`;
  if(p.adBrands.length)p.adBrands.forEach(b=>{html+=`<div class="detail-row"><span class="nm">${b.n}</span><span class="val">€${b.pay}M/год</span></div>`});
  else html+=`<div class="muted text-center">Нет</div>`;
  html+=`</div><div class="card"><div class="card-title">🎁 ДОСТУПНЫЕ</div>`;
  AD_BRANDS.filter(b=>!p.adBrands.some(x=>x.n===b.n)).forEach(b=>{
    const can=p.ovr>=80&&p.fans>=60;
    html+=`<div class="detail-row"><span class="nm">${b.n}</span><span class="val">€${b.pay}M</span></div>${can?`<button class="btn" onclick="signAdBrand('${b.n}',${b.pay})" style="font-size:.7em">Подписать</button>`:''}`;
  });
  html+=`</div><button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
  content.innerHTML=html;
}
function signAdBrand(n,pay){p.adBrands.push({n,pay});p.money+=pay;addDiary(`Реклама: ${n}`);showToast(`💼 ${n}!`,'success');save();showAdBrands()}
function showMediaEmpire(){
  if(!p.media)p.media=[];
  let html=`<div class="tab-title">📹 МЕДИА</div><div class="card"><div class="card-title">✅ ПРОЕКТЫ</div>`;
  if(p.media.length)p.media.forEach(m=>{html+=`<div class="detail-row"><span class="nm">${m.n}</span><span class="val">+€${m.income}M/сезон</span></div>`});
  else html+=`<div class="muted text-center">Нет</div>`;
  html+=`</div><div class="card"><div class="card-title">🆕 ДОСТУПНЫЕ</div>`;
  MEDIA_TYPES.filter(m=>!p.media.some(x=>x.id===m.id)).forEach(m=>{
    const can=p.money>=m.cost;
    html+=`<div class="detail-row"><span class="nm">${m.n}<br><small>+€${m.income}M/сезон</small></span><span class="val">€${m.cost}M</span></div>${can?`<button class="btn" onclick="buyMedia('${m.id}')" style="font-size:.7em">Купить</button>`:''}`;
  });
  html+=`</div><button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
  content.innerHTML=html;
}
function buyMedia(id){const m=MEDIA_TYPES.find(x=>x.id===id);if(!m||p.money<m.cost)return;p.money-=m.cost;p.media.push({id:m.id,n:m.n,income:m.income});p.passive=(p.passive||0)+m.income;save();showToast(`✅ ${m.n}!`,'success');showMediaEmpire()}
function showMinigamesMenu(){
  content.innerHTML=`<div class="tab-title">🎮 МИНИ-ИГРЫ</div>
  <div class="card"><div class="card-title">🎯 ИСПЫТАЙ УДАЧУ</div>
    <button class="btn btn-yellow" onclick="playPenalty((s)=>{if(s){p.money+=2;p.morale=cm(p.morale+5);playGoalSound()}else{showToast('❌','error')}})">🎯 Пенальти</button>
    <button class="btn btn-yellow" onclick="playFreeKick((s)=>{if(s){p.money+=3;p.morale=cm(p.morale+6);playGoalSound()}else{showToast('❌','error')}})">🎯 Штрафной</button>
    <button class="btn btn-blue" onclick="playGoalkeeper((s)=>{if(s){p.money+=2;showToast('🧤!','success')}else{showToast('❌','error')}})">🧤 Вратарь</button>
  </div>
  <button class="btn btn-gray" onclick="switchTab('home')">← Назад</button>`;
}
/* ============ SETTINGS ============ */
function showSettingsTab(){
  content.innerHTML=`<div class="tab-title">⚙️ НАСТРОЙКИ</div>
  <div class="card"><div class="card-title">🔊 ЗВУК И УПРАВЛЕНИЕ</div>
    <button class="btn ${p.soundOn?'btn-blue':'btn-gray'}" onclick="p.soundOn=!p.soundOn;save();showSettingsTab()">${p.soundOn?'🔊 Звук вкл':'🔇 Звук выкл'}</button>
    <button class="btn ${p.voiceOn?'btn-blue':'btn-gray'}" onclick="p.voiceOn=!p.voiceOn;save();showSettingsTab()">${p.voiceOn?'🎙️ Голос вкл':'🔇 Голос выкл'}</button>
    <button class="btn ${p.hapticOn?'btn-blue':'btn-gray'}" onclick="p.hapticOn=!p.hapticOn;save();showSettingsTab()">${p.hapticOn?'📳 Вибрация вкл':'📴 Вибрация выкл'}</button>
  </div>
  <div class="card"><div class="card-title">🎨 ТЕМА</div>
    <div class="theme-toggle">
      <button class="theme-btn ${p.theme!=='light'?'active':''}" onclick="setTheme('dark')">🌙 Тёмная</button>
      <button class="theme-btn ${p.theme==='light'?'active':''}" onclick="setTheme('light')">☀️ Светлая</button>
    </div>
  </div>
  <div class="card"><div class="card-title">🏛️ ДОПОЛНИТЕЛЬНО</div>
    <button class="btn btn-purple" onclick="showHallOfFame()">🏛️ Зал славы</button>
    <button class="btn btn-blue" onclick="showCareerMap()">🗺️ Карта карьеры</button>
    <button class="btn btn-blue" onclick="showTopScorers()">⚽ Топ бомбардиров</button>
    <button class="btn btn-yellow" onclick="showChallenges()">🎯 Челленджи</button>
  </div>
  <div class="card"><div class="card-title">💾 СОХРАНЕНИЕ</div>
    <button class="btn btn-blue" onclick="save();showToast('✅ Сохранено!','success')">💾 Сохранить</button>
    <button class="btn btn-red" onclick="if(confirm('Сбросить?')){localStorage.removeItem('mfc4_slot'+currentSlot);location.reload()}">🗑 Сброс</button>
  </div>
  <button class="btn btn-gray" onclick="showMainMenu()">🏠 Главное меню</button>`;
}
function setTheme(t){p.theme=t;document.documentElement.setAttribute('data-theme',t==='light'?'light':'');save();showSettingsTab()}
function showHallOfFame(){
  const c=p.careerTotal||{goals:0};
  const fame=[{n:'Пеле',g:1283,zm:7,c:'🇧🇷'},{n:'Роналду',g:900,zm:5,c:'🇵🇹'},{n:'Месси',g:850,zm:8,c:'🇦🇷'},{n:'Мбаппе',g:400,zm:2,c:'🇫🇷'}];
  let html=`<div class="tab-title">🏛️ ЗАЛ СЛАВЫ</div>`;
  const all=[...fame,{n:p.name||'ТЫ',g:c.goals,zm:p.ballonDors||0,c:'⭐',me:true}];
  all.sort((a,b)=>b.g-a.g);
  all.forEach((l,i)=>{const clazz=l.me?'style="background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid var(--yellow)"':'';html+=`<div class="detail-row" ${clazz}><span class="nm">${i+1}. ${l.c} ${l.n}</span><span class="val">${l.g}⚽ ${l.zm}ЗМ</span></div>`});
  html+=`<button class="btn btn-gray" onclick="switchTab('settings')">← Назад</button>`;
  content.innerHTML=html;
}
function showCareerMap(){
  const cities=(p.history||[]).map(h=>h.club).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);
  let html=`<div class="tab-title">🗺️ КАРТА КАРЬЕРЫ</div>
  <div style="position:relative;height:300px;background:linear-gradient(180deg,#0a1a2a,#0a0a1a);border-radius:12px;overflow:hidden;border:1px solid #1a3a5a">`;
  cities.forEach((c,i)=>{
    const x=20+(i*10)%60;const y=20+(i*15)%60;
    html+=`<div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);text-align:center"><div style="width:10px;height:10px;background:#ffeb3b;border-radius:50%;box-shadow:0 0 12px #ffeb3b;margin:0 auto"></div><div style="font-size:.55em;color:#fff;margin-top:2px;white-space:nowrap">${c.substring(0,10)}</div></div>`;
  });
  html+=`</div><button class="btn btn-gray" onclick="switchTab('settings')">← Назад</button>`;
  content.innerHTML=html;
}
function showTopScorers(){
  const fame=[{n:'Пеле',g:1283,c:'🇧🇷'},{n:'Роналду',g:900,c:'🇵🇹'},{n:'Месси',g:850,c:'🇦🇷'},{n:'Мбаппе',g:400,c:'🇫🇷'}];
  let html=`<div class="tab-title">⚽ ТОП БОМБАРДИРОВ</div>`;
  const all=[...fame,{n:p.name||'ТЫ',g:p.careerTotal?.goals||0,c:'⭐',me:true}];
  all.sort((a,b)=>b.g-a.g);
  all.forEach((l,i)=>{const clazz=l.me?'style="background:linear-gradient(135deg,#2a2a0a,#1a1a05);border:1px solid var(--yellow)"':'';html+=`<div class="detail-row" ${clazz}><span class="nm">${i+1}. ${l.c} ${l.n}</span><span class="val">${l.g}</span></div>`});
  html+=`<button class="btn btn-gray" onclick="switchTab('settings')">← Назад</button>`;
  content.innerHTML=html;
}
function showChallenges(){
  let html=`<div class="tab-title">🎯 ЧЕЛЛЕНДЖИ</div>`;
  CHALLENGES_LIST.forEach(c=>{const done=(p.challenges||[]).includes(c.id);html+=`<div class="ach-card ${done?'':'locked'}"><div class="ttl">${done?'✅':'🔒'} ${c.n}</div><div class="desc">${c.d}</div></div>`});
  html+=`<button class="btn btn-gray" onclick="switchTab('settings')">← Назад</button>`;
  content.innerHTML=html;
}
/* ============ MODAL/FAB ============ */
function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show');haptic(10)}
function closeModal(){$('modal').classList.remove('show')}
function showFAB(action,icon='⚡'){let f=document.querySelector('.fab');if(f)f.remove();f=document.createElement('button');f.className='fab';f.innerHTML=icon;f.onclick=()=>{haptic(20);action()};document.getElementById('app').appendChild(f)}
function hideFAB(){const f=document.querySelector('.fab');if(f)f.remove()}
/* ============ ЗАПУСК ============ */
if(load()&&p.name){
  if(!p.career)p.career=newCareerStats();
  if(!p.careerTotal)p.careerTotal={matches:0,goals:0,assists:0,yellow:0,red:0,pen:0,fk:0};
  if(!p.awards)p.awards=[];
  if(!p.diary)p.diary=[];
  if(!p.twitter)p.twitter=[];
  if(!p.objectives)p.objectives=genObjectives();
  if(!p.manager)p.manager=MANAGERS[0];
  if(!p._leaguesPlayed)p._leaguesPlayed=[];
  if(!p.socialMedia)p.socialMedia={instagram:0,tiktok:0,twitter:0,youtube:0};
  if(!p.adBrands)p.adBrands=[];
  if(!p.family)p.family=[];
  if(!p.media)p.media=[];
  if(!p.challenges)p.challenges=[];
  if(p.soundOn===undefined)p.soundOn=true;
  if(p.voiceOn===undefined)p.voiceOn=false;
  if(p.hapticOn===undefined)p.hapticOn=true;
  if(p.isCaptain===undefined)p.isCaptain=false;
  if(p._benched===undefined)p._benched=false;
  document.documentElement.setAttribute('data-theme',p.theme==='light'?'light':'');
  $('statusBar').style.display='grid';$('statsBar').style.display='grid';$('bottomNav').style.display='flex';
  $('hdrName').innerHTML=`⚽ ${p.name.split(' ')[1]||p.name}<small>${p.pos||'—'} · ${p.ntName||'—'}</small>`;
  render();switchTab('home');
}else{
  showMainMenu();
}
</script>
